<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Tasks">
<title>My Tasks</title>
<link rel="manifest" href="kids-manifest.json">
<link rel="apple-touch-icon" href="icon-kitchen.png">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
  :root{ --bg:#f4f6fb; --card:#fff; --ink:#18202c; --muted:#677285; --line:#dde2ea; --accent:#2f5fb3; --accent-soft:#e4ecfa;
    --good:#2e7d4f; --good-soft:#dff1e6; --warn:#c2410c; --warn-soft:#fde7dc; --gold:#e0a400; --gold-soft:#fff4c2;
    --font:-apple-system, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif; color-scheme:light; }
  body.k2{ --accent:#7a4cc2; --accent-soft:#efe7fb; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#11151c; --card:#1a202b; --ink:#e8ecf3; --muted:#9aa5b8; --line:#2b3442; --accent:#7ea6f0; --accent-soft:#1f2c44;
      --good:#6fcf97; --good-soft:#1c3327; --warn:#f29a6b; --warn-soft:#3a2418; --gold:#ffd54a; --gold-soft:#3a3214; color-scheme:dark; }
    body.k2{ --accent:#b79af0; --accent-soft:#2c2142; }
  }
  *{box-sizing:border-box} html,body{margin:0} body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);-webkit-tap-highlight-color:transparent}
  button,input,textarea{font:inherit;color:inherit}
  #app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 30px)}
  header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
  h1{flex:1;margin:0;font-size:1.7rem;letter-spacing:-.02em}
  .sync{font-size:.75rem;color:var(--muted);text-align:right;min-width:6em}
  .gear{border:1.5px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;font-size:1.1rem;cursor:pointer}
  .alert{display:flex;gap:10px;align-items:center;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:16px;padding:12px 14px;margin-bottom:14px}
  .alert b{display:block}
  .alert.overdue{background:var(--warn-soft);border-color:var(--warn)}
  .section{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 4px 8px}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
  .card.soon{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,213,74,.25)}
  .card.late{border-color:var(--warn)}
  .card.new{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent)}
  .title{font-size:1.15rem;font-weight:700;line-height:1.25}
  .note{margin-top:6px;padding:6px 10px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:8px;white-space:pre-wrap}
  .due{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:8px;font-size:.9rem;color:var(--muted);font-weight:600}
  .due .when{color:var(--ink)} .due .rel{border-radius:20px;padding:2px 9px;background:var(--accent-soft);color:var(--accent);font-weight:700}
  .card.soon .rel{background:var(--gold-soft);color:#8a6400} .card.late .rel{background:var(--warn-soft);color:var(--warn)}
  .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .act{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 4px;font-weight:700;cursor:pointer}
  .act.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .act.done.on{background:var(--good);border-color:var(--good)} .act.help.on{background:var(--warn);border-color:var(--warn)}
  .mine{margin-top:8px;font-size:.88rem;color:var(--muted)}
  .remind{display:inline-block;margin-top:10px;color:var(--accent);font-weight:700;text-decoration:none;font-size:.9rem}
  .helpbox{display:grid;gap:8px;margin-top:10px}
  .helpbox textarea, .set input[type=tel]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
  .btn{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}
  .btn.ghost{background:none;color:var(--muted);border:1.5px solid var(--line)}
  .empty{text-align:center;color:var(--muted);padding:34px 10px;background:var(--card);border:1.5px dashed var(--line);border-radius:18px}
  .card.isdone{opacity:.65} .card.isdone .title{text-decoration:line-through}
  details summary{cursor:pointer;color:var(--muted);font-weight:700;margin:16px 4px 8px}
  .set{display:grid;gap:12px}
  .set label{display:grid;gap:4px;font-weight:600}
  .set .row{display:flex;gap:10px;align-items:center}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:#18202c;color:#fff;padding:10px 16px;border-radius:12px;display:none;max-width:90%;text-align:center;z-index:9}
  .ph{display:block;width:100%;height:190px;border:0;border-radius:12px;background:#0002 center/cover no-repeat;margin-top:8px;position:relative;padding:0;cursor:zoom-in}
  .ph.phsm{height:120px}
  .ph span{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.62);color:#fff;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:99px}
  .ph.phwait{background:repeating-linear-gradient(45deg,rgba(128,128,128,.12) 0 10px,rgba(128,128,128,.22) 10px 20px)}
  .ph.phwait span::after{content:' · loading…'}
  .phpick{display:block;text-align:center;cursor:pointer;margin-top:8px}
  #phview{position:fixed;inset:0;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;color:#ccc;font-size:.85rem;gap:10px}
  #phview img{max-width:100%;max-height:88vh;object-fit:contain}
  .rep{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:99px;background:rgba(128,128,128,.15);margin-left:6px;vertical-align:middle;white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
(function(){
  // Which kid this phone belongs to comes from the link: kids.html?kid=k1 or ?kid=k2
  const KIDS = {k1:{name:'Eric'}, k2:{name:'Lestina'}};   // names also set in kitchen.html
  const ok = u => /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u);
  const qs = new URLSearchParams(location.search);
  let KID = qs.get('kid'); try { if (!KIDS[KID]) KID = localStorage.getItem('kids-who') || 'k1'; localStorage.setItem('kids-who', KID); } catch(e){ if (!KIDS[KID]) KID='k1'; }
  if (!KIDS[KID]) KID = 'k1';
  document.body.classList.add(KID);
  const LS = 'kids-' + KID + '-v1';
  let SYNC_URL = '';
  try { const q = qs.get('sync'); if (q && ok(q)) { SYNC_URL = q; localStorage.setItem('kids-sync', q); } } catch(e){}
  if (!SYNC_URL) { try { const v = localStorage.getItem('kids-sync') || ''; if (ok(v)) SYNC_URL = v; } catch(e){} }
  if (SYNC_URL && (qs.get('sync') !== SYNC_URL || qs.get('kid') !== KID)) { try { history.replaceState(null, '', location.pathname + '?kid=' + KID + '&sync=' + SYNC_URL); } catch(e){} }

  // ---------- lock-screen reminders (OneSignal) ----------
  const ON_SITE = location.hostname === 'joebarcey.github.io';
  const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const STANDALONE = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  let pushState = 'off';   // off | ask | on | needhome | blocked
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  if (ON_SITE) OneSignalDeferred.push(async function(OneSignal){
    try {
      await OneSignal.init({ appId: 'ffe54041-4189-4d1b-9070-89a88ca14cbd',
        safari_web_id: 'web.onesignal.auto.39e347a3-7290-467c-af89-3542a6fc2365',
        serviceWorkerPath: 'home-hub/OneSignalSDKWorker.js', serviceWorkerParam: { scope: '/home-hub/' } });
      await OneSignal.login('kid-' + KID);
      const upd = () => { pushState = OneSignal.Notifications.permission ? 'on' : (Notification && Notification.permission === 'denied' ? 'blocked' : 'ask'); render(); };
      OneSignal.Notifications.addEventListener('permissionChange', upd);
      window.__askPush = async () => { try { await OneSignal.Notifications.requestPermission(); } catch(e){} upd(); };
      upd();
    } catch(e){ pushState = 'off'; }
  });
  if (ON_SITE && IS_IOS && !STANDALONE) pushState = 'needhome';
  function cancelPush(id){ if (SYNC_URL) fetch(SYNC_URL + '?action=push', {method:'POST', body: JSON.stringify({op:'cancel', id})}).catch(()=>{}); }

  const app = document.getElementById('app');
  const now = () => Date.now();
  const esc = s => { const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; };
  // Saved on this phone: the tasks Mom sent (copy), my replies, and my settings
  let S = { chores:[], r:{}, phone:'', autoText:true, dirty:false };
  try { Object.assign(S, JSON.parse(localStorage.getItem(LS) || '{}')); } catch(e){}
  function store(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){} }

  // ---------- repeating tasks: a rule (days of the week + time) makes one task each time it comes due ----------
  // Both apps work out the same tasks with the same ids (rule id + date), so they always match.
  const ymd = d => d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  function repWindow(r){
    const t = now(), d0 = new Date(t); d0.setHours(0,0,0,0);
    const [hh, mm] = String(r.time || '20:00').split(':').map(Number);
    let prev = 0, next = 0;
    for (let i = -8; i <= 8; i++){
      const day = new Date(d0); day.setDate(d0.getDate() + i);
      if (!(r.days || []).includes(day.getDay())) continue;
      day.setHours(hh, mm, 0, 0); const due = day.getTime();
      if (due <= t) { if (due >= (r.c || 0)) prev = due; } else if (!next) next = due;
    }
    // the last one that came due (since the rule was made) and the next one coming
    return [prev, next].filter(Boolean).map(due => ({id: r.id + '-' + ymd(new Date(due)), rep: r.id, to: r.to, text: r.text, note: r.note || '', due, lead: r.lead || 60}));
  }
  const DAYN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function repText(r){
    const [hh, mm] = String(r.time || '20:00').split(':').map(Number), d = new Date(); d.setHours(hh, mm, 0, 0);
    const tm = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}), ds = r.days || [];
    return (ds.length === 7 ? 'Every day' : ds.length === 1 ? 'Every ' + DAYN[ds[0]] : ds.map(x => DAYN[x].slice(0,3)).join(', ')) + ' · ' + tm;
  }

  // ---------- task photos: small JPEGs kept on this phone and in a private Drive folder (through the Google script) ----------
  const phMem = {}, phAsked = {};
  function phGet(pid, v){
    if (!v) return '';
    if (phMem[pid] && phMem[pid].v === v) return phMem[pid].d;
    try { const c = JSON.parse(localStorage.getItem('ph-' + pid) || 'null'); if (c && c.v === v) { phMem[pid] = c; return c.d; } } catch(e){}
    return '';
  }
  function phKeep(pid, v, d){
    phMem[pid] = {v, d};
    try { localStorage.setItem('ph-' + pid, JSON.stringify({v, d})); }
    catch(e){ // phone storage full: drop the saved photos (they download again when needed)
      try { Object.keys(localStorage).filter(k => k.indexOf('ph-') === 0).forEach(k => localStorage.removeItem(k)); localStorage.setItem('ph-' + pid, JSON.stringify({v, d})); } catch(e2){} }
  }
  // Fill in any photo boxes on screen that haven't been downloaded yet
  function phLoad(){
    document.querySelectorAll('[data-ph]').forEach(el => {
      const [pid, vs] = el.dataset.ph.split('|'), v = +vs, d = phGet(pid, v);
      if (d) { el.style.backgroundImage = 'url(' + d + ')'; el.classList.remove('phwait'); return; }
      if (!SYNC_URL || now() - (phAsked[pid + v] || 0) < 15000) return;
      phAsked[pid + v] = now();
      fetch(SYNC_URL + '?action=photo&id=' + encodeURIComponent(pid) + '&t=' + now(), {cache:'no-store'}).then(r => r.json()).then(j => {
        if (!j || !j.ok || !j.data) return;
        phAsked[pid + v] = 9e15; phKeep(pid, v, 'data:image/jpeg;base64,' + j.data); phLoad();
      }).catch(() => {});
    });
  }
  function phHtml(pid, v, label, small){
    if (!v) return '';
    const d = phGet(pid, v);
    return `<button type="button" class="ph${small ? ' phsm' : ''}${d ? '' : ' phwait'}" data-ph="${pid}|${v}" style="${d ? 'background-image:url(' + d + ')' : ''}" aria-label="${label}, tap to enlarge"><span>${label}</span></button>`;
  }
  // Shrink a camera picture to about 100 KB, keeping its shape
  function phShrink(file){
    return new Promise((res, rej) => {
      const rd = new FileReader();
      rd.onload = () => { const img = new Image(); img.onload = () => {
        const sc = Math.min(1, 1000 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
        cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', 0.7)); }; img.onerror = rej; img.src = rd.result; };
      rd.onerror = rej; rd.readAsDataURL(file);
    });
  }
  function phSend(pid, d, v){
    v = v || now(); phKeep(pid, v, d);
    if (!SYNC_URL) return Promise.resolve(v);
    return fetch(SYNC_URL + '?action=photo', {method:'POST', body: JSON.stringify({id: pid, data: d.split(',')[1]})})
      .then(r => r.json()).then(j => { if (!j || !j.ok) throw new Error('photo'); return v; });
  }
  function phDel(pid){ if (SYNC_URL) fetch(SYNC_URL + '?action=photo', {method:'POST', body: JSON.stringify({id: pid, data: ''})}).catch(() => {}); }
  // Tap a photo to see it full screen; tap again to close
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('[data-ph]'); if (!b) return;
    const [pid, vs] = b.dataset.ph.split('|'), d = phGet(pid, +vs); if (!d) return;
    const o = document.createElement('div'); o.id = 'phview'; o.innerHTML = '<img alt=""><div>Tap to close</div>'; o.querySelector('img').src = d;
    o.onclick = () => o.remove(); document.body.appendChild(o);
  });

  let status = SYNC_URL ? '' : 'none', last = 0, busy = false, again = false; const ensured = {};
  async function sync(){
    if (!SYNC_URL) return;
    if (busy){ again = true; return; }
    busy = true;
    try {
      const k = await (await fetch(SYNC_URL + '?action=get&space=kitchen&t=' + now(), {cache:'no-store'})).json();
      const all = ((k && k.chores) || []).filter(c => c.to===KID), win = [];
      ((k && k.repeats) || []).filter(r => r.to===KID && !r.del).forEach(r => repWindow(r).forEach(x => win.push(x)));
      const winIds = new Set(win.map(x => x.id)), have = new Set(all.map(c => c.id));
      // Mom's tasks, plus this week's repeating ones (older repeats that were missed drop off)
      S.chores = all.filter(c => !c.del && c.status !== 'missed' && (!c.rep || winIds.has(c.id))).concat(win.filter(x => !have.has(x.id)));
      const known = new Set(all.filter(c => !c.del).map(c => c.id).concat([...winIds]));
      const mine = await (await fetch(SYNC_URL + '?action=get&space=kid' + KID + '&t=' + now(), {cache:'no-store'})).json();
      const rr = (mine && mine.r) || {};
      Object.keys(rr).forEach(id => { if (!S.r[id] || (rr[id].u||0) > (S.r[id].u||0)) S.r[id] = rr[id]; });
      // anything new gets marked as seen, so Mom knows it reached the phone
      S.chores.forEach(c => { if (!S.r[c.id]) { S.r[c.id] = {s:'seen', u:now()}; S.dirty = true; } });
      // forget replies to tasks Mom deleted
      Object.keys(S.r).forEach(id => { if (!known.has(id)) { delete S.r[id]; S.dirty = true; } });
      // make sure lock-screen reminders are set for the next repeating ones (the server skips ones already set)
      S.chores.forEach(c => { if (c.rep && c.due > now() && stOf(c) !== 'done' && !ensured[c.id]) { ensured[c.id] = 1;
        fetch(SYNC_URL + '?action=push', {method:'POST', body: JSON.stringify({op:'ensure', id:c.id, kid:KID, text:c.text, due:c.due, lead:c.lead})}).catch(()=>{}); } });
      if (S.dirty || JSON.stringify(rr) !== JSON.stringify(S.r)) {
        const p = await fetch(SYNC_URL + '?space=kid' + KID, {method:'POST', body: JSON.stringify({r:S.r})});
        if (p.ok) S.dirty = false;
      }
      store(); status = 'ok'; last = now();
    } catch(e){ status = 'off'; }
    busy = false;
    refresh();
    if (again){ again = false; sync(); }
  }

  // ---------- reminders ----------
  const remindAt = c => c.due ? c.due - (c.lead||60)*60000 : null;
  const stOf = c => (S.r[c.id] && S.r[c.id].s) || 'new';
  function rel(ms){
    let m = Math.round((ms - now())/60000), late = m < 0; m = Math.abs(m);
    const t = m < 60 ? m + ' min' : m < 1440 ? Math.floor(m/60) + 'h' + (m%60 ? ' ' + (m%60) + 'm' : '') : Math.round(m/1440) + ' day' + (Math.round(m/1440)>1?'s':'');
    return late ? 'late by ' + t : 'in ' + t;
  }
  function fmtDue(ms){
    if (!ms) return 'No due time';
    const d = new Date(ms), t0 = new Date(); t0.setHours(0,0,0,0);
    const days = Math.round((new Date(ms).setHours(0,0,0,0) - t0) / 864e5);
    const day = days===0 ? 'Today' : days===1 ? 'Tomorrow' : days===-1 ? 'Yesterday' : d.toLocaleDateString([], {weekday:'short', month:'numeric', day:'numeric'});
    return day + ' at ' + d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  }
  // A real phone reminder: opens Calendar with an alert set before the due time
  function icsHref(c){
    const z = ms => new Date(ms).toISOString().replace(/[-:]/g,'').replace(/\.\d+/, '');
    const clean = t => String(t||'').replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
    const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Family Tasks//EN','BEGIN:VEVENT',
      'UID:' + c.id + '@familytasks', 'DTSTAMP:' + z(now()), 'DTSTART:' + z(c.due), 'DTEND:' + z(c.due + 15*60000),
      'SUMMARY:' + clean(c.text), 'DESCRIPTION:' + clean(c.note || 'Task from Mom'),
      'BEGIN:VALARM','TRIGGER:-PT' + (c.lead||60) + 'M','ACTION:DISPLAY','DESCRIPTION:' + clean(c.text),'END:VALARM',
      'BEGIN:VALARM','TRIGGER:PT0M','REPEAT:12','DURATION:PT5M','ACTION:DISPLAY','DESCRIPTION:Due now: ' + clean(c.text),'END:VALARM',
      'END:VEVENT','END:VCALENDAR'].join('\r\n');
    return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
  }

  // ---------- replies (saved for Mom's app, and optionally a text) ----------
  const LABEL = {onit:'👍 On it', done:'✔ Done', help:'✋ Need help'};
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  function reply(c, s, text, ph){
    S.r[c.id] = {s, t: text || '', u: now(), ph: ph || (S.r[c.id] && S.r[c.id].ph) || 0}; S.dirty = true; store(); helpOpen = null; render(); sync();
    if (s === 'done') cancelPush(c.id);
    toast(s==='done' ? 'Nice. Mom can see it’s done.' : s==='help' ? 'Sent to Mom.' : 'Mom can see you’re on it.');
    if (S.autoText && S.phone) {
      const body = `${LABEL[s].replace(/^\S+\s/, '')}: ${c.text}${text ? ' — ' + text : ''}`;
      setTimeout(() => { location.href = 'sms:' + S.phone.replace(/[^\d+]/g,'') + (isIOS ? '&' : '?') + 'body=' + encodeURIComponent(body); }, 400);
    }
  }

  // ---------- screens ----------
  let view = 'list', helpOpen = null;
  function render(){
    if (!SYNC_URL && ON_SITE) return renderConnect();
    if (view === 'settings') return renderSettings();
    const all = S.chores.slice().sort((a,b)=>(a.due||9e15)-(b.due||9e15));
    const open = all.filter(c => stOf(c) !== 'done'), done = all.filter(c => stOf(c) === 'done');
    const late = open.filter(c => c.due && now() >= c.due);
    const soon = open.filter(c => c.due && now() >= remindAt(c) && now() < c.due);
    const cardHtml = c => {
      const st = stOf(c), late = c.due && c.due < now() && st!=='done', isSoon = !late && c.due && now() >= remindAt(c) && st!=='done';
      const r = S.r[c.id] || {};
      return `<div class="card ${late?'late':isSoon?'soon':''} ${st==='new'||st==='seen'?(st==='new'?'new':''):''} ${st==='done'?'isdone':''}">
        <div class="title">${esc(c.text)}${c.rep ? '<span class="rep">🔁 repeats</span>' : ''}</div>
        ${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}
        ${phHtml('task-' + c.id + '-m', c.ph, '📷 Photo from Mom')}
        <div class="due"><span class="when">⏰ ${fmtDue(c.due)}</span>${c.due && st!=='done' ? `<span class="rel">${rel(c.due)}</span>` : ''}</div>
        ${st!=='done' ? `<div class="acts">
          <button class="act ${st==='onit'?'on':''}" data-r="onit|${c.id}">👍 On it</button>
          <button class="act done ${st==='done'?'on':''}" data-r="done|${c.id}">✔ Done</button>
          <button class="act help ${st==='help'?'on':''}" data-help="${c.id}">✋ Help</button>
          <label class="act photo" style="grid-column:1/-1;text-align:center">📷 Done + send Mom a photo<input type="file" accept="image/*" data-phdone="${c.id}" hidden></label></div>` : ''}
        ${st==='done' ? phHtml('task-' + c.id + '-k', r.ph, '📷 Your photo') +
          `<label class="btn ghost phpick">📷 ${r.ph ? 'Send a different photo' : 'Send Mom a photo'}<input type="file" accept="image/*" data-phdone="${c.id}" hidden></label>` : ''}
        ${helpOpen===c.id ? `<div class="helpbox"><textarea id="helpt" rows="2" placeholder="What do you need? (optional)"></textarea>
          <div class="acts" style="grid-template-columns:1fr 1fr;margin:0"><button class="btn ghost" data-helpcancel>Cancel</button><button class="btn" data-helpsend="${c.id}">Send to Mom</button></div></div>` : ''}
        ${r.s && r.s!=='seen' ? `<div class="mine">You said ${LABEL[r.s]}${r.t ? ': “' + esc(r.t) + '”' : ''} · ${new Date(r.u).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}</div>` : ''}
        ${c.due && st!=='done' && c.due > now() ? `<a class="remind" href="${icsHref(c)}" download="task.ics">＋ Add phone reminder (${(c.lead||60) >= 60 ? (c.lead/60) + ' hr' : c.lead + ' min'} before)</a>` : ''}
      </div>`;
    };
    app.innerHTML = `<header><h1>Hi, ${esc(KIDS[KID].name)} 👋</h1><div class="sync">${status==='ok' ? 'Synced ' + new Date(last).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : status==='off' ? 'Offline' : status==='none' ? 'Not linked' : '…'}</div><button class="gear" id="gear" aria-label="Settings">⚙️</button></header>` +
      (late.length ? `<div class="alert overdue"><span style="font-size:1.6rem">💬</span><div><b>Mom${late.length > 1 ? ' · ' + late.length + ' tasks overdue' : ''}</b>${esc(nagText(late[0]))}<div class="mine" style="margin-top:4px">Tap ✔ Done to make it stop.</div></div></div>` : '') +
      (soon.length ? `<div class="alert"><span style="font-size:1.6rem">⏰</span><div><b>${soon.length > 1 ? soon.length + ' tasks due soon' : 'Heads up: due ' + rel(soon[0].due).replace('in ', 'in ')}</b>${soon.slice(0,3).map(c => esc(c.text)).join(' · ')}</div></div>` : '') +
      (pushState==='ask' ? `<div class="alert" style="background:var(--accent-soft);border-color:var(--accent)"><span style="font-size:1.4rem">🔔</span><div style="flex:1"><b>Turn on reminders</b>So Mom’s reminders show up even when the app is closed.</div><button class="btn" id="pushon">Turn on</button></div>` : '') +
      (pushState==='needhome' ? `<div class="alert" style="background:var(--accent-soft);border-color:var(--accent)"><span style="font-size:1.4rem">📲</span><div><b>Add this to your Home Screen</b>Tap Share, then Add to Home Screen, then open it from the icon to turn on reminders.</div></div>` : '') +
      (pushState==='blocked' ? `<div class="alert"><span style="font-size:1.4rem">🔕</span><div><b>Reminders are blocked</b>Turn them on in your phone’s Settings → Notifications → My Tasks.</div></div>` : '') +
      (!S.phone ? `<div class="alert" style="background:var(--accent-soft);border-color:var(--accent)"><span style="font-size:1.4rem">💬</span><div>Add Mom’s number in <b style="display:inline">⚙️ Settings</b> so your replies can also go by text.</div></div>` : '') +
      `<div class="section">To do · ${open.length}</div>` +
      (open.length ? open.map(cardHtml).join('') : `<div class="empty">Nothing to do right now. 🎉</div>`) +
      (done.length ? `<details><summary>✔ Done · ${done.length}</summary>${done.map(cardHtml).join('')}</details>` : '');
    document.getElementById('gear').onclick = () => { view = 'settings'; render(); };
    const po = document.getElementById('pushon'); if (po) po.onclick = () => { if (window.__askPush) window.__askPush(); };
    app.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { const [s,id] = b.dataset.r.split('|'); const c = S.chores.find(x=>x.id===id); if (c) reply(c, s); });
    app.querySelectorAll('[data-help]').forEach(b => b.onclick = () => { helpOpen = b.dataset.help; render(); const t = document.getElementById('helpt'); if (t) t.focus(); });
    app.querySelectorAll('[data-phdone]').forEach(inp => inp.onchange = async () => {
      const c = S.chores.find(x => x.id === inp.dataset.phdone), fl = inp.files && inp.files[0]; if (!c || !fl) return;
      toast('Sending your photo…');
      try { const d = await phShrink(fl), v = await phSend('task-' + c.id + '-k', d); reply(c, 'done', (S.r[c.id] && S.r[c.id].s === 'done' && S.r[c.id].t) || '', v); toast('Photo sent. Mom can see it’s done. 📷'); }
      catch(e){ toast('The photo didn’t send. Check your signal and try again.'); }
    });
    phLoad();
    const hc = app.querySelector('[data-helpcancel]'); if (hc) hc.onclick = () => { helpOpen = null; render(); };
    const hs = app.querySelector('[data-helpsend]'); if (hs) hs.onclick = () => { const c = S.chores.find(x=>x.id===hs.dataset.helpsend); if (c) reply(c, 'help', document.getElementById('helpt').value.trim()); };
  }
  // The home-screen icon can open without the link; paste it once to connect (kid and sync both come from it)
  function renderConnect(){
    app.innerHTML = `<header><h1>Connect</h1></header><div class="card set">
      <b>Paste your My Tasks link</b><div class="mine" style="margin-top:0">Copy the link from the text Mom or Dad sent you, paste it here, and tap Connect.</div>
      <input type="url" id="cl" placeholder="Paste the link here" autocomplete="off" style="width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg)">
      <button class="btn" id="cbtn">Connect</button></div>`;
    document.getElementById('cbtn').onclick = () => {
      const raw = document.getElementById('cl').value.trim();
      const sm = raw.match(/https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/), km = raw.match(/[?&]kid=(k[12])/);
      if (!sm) { toast("That doesn't look like the right link. Copy the whole link and try again."); return; }
      try { localStorage.setItem('kids-sync', sm[0]); if (km) localStorage.setItem('kids-who', km[1]); } catch(e){}
      location.replace(location.pathname + '?kid=' + (km ? km[1] : KID) + '&sync=' + sm[0]);
    };
  }
  function renderSettings(){
    app.innerHTML = `<header><h1>Settings</h1><button class="gear" id="back" aria-label="Back">✕</button></header>
      <div class="card set">
        <label>Mom’s phone number<input type="tel" id="ph" value="${esc(S.phone)}" placeholder="330-555-0123" autocomplete="tel"></label>
        <label class="row"><input type="checkbox" id="at" ${S.autoText?'checked':''} style="width:22px;height:22px"> Open a text to Mom when I reply</label>
        <div class="mine">Your replies always show up in Mom’s Kitchen app. The text is extra: it opens ready to go, and you tap Send.</div>
        <button class="btn" id="saveset">Save</button>
      </div>`;
    document.getElementById('back').onclick = () => { view = 'list'; render(); };
    document.getElementById('saveset').onclick = () => { S.phone = document.getElementById('ph').value.trim(); S.autoText = document.getElementById('at').checked; store(); view = 'list'; render(); toast('Saved'); };
  }
  let lastTouch = 0;
  ['pointerdown','touchstart','keydown','scroll'].forEach(ev => window.addEventListener(ev, () => { lastTouch = now(); }, {passive:true, capture:true}));
  function refresh(){
    const a = document.activeElement;
    if (view !== 'list' || helpOpen || (a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA')) || now() - lastTouch < 2500) { setTimeout(refresh, 1500); return; }
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }
  let toastT = null;
  function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 5000); }

  // While the app is open: when a task crosses into its reminder window, buzz (Android) and show the heads-up
  // Mom's overdue messages: one step angrier every 5 minutes
  const NAGS = [
    "Hey sweetie, “{t}” was due just now. Whenever you’re ready. 🙂",
    "Just checking… “{t}” still isn’t done. I’m sure you’re on it.",
    "Hmm. “{t}.” Still waiting. I carried you for nine months, you know.",
    "I’m not mad. I’m just… disappointed. “{t}.”",
    "Do you know how many times I’ve asked? Me neither. I lost count. “{t}.”",
    "{N}. Full name. You know what that means. “{t}.” Now.",
    "I’m not asking again. (I am, every 5 minutes, but still.) “{t}!”",
    "I’ve started telling the dogs they’re my favorite. “{t},” {n}.",
    "This is the face I’m making right now: 😤 “{t}.”",
    "I raised you better than this. “{t}.” Go. Now. 😤😤"
  ];
  function nagText(c){
    const lvl = Math.min(NAGS.length - 1, Math.floor((now() - c.due) / (5*60000)));
    const nm = KIDS[KID].name;
    return NAGS[Math.max(0, lvl)].replace(/\{t\}/g, c.text).replace(/\{N\}/g, nm.toUpperCase()).replace(/\{n\}/g, nm);
  }
  let warned = {}, nagged = {};
  function buzz(msg){ try { navigator.vibrate && navigator.vibrate([300,120,300,120,300]); } catch(e){} toast(msg); }
  function checkReminders(){
    let soonHit = null, lateHit = null;
    S.chores.forEach(c => {
      if (stOf(c)==='done' || !c.due) return;
      if (now() >= c.due) { if (!nagged[c.id] || now() - nagged[c.id] >= 5*60000) { nagged[c.id] = now(); lateHit = c; } }
      else if (now() >= remindAt(c) && !warned[c.id]) { warned[c.id] = 1; soonHit = c; }
    });
    if (lateHit) buzz('💬 Mom: ' + nagText(lateHit));
    else if (soonHit) buzz('⏰ Due ' + rel(soonHit.due) + ': ' + soonHit.text);
  }
  S.chores.forEach(c => { if (c.due && now() >= remindAt(c) && now() < c.due) warned[c.id] = 1; });
  setInterval(() => { checkReminders(); refresh(); }, 30000);
  setTimeout(checkReminders, 1500);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
  setInterval(() => { if (document.visibilityState !== 'hidden') sync(); }, 20000);
  render(); sync();
})();
</script>
</body>
</html>
