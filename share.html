<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Project">
<meta name="robots" content="noindex">
<title>Shared project</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merienda:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#000; --card:#121212; --ink:#f2f2f2; --muted:#9a9a9a; --line:#2a2a2a; --good:#7dff9a; --accent:#5fd3ff; --warn:#ffb35c;
    --font:-apple-system,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif; color-scheme:dark; }
  *{box-sizing:border-box} html,body{margin:0} body{background:var(--bg);color:var(--ink);font:17px/1.4 var(--font);-webkit-tap-highlight-color:transparent}
  button,input{font:inherit;color:inherit}
  #app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 30px)}
  header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  h1{flex:1;margin:0;font:800 1.7rem/1.15 "Merienda",var(--font)}
  .sub{color:var(--muted);font-size:.85rem}
  .me{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:.85rem;font-weight:700;cursor:pointer;white-space:nowrap}
  .dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:5px;vertical-align:-1px}
  .bar{height:8px;background:#222;border-radius:9px;overflow:hidden;margin:8px 0 14px} .bar i{display:block;height:100%;background:var(--good)}
  .tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
  .tabs .new{display:inline-block;background:var(--warn);color:#000;border-radius:99px;font-size:.72rem;padding:0 6px;margin-left:4px;vertical-align:1px}
  .chat{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .msg{max-width:82%;padding:8px 11px;border-radius:16px;background:#1c1c1c;align-self:flex-start;border-bottom-left-radius:5px}
  .msg.mine{align-self:flex-end;background:#16351f;border-bottom-left-radius:16px;border-bottom-right-radius:5px}
  .msg .nm{font-size:.74rem;font-weight:800;margin-bottom:2px} .msg .tm{font-size:.68rem;color:var(--muted);margin-top:3px;text-align:right}
  .msg .tx{white-space:pre-wrap;overflow-wrap:anywhere}
  .msg img{display:block;max-width:100%;max-height:300px;border-radius:10px;margin:4px 0;background:#222;min-width:120px;min-height:80px;cursor:zoom-in}
  .compose{position:sticky;bottom:0;background:var(--bg);padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 6px);display:flex;gap:8px;align-items:flex-end}
  .compose textarea{flex:1;min-width:0;background:#111;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-size:16px;resize:none;max-height:120px}
  .pic{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:1.1rem}
  #big{position:fixed;inset:0;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;z-index:9} #big img{max-width:100%;max-height:100%}
  .tabs button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-weight:700;cursor:pointer}
  .tabs button[aria-selected="true"]{border-color:var(--ink);background:#1d1d1d}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:4px 12px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
  .row:first-child{border-top:0}
  .box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid #555;display:flex;align-items:center;justify-content:center;font-weight:900}
  .row.done .box{background:var(--good);border-color:var(--good);color:#000}
  .row.done .t{color:var(--muted);text-decoration:line-through}
  .t{display:block} .who{display:inline-block;font-size:.74rem;font-weight:800;padding:1px 8px;border-radius:99px;margin:3px 5px 0 0;color:#000}
  .add{display:flex;gap:8px;margin:6px 0 16px} .add input{flex:1;min-width:0;background:#111;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px}
  .btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;background:var(--good);color:#000;cursor:pointer}
  .empty{color:var(--muted);text-align:center;padding:26px 10px}
  .colors{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 16px} .colors button{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer}
  .colors button[aria-checked="true"]{border-color:#fff}
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:#f2f2f2;color:#000;padding:10px 16px;border-radius:12px;font-weight:600;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
(() => {
  // The link looks like share.html#s=<project key>&a=<server id>. Nothing else of Home Hub is reachable from this page.
  const P = new URLSearchParams(location.hash.slice(1));
  const TOK = P.get('s') || '', AID = (P.get('a') || '').replace(/[^\w-]/g, '');
  const API = AID ? 'https://script.google.com/macros/s/' + AID + '/exec' : '';
  const app = document.getElementById('app');
  const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };
  const COLORS = ['#ff9f43','#7bbcff','#ff6b9a','#c49bff','#ffe66b','#4fe0c0','#ff7a5c','#a3e05a'];
  const OWNER_C = '#7dff9a';
  let me = null; try { me = JSON.parse(localStorage.getItem('hh-share-me') || 'null'); } catch(e){}
  let proj = null, tab = 'steps', err = '', busy = false, setup = !me;
  try { tab = localStorage.getItem('hh-share-tab-' + TOK) || 'steps'; } catch(e){}
  let tt = null; const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', 2600); };

  async function load(){
    if (!API || !TOK) { err = 'This link is incomplete. Ask for the link again.'; return render(); }
    try {
      const j = await fetch(API + '?action=share&s=' + encodeURIComponent(TOK) + '&t=' + Date.now(), {cache:'no-store'}).then(r => r.json());
      if (j && j.ok) { proj = j; err = ''; } else err = (j && j.error) || 'Couldn’t load the project.';
    } catch(e){ if (!proj) err = 'Couldn’t reach the project. Check your signal and try again.'; }
    if (setup) { const h = app.querySelector('h1'); if (h && proj) h.textContent = proj.name; return; }   // don't wipe the name being typed
    if (!busy) render();
  }
  async function send(body){
    busy = true;
    try {
      const j = await fetch(API + '?action=share&s=' + encodeURIComponent(TOK), {method:'POST', body: JSON.stringify(Object.assign({by: me}, body))}).then(r => r.json());
      if (j && j.ok) proj = j; else toast((j && j.error) || 'That didn’t save. Try again.');
    } catch(e){ toast('That didn’t save. Check your signal.'); }
    busy = false; render();
  }
  const whoTag = (p, pre) => p ? `<span class="who" style="background:${esc(p.c)}">${pre}${esc(p.n)}</span>` : '';
  const ownerTag = pre => `<span class="who" style="background:${OWNER_C}">${pre}${esc(proj.owner || 'Joe')}</span>`;

  function renderSetup(){
    const c = (me && me.c) || COLORS[0];
    app.innerHTML = `<header><h1>${proj ? esc(proj.name) : 'Shared project'}</h1></header>
      <p class="sub" style="font-size:.95rem">You’ve been invited to help with this project. Put your name and pick a color, so everyone can see what you add and check off.</p>
      <div class="card" style="padding:14px">
        <div class="sub" style="font-weight:700">Your name</div>
        <input id="nm" value="${esc(me ? me.n : '')}" placeholder="Like Mike" autocomplete="given-name" style="width:100%;margin-top:6px;background:#111;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px">
        <div class="sub" style="font-weight:700;margin-top:14px">Your color</div>
        <div class="colors">${COLORS.map(x => `<button type="button" data-c="${x}" aria-checked="${x === c}" style="background:${x}" aria-label="Color"></button>`).join('')}</div>
        <button class="btn" id="go" style="width:100%">${me ? 'Save' : 'Let’s go'}</button></div>`;
    let pick = c;
    app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { pick = b.dataset.c; app.querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-checked', x.dataset.c === pick)); });
    document.getElementById('go').onclick = () => {
      const n = document.getElementById('nm').value.trim(); if (!n) { document.getElementById('nm').focus(); return; }
      me = {n: n.slice(0, 30), c: pick}; try { localStorage.setItem('hh-share-me', JSON.stringify(me)); } catch(e){}
      setup = false; render();
    };
  }
  // ---------- Chat: messages and pictures for everyone on this project ----------
  const SEEN = 'hh-share-seen-' + TOK;
  const isMine = m => m.by && me && m.by.n === me.n;
  function unread(){ let s = 0; try { s = +localStorage.getItem(SEEN) || 0; } catch(e){} return ((proj && proj.chat) || []).filter(m => m.at > s && !isMine(m)).length; }
  const photos = {};
  const when = t => { const d = new Date(t), today = new Date().toDateString() === d.toDateString();
    return (today ? '' : d.toLocaleDateString([], {month:'short', day:'numeric'}) + ' ') + d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); };
  function chatHtml(){
    const ms = (proj.chat || []);
    return `<div class="chat" id="chat">${ms.length ? ms.map(m => { const mine = isMine(m), who = m.by || {n: proj.owner || 'Joe', c: OWNER_C};
      return `<div class="msg ${mine ? 'mine' : ''}">${mine ? '' : `<div class="nm" style="color:${esc(who.c)}">${esc(who.n)}</div>`}
        ${m.ph ? `<img data-ph="${esc(m.id)}" alt="Picture from ${esc(who.n)}"${photos[m.id] ? ` src="${photos[m.id]}"` : ''}>` : ''}
        ${m.text ? `<div class="tx">${esc(m.text)}</div>` : ''}<div class="tm">${m.sending ? 'Sending…' : when(m.at)}</div></div>`; }).join('')
      : '<div class="empty">No messages yet. Say hi, or send a picture of the progress.</div>'}</div>
      <form class="compose" id="cf"><label class="pic" title="Send a picture">📷<input type="file" id="cpic" accept="image/*" hidden></label>
        <textarea id="ct" rows="1" placeholder="Message"></textarea><button class="btn">Send</button></form>`;
  }
  function shrink(file){ return new Promise((res, rej) => { const rd = new FileReader(); rd.onload = () => { const img = new Image(); img.onload = () => {
    const sc = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.72)); }; img.onerror = rej; img.src = rd.result; }; rd.onerror = rej; rd.readAsDataURL(file); }); }
  function wireChat(){
    const ms = proj.chat || []; if (ms.length) try { localStorage.setItem(SEEN, String(ms[ms.length - 1].at || Date.now())); } catch(e){}
    window.scrollTo(0, document.body.scrollHeight);
    app.querySelectorAll('img[data-ph]').forEach(im => {
      const id = im.dataset.ph; im.onclick = () => { if (!im.src) return; const o = document.createElement('div'); o.id = 'big'; o.innerHTML = '<img alt="">'; o.firstChild.src = im.src; o.onclick = () => o.remove(); document.body.appendChild(o); };
      if (photos[id]) return;
      fetch(API + '?action=photo&id=' + encodeURIComponent('chat-' + id) + '&t=' + Date.now(), {cache:'no-store'}).then(r => r.json()).then(j => {
        if (j && j.ok && j.data) { photos[id] = 'data:image/jpeg;base64,' + j.data; app.querySelectorAll(`img[data-ph="${id}"]`).forEach(x => x.src = photos[id]); }
      }).catch(() => {});
    });
    const ct = document.getElementById('ct');
    ct.oninput = () => { ct.style.height = 'auto'; ct.style.height = Math.min(120, ct.scrollHeight) + 'px'; };
    const go = async (text, photo) => {
      const temp = {id: 'tmp' + Date.now(), text, by: me, at: Date.now(), ph: photo ? 1 : 0, sending: true};
      if (photo) photos[temp.id] = photo;
      (proj.chat = proj.chat || []).push(temp); render();
      await send({op: 'chat', text, photo: photo ? photo.split(',')[1] : ''});
    };
    document.getElementById('cf').onsubmit = e => { e.preventDefault(); const t = ct.value.trim(); if (!t) return; ct.value = ''; go(t, ''); };
    ct.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !/iPhone|iPad|Android/.test(navigator.userAgent)) { e.preventDefault(); document.getElementById('cf').requestSubmit(); } };
    document.getElementById('cpic').onchange = async e => { const fl = e.target.files && e.target.files[0]; e.target.value = ''; if (!fl) return;
      try { const d = await shrink(fl); go(ct.value.trim(), d); ct.value = ''; } catch(er){ toast('Couldn’t open that picture.'); } };
  }
  function render(){
    if (setup) return renderSetup();
    if (!proj) { app.innerHTML = `<header><h1>Shared project</h1></header><div class="empty">${err ? esc(err) + '<br><br><button class="btn" id="retry">Try again</button>' : 'Loading…'}</div>`;
      const r = document.getElementById('retry'); if (r) r.onclick = () => { err = ''; render(); load(); }; return; }
    const steps = proj.steps || [], done = steps.filter(x => x.done).length, pct = steps.length ? Math.round(done / steps.length * 100) : 0;
    const list = proj[tab] || [];
    const open = list.filter(x => !x.done), fin = list.filter(x => x.done);
    const row = x => `<button class="row ${x.done ? 'done' : ''}" data-t="${esc(x.id)}" data-d="${x.done ? 1 : 0}"><span class="box">${x.done ? '✓' : ''}</span>
      <span style="min-width:0"><span class="t">${esc(x.text)}</span>${x.by ? whoTag(x.by, 'added by ') : ''}${x.done ? (x.doneBy ? whoTag(x.doneBy, '✓ ') : ownerTag('✓ ')) : ''}</span></button>`;
    // everyone who's added or checked something, with their color
    const people = {}; ['steps','materials'].forEach(k => (proj[k] || []).forEach(x => { [x.by, x.doneBy].forEach(p => { if (p && p.n) people[p.n] = p.c; }); }));
    app.innerHTML = `<header><h1>${esc(proj.name)}</h1><button class="me" id="me"><span class="dot" style="background:${esc(me.c)}"></span>${esc(me.n)}</button></header>
      <div class="sub">${steps.length ? `${done} of ${steps.length} steps done · ${pct}%` : 'Shared by ' + esc(proj.owner || 'Joe')}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="legend">${ownerTag('')}${Object.keys(people).filter(n => n !== proj.owner).map(n => whoTag({n, c: people[n]}, '')).join('')}</div>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="steps" aria-selected="${tab === 'steps'}">🪜 Steps${(proj.steps || []).length ? ' (' + proj.steps.length + ')' : ''}</button>
        <button role="tab" data-tab="materials" aria-selected="${tab === 'materials'}">🧰 Materials${(proj.materials || []).length ? ' (' + proj.materials.length + ')' : ''}</button>
        <button role="tab" data-tab="chat" aria-selected="${tab === 'chat'}">💬 Chat${unread() ? '<span class="new">' + unread() + '</span>' : ''}</button></div>
      ${tab === 'chat' ? chatHtml() : `<form class="add" id="addf"><input id="newi" placeholder="${tab === 'steps' ? 'Add a step' : 'Add a material'}" autocomplete="off" enterkeyhint="done"><button class="btn">＋ Add</button></form>
      ${list.length ? `<div class="card">${open.concat(fin).map(row).join('')}</div>` : `<div class="empty">No ${tab} yet. Add the first one above.</div>`}
      <div class="sub" style="text-align:center;margin-top:8px">Tap an item to check it off. Changes show up for everyone.</div>`}`;
    if (tab === 'chat') { wireChat(); return; }
    document.getElementById('me').onclick = () => { setup = true; render(); };
    app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; try { localStorage.setItem('hh-share-tab-' + TOK, tab); } catch(e){} render(); });
    app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
      const x = list.find(i => i.id === b.dataset.t); if (!x) return;
      x.done = !x.done; x.doneBy = x.done ? me : null; render();          // show it right away
      send({op:'toggle', list: tab, id: x.id, done: x.done});
    });
    const af = document.getElementById('addf'); if (af) af.onsubmit = e => { e.preventDefault();
      const i = document.getElementById('newi'), t = i.value.trim(); if (!t) return;
      (proj[tab] = proj[tab] || []).push({id: 'tmp' + Date.now(), text: t, done: false, by: me}); render();
      send({op:'add', list: tab, text: t}); setTimeout(() => { const n = document.getElementById('newi'); if (n) n.focus(); }, 50); };
  }
  render(); load();
  let lastPoll = 0;
  setInterval(() => {
    const typing = document.activeElement && (document.activeElement.id === 'newi' || document.activeElement.id === 'ct') && document.activeElement.value;
    if (busy || setup || typing || document.visibilityState === 'hidden') return;
    if (Date.now() - lastPoll < (tab === 'chat' ? 7000 : 20000)) return;
    lastPoll = Date.now(); load();
  }, 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
})();
</script>
</body>
</html>
