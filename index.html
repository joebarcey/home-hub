<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="icon-home.png">
<link rel="icon" type="image/png" href="icon-home.png">
<meta name="apple-mobile-web-app-title" content="Home Hub">
<title>Home Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merienda:wght@700;800;900&display=swap" rel="stylesheet">
<meta name="description" content="One-stop hub: projects, honey-do list, notes and shopping on Meta Ray-Ban Display">
<meta name="mrbd-web-app-capable" content="yes">
<style>
  /* Additive display: black is see-through, bright colors are visible. */
  :root{
    --bg:#000; --fg:#f2f2f2; --dim:#9a9a9a; --accent:#5fd3ff; --good:#7dff9a; --warn:#ffb35c; --line:#2a2a2a; --yel:#ffe66b; --nd:#ffb35c; --ns:#7bbcff; --field:#111; --sel:#1a1a1a; --chip:#262626; --track:#222; --script:"Merienda";
    --fs: clamp(22px, 6vw, 38px);   /* script letters run small, so everything is a size up */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:var(--script),system-ui,-apple-system,"Segoe UI",Roboto,cursive;font-weight:600;font-size:var(--fs);overflow:hidden}
  #app{height:100vh;display:flex;flex-direction:column;padding:3vw 4vw}
  header{display:flex;align-items:center;gap:2vw;flex:0 0 auto;margin-bottom:2vw}
  header h1{font-size:1.15em;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{color:var(--dim);font-size:.75em}
  .sub .sub{font-size:1em}
  .scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:4px}
  button,input,textarea{font:inherit;color:inherit}
  button{background:transparent;border:2px solid var(--line);border-radius:14px;padding:.45em .7em;text-align:left;cursor:pointer}
  button:focus,input:focus,.note-body:focus,.piece:focus{outline:4px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
  .row{display:flex;gap:2vw;margin-bottom:2vw;align-items:stretch}
  .row .main{flex:1;display:flex;justify-content:space-between;align-items:center;gap:2vw;min-width:0}
  .main.block{display:block}
  .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .x{flex:0 0 auto;color:var(--dim);text-align:center;min-width:2.2em}
  .done .t{color:var(--dim);text-decoration:line-through}
  .check{flex:0 0 auto;color:var(--good)}
  .tabs{display:flex;gap:2vw;flex:0 0 auto;margin-bottom:2vw}
  .tabs button{flex:1;text-align:center;font-size:.8em;padding:.4em .2em}
  .tabs button[aria-selected="true"]{border-color:var(--fg);background:var(--sel)}
  .cnt{display:inline-block;margin-left:.3em;min-width:1.3em;padding:0 .3em;border-radius:1em;background:var(--chip);color:var(--fg);font-size:.8em;line-height:1.4}
  .cnt.zero{color:var(--dim);background:transparent}
  .add{display:flex;gap:2vw;flex:0 0 auto;margin-top:1vw}
  .add input{flex:1;min-width:0;background:var(--field);border:2px solid var(--line);border-radius:14px;padding:.45em .7em}
  .add button{color:var(--accent)}
  .bar{height:.35em;background:var(--track);border-radius:1em;overflow:hidden;margin-top:.25em}
  .bar i{display:block;height:100%;background:var(--good)}
  .empty{color:var(--dim);text-align:center;padding:2em 1em;line-height:1.4}
  .danger{color:var(--warn)}
  .back{flex:0 0 auto;padding:.3em .6em}
  .menu .main{padding:.6em .8em}
  .menu .icon{margin-right:.5em}
  .note-body{white-space:pre-wrap;line-height:1.4;border:2px solid var(--line);border-radius:14px;padding:.6em .8em;margin-bottom:2vw}
  .small{font-size:.8em}
  button[aria-pressed="true"]{border-color:var(--good)}
  .gsec{margin-left:1.2em}
  .gtabs{gap:1.5vw}
  .gtabs button{font-size:.7em;padding:.35em .1em;white-space:nowrap}
  .gtabs .cnt{margin-left:.15em;min-width:1.1em;padding:0 .2em}
  .piece{display:block;width:100%;text-align:left;white-space:normal;line-height:1.4;padding:.35em .7em;margin-bottom:1vw;border-radius:12px;border:2px solid transparent}
  .nd{color:var(--nd);font-weight:700} .nsep{color:var(--dim)} .ns{color:var(--ns)}
  .crossed .nd, .crossed .ns{color:inherit}
  .hdrow .x{min-width:1.7em;padding:.45em .3em}
  .hdrow .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2}
  .row.done.onhand .t{color:var(--good);text-decoration:none}
  .row.done.onhand .check{color:var(--good)}
  /* show the whole entry everywhere (glasses too): long goals, materials, steps and tasks wrap instead of getting cut off */
  .row .t{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.25}
  .hdrow .t{display:block;-webkit-line-clamp:unset}
  /* glasses: slimmer side buttons give the text most of the width */
  body:not(.light) .row > .x{min-width:1.6em;padding:.3em .2em;font-size:.82em}
  body:not(.light) .row .main{padding:.4em .55em}
  /* long project / job names in the title get two lines instead of "…" */
  header h1{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.15}
  .qty{font-size:.8em;opacity:.8;margin-left:.2em}
  .stabs button{white-space:nowrap;font-size:.72em;padding:.4em .1em} .stabs .cnt{margin-left:.15em}
  .shophead{font-size:.82em;border-style:dashed}
  .shophead .sub{flex:0 0 auto}
  .main.opened{border-color:var(--accent)}
  .rowacts{margin:-1vw 0 2.5vw 1em}
  .rowacts .main{font-size:.8em;padding:.35em .3em}
  .rowacts .main{white-space:nowrap;flex:1 1 auto} .rowacts [data-edit], .rowacts [data-del]{flex:0 1 2.6em}
  body:not(.light) .rowacts [data-edit], body:not(.light) .rowacts [data-del]{flex:1 1 auto}
  .ovhead{justify-content:space-between}
  #ovw{padding:.45em .5em}
  header h1.tapme{cursor:pointer}
  header h1 .mg{font-size:.55em;margin-left:.3em;color:var(--dim);vertical-align:middle}
  .editbox{margin:0 0 2vw}
  .ediin{flex:1;min-width:0;background:var(--field);border:2px solid var(--accent);border-radius:14px;padding:.45em .7em}
  body.has-bg .ediin{background-color:rgba(0,0,0,.55)}
  .editbox textarea{width:100%;background:var(--field);border:2px solid var(--accent);border-radius:14px;padding:.45em .7em;line-height:1.4;resize:vertical}
  body.has-bg .editbox textarea{background-color:rgba(0,0,0,.55)}
  .notecard .preview{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;line-height:1.35;margin-top:.15em}
  .crossed, .crossed .preview{color:var(--dim);text-decoration:line-through}
  a.main{text-decoration:none;color:inherit;border:2px solid var(--line);border-radius:14px;padding:.45em .7em}
  a.main:focus{outline:4px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
  .phone{color:var(--good)}
  #toast{position:fixed;left:4vw;right:4vw;bottom:3vw;background:var(--field);border:2px solid var(--good);border-radius:14px;padding:.5em .8em;font-size:.8em;line-height:1.35;display:none}
  /* Phone-only background pictures. A dark veil keeps the text readable. */
  #bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;display:none}
  #bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.18)}
  body.has-bg{background:transparent}
  body.has-bg #bg{display:block}
  body.has-bg .row .main, body.has-bg a.main, body.has-bg .tabs button, body.has-bg .add input, body.has-bg .x,
  body.has-bg .note-body, body.has-bg .back, body.has-bg .add button{background-color:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);border-color:rgba(255,255,255,.28)}
  body.has-bg .tabs button[aria-selected="true"]{background-color:rgba(0,0,0,.5);border-color:var(--fg)}
  body.has-bg #app{text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.9)}   /* keeps words readable on a busy picture */
  body.has-bg .piece{background-color:rgba(0,0,0,.28)}
  .bgbtn{flex:0 0 auto;padding:.25em .5em;font-size:.8em;line-height:1}
  .bgmenu{display:flex;gap:2vw;margin:-1vw 0 2vw}
  .bgmenu button{flex:1;text-align:center;font-size:.8em}
  #sync.ok{color:var(--good)} #sync.off{color:var(--warn)}
  /* Merienda, everything bold */
  body, body *{font-weight:800 !important}
  /* script lettering: bold enough to read at a glance */
  b, strong, header h1, .t{font-weight:700}
  input, textarea{font-weight:600}
  /* phone light look */
  body.light{--bg:#efece6; --fg:#111; --dim:#4b5160; --accent:#1d5aa6; --good:#0b7a3c; --warn:#b85c00; --line:#b7bdc8;
    --yel:#8a6d00; --nd:#b85c00; --ns:#1d5aa6; --field:#fff; --sel:#dfe3ea; --chip:#dfe3ea; --track:#d3d7de}
  body.light button:focus, body.light input:focus, body.light .piece:focus{outline-color:#1d5aa6}
  body.light.has-bg .row .main, body.light.has-bg a.main, body.light.has-bg .tabs button, body.light.has-bg .add input, body.light.has-bg .x,
  body.light.has-bg .note-body, body.light.has-bg .back, body.light.has-bg .add button, body.light.has-bg .piece, body.light.has-bg .ediin,
  body.light.has-bg .editbox textarea{background-color:rgba(255,255,255,.66);border-color:rgba(0,0,0,.22);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  body.light.has-bg .tabs button[aria-selected="true"]{background-color:rgba(255,255,255,.86);border-color:#111}
  body.light.has-bg #app{text-shadow:0 0 3px rgba(255,255,255,.9),0 0 8px rgba(255,255,255,.7)}
  body.light.has-bg header h1, body.light.has-bg header .sub, body.light.has-bg .empty, body.light.has-bg > #app .scroll > .sub{background:rgba(255,255,255,.65);border-radius:10px;padding:0 .3em}
  body.light #bg::after{background:rgba(255,255,255,.08)}
  /* Phone: rows with side buttons put the buttons underneath, so the full text runs across */
  body.light .row:has(> .main):has(> .x ~ .x){flex-wrap:wrap;row-gap:1.5vw}
  body.light .row:has(> .main):has(> .x ~ .x) > .main{flex:1 1 100%}
  body.light .row:has(> .main):has(> .x ~ .x) > .x{flex:1 1 0;min-width:0;padding:.3em .2em;font-size:.85em}
  body.light .row .t, body.light .hdrow .t{white-space:normal;overflow:visible;display:block;-webkit-line-clamp:unset;line-height:1.25}
  body.light .gtabs button{font-size:.6em;padding:.35em .05em} body.light .gtabs .cnt{margin-left:.1em}
  .mnote{margin:0 0 2.5vw;padding:2.5vw 3.5vw;border:2px solid #e0a400;border-left-width:7px;border-radius:12px;background:rgba(58,46,0,.92)}
  body.light .mnote{background:rgba(255,246,205,.95)}
  .mnote-h{font-size:.8em;font-weight:800;color:#a87600;letter-spacing:.02em}
  .mnote-t{font-size:1.15em;font-weight:700;line-height:1.3;margin-top:.5vw;white-space:pre-wrap}
  body:not(.light) .mnote-h{color:#ffd54a} body:not(.light) .mnote-t{color:#fff}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="app"></div>
<input type="file" id="bgfile" accept="image/*" hidden>
<div id="toast" role="status"></div>
<script>
(function(){
  // ===== SYNC SETTING =====
  // Served by the Google Apps Script: the address is filled in automatically.
  // On a regular web host, the sync link arrives once in the address (#sync=...), is remembered on this
  // device, and is then removed from the address, so it never has to live in the public file.
  function findSyncUrl(){
    if (window.__SYNC_URL__) return window.__SYNC_URL__;
    const ok = u => /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u);
    let u = '';
    // The link can arrive as ?sync=... (kept in the address) or #sync=... (older links)
    try { const q = new URLSearchParams(location.search).get('sync'); if (q && ok(q)) u = q; } catch(e){}
    if (!u){ try { const m = location.hash.match(/[#&]sync=([^&]+)/); if (m){ const v = decodeURIComponent(m[1]); if (ok(v)) u = v; } } catch(e){} }
    if (u){
      try { localStorage.setItem('mrbd-home-hub-sync', u); } catch(e){}
      // Keep it in the address as ?sync=..., so a home-screen icon or bookmark saved from here still syncs
      try {
        if (/sync=/.test(location.hash) || new URLSearchParams(location.search).get('sync') !== u)
          history.replaceState(null, '', location.pathname + '?sync=' + u + '#/');
      } catch(e){}
    }
    if (!u){ try { const v = localStorage.getItem('mrbd-home-hub-sync') || ''; if (ok(v)) u = v; } catch(e){} }
    return u;
  }
  const SYNC_URL = findSyncUrl();
  // Phones get light boxes with black lettering; the glasses keep white on black (black is see-through there)
  const LIGHT = (()=>{ try { return innerHeight > innerWidth*1.2 && matchMedia('(pointer: coarse)').matches; } catch(e){ return false; } })();
  if (LIGHT) document.body.classList.add('light');

  const KEY = 'mrbd-home-hub-v1';
  const DIRTY_KEY = KEY + '-dirty';
  const OLD_TRACKER_KEY = 'mrbd-project-tracker-v1';
  const PROJECT_TABS = [
    {id:'goals', label:'Goals', ph:'Add a goal'},
    {id:'materials', label:'Materials', ph:'Add a material'},
    {id:'steps', label:'Steps', ph:'Add a step'}
  ];
  // Home menu. To add a new simple checklist section, add a line here.
  const SECTIONS = [
    {id:'projects', icon:'🛠', label:'Projects'},
    {id:'honeydo',  icon:'🏠', label:'Honey-Do', kind:'priority'},
    {id:'notes',    icon:'📝', label:'Notes'},
    {id:'shopping', icon:'🛒', label:'Shopping', kind:'list', ph:'Add an item'},
    {id:'contacts', icon:'📞', label:'Contacts'}
  ];
  // Note categories. Add another tab by adding a line here.
  const NOTE_TABS = [
    {id:'work', label:'💼 Work', ph:'New work note'},
    {id:'personal', label:'🏡 Personal', ph:'New personal note'}
  ];

  const app = document.getElementById('app');
  let mem = null;     // fallback if storage is blocked
  let armed = null;   // id armed for a two-press delete

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const esc = s => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; };
  const now = () => Date.now();
  const live = a => (a||[]).filter(x=>!x.del);
  const touch = x => { x.u = now(); };
  const remove = x => { x.del = true; x.u = now(); };   // kept as a "deleted" marker so the other device learns about it
  const newItem = text => ({id:uid(), text, done:false, c:now(), u:now()});   // c = when it was added

  // ---------- storage ----------
  function load(){
    let d = null;
    try { const s = localStorage.getItem(KEY); if (s) d = JSON.parse(s); } catch(e){}
    if (!d) d = mem || {};
    SECTIONS.forEach(s=>{ if(!Array.isArray(d[s.id])) d[s.id]=[]; });
    if (!d.importedTracker){
      try {
        const old = JSON.parse(localStorage.getItem(OLD_TRACKER_KEY) || 'null');
        if (old && old.projects) old.projects.forEach(p=>{ if(!d.projects.some(x=>x.id===p.id)) d.projects.push(p); });
      } catch(e){}
      d.importedTracker = true;
    }
    return d;
  }
  let data = load();
  let dirty = true;
  try { dirty = localStorage.getItem(DIRTY_KEY) !== '0'; } catch(e){}
  function setDirty(v){ dirty = v; try { localStorage.setItem(DIRTY_KEY, v?'1':'0'); } catch(e){} }
  function store(){ mem = data; try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} }
  function save(){ store(); setDirty(true); scheduleSync(); }   // call after every change you make
  store();

  // ---------- sync ----------
  const SUBS = PROJECT_TABS.map(t=>t.id);
  const JOB_SUBS = ['tasks','materials'];
  const NEST = {projects:SUBS, honeydo:JOB_SUBS};   // lists that have lists inside each item
  function mergeList(a, b, subs){
    const m = new Map();
    (a||[]).forEach(x=>m.set(x.id, x));
    (b||[]).forEach(y=>{
      const x = m.get(y.id);
      if (!x){ m.set(y.id, y); return; }
      const out = Object.assign({}, (y.u||0) > (x.u||0) ? y : x);
      if (subs) subs.forEach(k=>out[k]=mergeList(x[k], y[k], null));
      m.set(y.id, out);
    });
    return [...m.values()];
  }
  function mergeData(a, b){
    const out = Object.assign({}, a, {importedTracker:true});
    SECTIONS.forEach(s=>out[s.id]=mergeList(a[s.id], b && b[s.id], NEST[s.id]));
    return out;
  }
  // Apply the other device's changes INTO the data already on screen (same objects),
  // so whatever screen is open keeps working after a background sync.
  function replaceObj(t, s, keep){
    Object.keys(t).forEach(k=>{ if(!(k in s) && !keep.includes(k)) delete t[k]; });
    Object.keys(s).forEach(k=>{ if(!keep.includes(k)) t[k]=s[k]; });
  }
  function mergeListInto(local, remote, subs){
    const byId = new Map(local.map(x=>[x.id, x]));
    (remote||[]).forEach(y=>{
      const x = byId.get(y.id);
      if (!x){ local.push(y); byId.set(y.id, y); return; }
      if ((y.u||0) > (x.u||0)) replaceObj(x, y, subs || []);
      if (subs) subs.forEach(k=>{ if(!Array.isArray(x[k])) x[k]=[]; mergeListInto(x[k], y[k], null); });
    });
  }
  function mergeInto(d, remote){
    SECTIONS.forEach(s=>{ if(!Array.isArray(d[s.id])) d[s.id]=[]; mergeListInto(d[s.id], remote && remote[s.id], NEST[s.id]); });
    d.importedTracker = true;
  }

  let syncing=false, again=false, syncTimer=null, syncStatus=SYNC_URL?'':'none', lastSync=0;
  function scheduleSync(){ if(!SYNC_URL) return; clearTimeout(syncTimer); syncTimer=setTimeout(sync, 700); }
  function showStatus(){
    const el=document.getElementById('sync'); if(!el) return;
    el.className = 'sub ' + syncStatus;
    el.textContent = syncStatus==='ok' ? '☁ synced ' + new Date(lastSync).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})
      : syncStatus==='off' ? '☁ offline' : syncStatus==='busy' ? '☁ syncing…' : syncStatus==='none' ? 'this device only' : '';
  }
  function setStatus(s){ syncStatus=s; showStatus(); }
  // Household items go to the Kitchen Board (it reads them from here). When Melissa checks one off or
  // deletes it there, bring that back. Each app only writes its own lists, so nothing gets overwritten.
  async function pullKitchen(){
    try {
      const r = await fetch(SYNC_URL + (SYNC_URL.includes('?')?'&':'?') + 'action=get&space=kitchen&t=' + now(), {cache:'no-store'});
      if (!r.ok) return;
      const k = await r.json() || {};
      // Melissa's Honey-Do requests from the Kitchen app: they land at priority 5 in Joe's format
      (k.honeydo||[]).forEach(m=>{
        if (!m || !m.id) return;
        const id = 'kb-' + m.id; const j = data.honeydo.find(x=>x.id===id);
        if (!j){
          if (m.del || m.done) return;
          data.honeydo.push({id, text:m.text, note:m.note||'', from:'melissa', pri:5, done:false, tasks:[], materials:[], c:m.c||now(), u:m.u||now()});
          setDirty(true); return;
        }
        if ((m.u||0) > (j.u||0)){
          if (m.del) j.del = true;
          else if (!!m.done !== !!j.done){ j.done = !!m.done; if (j.done) j.doneAt = m.u; else delete j.doneAt; }
          j.u = m.u; setDirty(true);
        }
      });
      (data.shopping||[]).forEach(i=>{
        if (i.del) return;
        const lst = (i.cat==='groc') ? k.groceries : k.shopping;
        const m = (lst||[]).find(x=>x.id==='hh-'+i.id);
        if (m && (m.u||0) > (i.u||0)){
          i.done = !!m.done; if (m.done) i.doneAt = i.doneAt || m.u; else delete i.doneAt;
          if (m.del) i.del = true;
          i.u = m.u; setDirty(true);
        }
      });
    } catch(e){}
  }
  async function sync(){
    if (!SYNC_URL) return;
    if (syncing){ again=true; return; }
    syncing=true; setStatus('busy');
    try {
      const r = await fetch(SYNC_URL + (SYNC_URL.includes('?')?'&':'?') + 'action=get&t=' + now(), {cache:'no-store'});
      if (!r.ok) throw new Error('get ' + r.status);
      const remote = await r.json();
      const before = JSON.stringify(data);
      mergeInto(data, remote || {});
      await pullKitchen();
      store();
      const remoteNorm = mergeData(remote||{}, {});
      if (dirty || JSON.stringify(mergeData(remoteNorm, data)) !== JSON.stringify(remoteNorm)){
        setDirty(false);
        try {
          const p = await fetch(SYNC_URL, {method:'POST', body: JSON.stringify(data)});
          if (!p.ok) throw new Error('post ' + p.status);
        } catch(e){ setDirty(true); throw e; }
      }
      lastSync = now(); setStatus('ok');
      if (JSON.stringify(data) !== before) refresh();
    } catch(e){ setStatus('off'); }
    syncing=false;
    if (again){ again=false; sync(); }
  }

  // Re-draw after new data arrives without yanking the cursor around.
  const FOCUS_ATTRS=['data-hcat','data-scat','data-gtog','data-grm','data-sopen','data-sgo','data-ovp','data-ovw','data-rowopen','data-shopback','data-mgone','data-mrm','data-mback','data-stab','data-mtog','data-edit','data-eline','data-gsec','data-pick','data-gall','data-gtab','data-fgrp','data-lk','data-copen','data-job','data-jtab','data-toggle','data-del','data-go','data-open','data-tab','data-ntab','data-note','data-move','data-ptab','data-pri','data-setpri','data-ctab','data-call'];
  function refresh(){
    const a=document.activeElement;
    if (a && a.tagName==='INPUT' && a.value) return;   // don't interrupt typing
    if (formOpen) return;   // keep a half-filled contact form as it is
    let sel=null;
    if (a && app.contains(a)){
      if (a.id) sel='#'+a.id;
      else for (const k of FOCUS_ATTRS) if (a.hasAttribute(k)){ sel=`[${k}="${a.getAttribute(k)}"]`; break; }
    }
    render(); if (sel) focusSel(sel);
  }

  // ---------- routing ----------
  let initialHash = '#/';
  try { initialHash = /sync=/.test(location.hash) ? '#/' : (location.hash || '#/'); } catch(e){}
  let stack = [initialHash];
  let histOK = true;
  function route(){
    const h = stack[stack.length-1].replace(/^#\/?/, '').split('/');
    return { a:h[0]||'', b:h[1]||'', c:h[2]||'', d:h[3]||'' };
  }
  function go(hash, replace){
    armed = null; bgMenu = false; editLine = null; editItem = null; openRow = null; shopOpen = null; showMgmt = false;
    if (replace) stack[stack.length-1] = hash; else stack.push(hash);
    if (histOK){
      try { if (replace) history.replaceState(null,'',hash); else history.pushState(null,'',hash); }
      catch(e){ histOK = false; }
    }
    render();
  }
  function goBack(fallback){
    if (stack.length > 1){
      if (histOK){ try { history.back(); return; } catch(e){ histOK = false; } }
      stack.pop(); armed = null; render();
    } else go(fallback, true);
  }

  // ---------- helpers ----------
  let showMgmt = false;
  function wireMgmt(){
    if (!LIGHT) return;
    const h=app.querySelector('header h1'); if(!h) return;
    h.classList.add('tapme'); h.insertAdjacentHTML('beforeend', `<span class="mg">${showMgmt?'▴':'▾'}</span>`);
    h.onclick=()=>{ showMgmt=!showMgmt; armed=null; render(); };
  }
  function header(title, backTo, right){
    return `<header>${backTo!==null?`<button class="back" id="back" aria-label="Back">‹</button>`:''}
      <h1>${title}</h1>${right?`<span class="sub">${right}</span>`:''}</header>`;
  }
  function wireBack(fallback){ const b=document.getElementById('back'); if(b) b.onclick=()=>goBack(fallback); }
  function addBox(ph, overview){
    return `<div class="add"><input id="newi" type="text" placeholder="${esc(ph)}" aria-label="${esc(ph)}"><button id="addi">＋ Add</button>${overview?`<button id="ovw" data-ovw="${overview}" aria-label="Overview">📋</button>`:''}</div>`;
  }
  function wireOverview(){ const b=document.getElementById('ovw'); if(b) b.onclick=()=>go('#/overview/'+b.dataset.ovw); }
  // Everything on one page: highest priority first, then whatever has waited longest
  // Everything on one page, grouped by priority (each group folds open/closed);
  // inside a group, whatever has waited longest comes first
  const ovOpen = new Set();
  function renderOverview(which){
    const isP = which==='projects';
    const items = (isP ? live(data.projects) : live(data.honeydo).filter(i=>!i.done)).slice()
      .sort((a,b)=>priOf(a)-priOf(b) || addedAt(a)-addedAt(b));
    const rows = PRIS.map(pr=>{
      const group = items.filter(it=>priOf(it)===pr);
      if (!group.length) return '';
      const key = which+':'+pr, open = ovOpen.has(key);
      const oldest = daysBetween(addedAt(group[0]), now());
      const head = `<div class="row"><button class="main ovhead" data-ovp="${key}" aria-expanded="${open}" style="color:${PRI_COLOR[pr]};border-color:${PRI_COLOR[pr]}">
          <span><span style="display:inline-block;width:1.1em">${open?'▾':'▸'}</span>Priority ${pr}</span>
          <span class="sub">${oldest>=30?'🕸 ':''}<span class="cnt">${group.length}</span></span></button></div>`;
      if (!open) return head;
      return head + group.map(it=>{
        const d=daysBetween(addedAt(it), now());
        let info = d===0 ? 'added today' : `on list ${d} day${d===1?'':'s'}`;
        if (isP){ const g=progress(it); info += g.n ? ` · ${g.d}/${g.n} steps` : ''; }
        else { const t=live(it.tasks); if (t.length) info += ` · ${t.filter(x=>x.done).length}/${t.length} tasks`; }
        return `<div class="row" style="margin-left:1em"><button class="main block" ${isP?`data-open="${it.id}"`:`data-job="${it.id}"`} style="border-left:.35em solid ${PRI_COLOR[pr]}">
          <span class="t">${esc(isP?it.name:it.text)}</span>
          <span class="sub" style="display:block;${d>=30?'color:var(--warn)':''}">${d>=30?'🕸 ':''}${info}</span>${isP?`<div class="bar"><i style="width:${progress(it).pct}%"></i></div>`:''}</button></div>`;
      }).join('');
    }).join('');
    app.innerHTML = header(`📋 ${isP?'Projects':'Honey-Do'}`, isP?'#/projects':'#/honeydo', `${items.length} open`) +
      `<div class="scroll">${rows || `<div class="empty">Nothing open. Enjoy it.</div>`}</div>`;
    wireBack(isP?'#/projects':'#/honeydo');
    app.querySelectorAll('[data-ovp]').forEach(b=>b.onclick=()=>{ const k=b.dataset.ovp; ovOpen.has(k)?ovOpen.delete(k):ovOpen.add(k); render(); focusSel(`[data-ovp="${k}"]`); });
    app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go(`#/p/${b.dataset.open}/goals`));
    app.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>go(`#/job/${b.dataset.job}/tasks`));
    if(!app.contains(document.activeElement)) focusFirst();
  }
  function wireAdd(onAdd){
    const inp=document.getElementById('newi'), btn=document.getElementById('addi');
    const commit=()=>{ const t=inp.value.trim(); if(t){ inp.value=''; onAdd(t); } else inp.focus(); };
    btn.onclick=commit;
    inp.addEventListener('change',()=>{ if(inp.value.trim()) commit(); }); // glasses composer commits fire change
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&inp.value.trim()){ e.preventDefault(); commit(); } });
  }
  function focusSel(sel){ const el=app.querySelector(sel); if(el) el.focus(); return !!el; }
  function focusFirst(){ const el=app.querySelector(LIGHT ? '.scroll button, .scroll a, .scroll [tabindex], header button' : '.scroll button, .scroll a, .scroll [tabindex], .add input'); if(el) el.focus(); }   // phone: never pop the keyboard just from opening a screen
  const countOpen = arr => live(arr).filter(i=>!i.done).length;

  // Generic checklist (Honey-Do, Shopping, and project tabs)
  // editItem: id of a checklist item being changed, or 'pname' while renaming a project
  let editItem = null;
  function editRow(val, ph){
    return `<div class="row"><input id="edi" class="ediin" type="text" value="${esc(val)}" placeholder="${esc(ph||'')}" aria-label="Change it" autocomplete="off">
      <button class="x" id="edisave" style="color:var(--good)" aria-label="Save">✔</button>
      <button class="x" id="edicancel" aria-label="Cancel">✕</button></div>`;
  }
  // Wire up the edit box; onSave gets the new text
  function wireEdit(onSave, backSel){
    const inp=document.getElementById('edi'); if(!inp) return;
    formOpen = true;
    const finish = sel => { editItem=null; formOpen=false; render(); if(!sel || !focusSel(sel)) focusFirst(); };
    const commit = () => { const v=inp.value.trim(); if(!v){ inp.focus(); return; } onSave(v); save(); toast('Saved'); finish(backSel); };
    document.getElementById('edisave').onclick = commit;
    document.getElementById('edicancel').onclick = () => finish(backSel);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); commit(); } });
    if (!IS_PHONE) inp.addEventListener('change', ()=>{ if(inp.value.trim()) commit(); });   // glasses dictation
    inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch(e){}
  }
  // Phone, inside projects and jobs: tap an entry to show its options (done / edit / delete) under it
  let openRow = null;
  function checklistRows(arr, editable, onhand, tap){
    if (editable && (LIGHT || tap)) return live(arr).map(it=>{
      if (editItem===it.id) return editRow(it.text);
      const off = onhand && it.noshop && !it.done, open = openRow===it.id;
      return `<div class="row ${it.done?(onhand?'done onhand':'done'):''}">
        <button class="main${open?' opened':''}" data-rowopen="${it.id}" aria-expanded="${open}"><span style="min-width:0"><span class="t">${esc(it.text)}</span>${off?'<span class="sub" style="display:block">not on shopping list</span>':''}</span><span class="check">${it.done?'✔':'○'}</span></button></div>` +
        (open ? `<div class="row rowacts">
          <button class="main" data-toggle="${it.id}" style="justify-content:center;color:var(--good)">${it.done?'↩ Undo':(onhand?'✔ Got it':'✔ Done')}</button>
          ${off?`<button class="main" data-shopback="${it.id}" style="justify-content:center">🛒 Shop</button>`:''}
          <button class="main" data-edit="${it.id}" style="justify-content:center">✏️ Edit</button>
          <button class="main ${armed===it.id?'danger':''}" data-del="${it.id}" style="justify-content:center">${armed===it.id?'Sure?':'🗑 Delete'}</button></div>` : '');
    }).join('');
    return live(arr).map(it=> editable && editItem===it.id ? editRow(it.text) : `
      <div class="row ${it.done?(onhand?'done onhand':'done'):''}">
        <button class="main" data-toggle="${it.id}"><span style="min-width:0"><span class="t">${esc(it.text)}</span>${onhand && it.noshop && !it.done?'<span class="sub" style="display:block">not on shopping list</span>':''}</span><span class="check">${it.done?'✔':'○'}</span></button>
        ${onhand && it.noshop && !it.done?`<button class="x" data-shopback="${it.id}" aria-label="Put back on the shopping list">🛒</button>`:''}
        ${editable?`<button class="x" data-edit="${it.id}" aria-label="Change">✏️</button>`:''}
        <button class="x ${armed===it.id?'danger':''}" data-del="${it.id}" aria-label="Delete">${armed===it.id?'Sure?':'✕'}</button>
      </div>`).join('');
  }
  function wireChecklist(getArr){
    app.querySelectorAll('[data-rowopen]').forEach(b=>b.onclick=()=>{ const id=b.dataset.rowopen; openRow = openRow===id ? null : id; armed=null; render(); focusSel(`[data-rowopen="${id}"]`); });
    app.querySelectorAll('[data-shopback]').forEach(b=>b.onclick=()=>{ const it=getArr().find(i=>i.id===b.dataset.shopback); if(!it) return; delete it.noshop; touch(it); openRow=null; save(); render(); toast('Back on the shopping list'); focusFirst(); });
    app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ editItem=b.dataset.edit; openRow=null; armed=null; render(); });
    if (editItem && editItem!=='pname' && editItem!=='jname'){
      const it=getArr().find(i=>i.id===editItem);
      if (it) wireEdit(v=>{ it.text=v; touch(it); }, `[data-rowopen="${it.id}"],[data-toggle="${it.id}"]`);
    }
    app.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{
      const it=getArr().find(i=>i.id===b.dataset.toggle); it.done=!it.done;
      if (it.done) it.doneAt=now(); else delete it.doneAt;
      touch(it); armed=null; openRow=null; save(); render();
      if (!focusSel(`[data-toggle="${it.id}"]`) && !focusSel(`[data-rowopen="${it.id}"]`)) focusFirst();   // it may have moved to another tab
    });
    app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.del;
      if(armed===id){ remove(getArr().find(i=>i.id===id)); armed=null; openRow=null; save(); render(); focusFirst(); }
      else { armed=id; render(); focusSel(`[data-del="${id}"]`); }
    });
  }

  // ---------- screens ----------
  let invCount = 0, invAsked = false;
  function renderHome(){
    const rows = SECTIONS.map(s=>{
      let info='';
      if (s.id==='projects'){
        const all=live(data.projects), hot=all.filter(p=>priOf(p)===1).length;
        info = all.length ? `${all.length} active${hot?` · <span style="color:${PRI_COLOR[1]}">${hot} urgent</span>`:''}` : '';
      }
      else if (s.id==='notes'){ const n=live(data.notes).length; info = n ? `${n}` : ''; }
      else if (s.id==='contacts'){ const n=live(data.contacts).length; info = n ? `${n}` : ''; }
      else if (s.kind==='priority'){
        const open=live(data[s.id]).filter(i=>!i.done), hot=open.filter(i=>priOf(i)===1).length;
        info = open.length ? `${open.length} to do${hot?` · <span style="color:${PRI_COLOR[1]}">${hot} urgent</span>`:''}` : '';
      }
      else { const n=countOpen(data[s.id]) + (s.id==='shopping' ? linkedMaterials().filter(x=>!x.m.done && !x.m.noshop).length : 0); info = n ? `${n} to ${s.id==='shopping'?'get':'do'}` : ''; }
      return `<div class="row menu"><button class="main" data-go="${s.id}">
        <span><span class="icon">${s.icon}</span>${s.label}</span><span class="sub">${info}</span></button></div>`;
    }).join('');
    // Inventory lives in its own app (inventory.html) and shares the same Google storage
    const inv = `<div class="row menu"><button class="main" id="inv"><span><span class="icon">📦</span>Inventory</span><span class="sub">${invCount ? invCount + ' items' : ''}</span></button></div>`;
    app.innerHTML = `<header><h1>Home Hub</h1><span id="sync" class="sub"></span></header><div class="scroll">${rows}${inv}</div>`;
    showStatus();
    document.getElementById('inv').onclick = () => { location.href = 'inventory.html?hub=1' + (SYNC_URL ? '&sync=' + SYNC_URL : ''); };
    if (SYNC_URL && !invAsked) { invAsked = true; fetch(SYNC_URL + '?action=get&space=inventory&t=' + Date.now(), {cache:'no-store'}).then(r => r.json()).then(d => {
      const n = ((d && d.items) || []).filter(i => !i.del).length; if (n !== invCount) { invCount = n; if (location.hash === '' || location.hash === '#/') render(); } }).catch(() => {}); }
    app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go('#/'+b.dataset.go));
    focusFirst();
  }

  // ----- Honey-Do with priorities 1 (most urgent) to 5 -----
  const PRIS = [1,2,3,4,5];
  const PRI_COLOR = LIGHT ? {1:'#c0322b', 2:'#b85c00', 3:'#8a6d00', 4:'#0b7a3c', 5:'#1d5aa6'} : {1:'#ff6b6b', 2:'#ffb35c', 3:'#ffe66b', 4:'#7dff9a', 5:'#5fd3ff'};
  const priOf = i => PRIS.includes(i.pri) ? i.pri : 3;   // items from before priorities land in 3
  let priOpen = null;   // item whose priority picker is showing
  // Tab row for 1–5 with a count on every tab (zero included), plus an optional extra tab.
  function priTabs(countFor, selected, extra){
    const cnt = c => `<span class="cnt${c?'':' zero'}">${c}</span>`;
    return `<div class="tabs" role="tablist">${PRIS.map(n=>
      `<button role="tab" data-ptab="${n}" aria-selected="${selected===n}" aria-label="Priority ${n}, ${countFor(n)}" style="color:${PRI_COLOR[n]}">${n}${cnt(countFor(n))}</button>`
    ).join('')}${extra?`<button role="tab" data-ptab="${extra.id}" aria-selected="${selected===extra.id}" aria-label="${extra.aria}, ${extra.count}" style="color:${extra.color}">${extra.label}${cnt(extra.count)}</button>`:''}</div>`;
  }
  const pickerRow = (it) => priOpen===it.id ? `<div class="row" style="margin-top:-1vw">${PRIS.map(n=>`<button class="x" data-setpri="${n}" style="flex:1;color:${PRI_COLOR[n]};${n===priOf(it)?'border-color:'+PRI_COLOR[n]:''}">${n}</button>`).join('')}</div>` : '';
  function wirePriPicker(arr, firstSel){
    app.querySelectorAll('[data-pri]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.pri; priOpen = priOpen===id ? null : id; armed=null; render();
      const it=arr.find(i=>i.id===id);
      focusSel(priOpen && it ? `[data-setpri="${priOf(it)}"]` : `[data-pri="${id}"]`);
    });
    app.querySelectorAll('[data-setpri]').forEach(b=>b.onclick=()=>{
      const it=arr.find(i=>i.id===priOpen); const n=+b.dataset.setpri;
      priOpen=null; openRow=null;
      if (it && n!==priOf(it)){ it.pri=n; touch(it); save(); }
      render(); focusFirst();
    });
  }
  // Saying "priority 2 fix the fence" or "P2 fix the fence" files it under 2, whatever tab you're on.
  function parsePri(text, fallback){
    const m = text.match(/^\s*(?:priority|p)\s*([1-5])\b[\s:.,\-]*(.+)$/i);
    if (!m) return {pri:fallback, text};
    const t = m[2].trim();
    return {pri:+m[1], text: t.charAt(0).toUpperCase() + t.slice(1)};
  }

  // Whole calendar days between two times (so something added last night is "1d" this morning).
  function daysBetween(a, b){
    const d0=new Date(a); d0.setHours(0,0,0,0);
    const d1=new Date(b); d1.setHours(0,0,0,0);
    return Math.max(0, Math.round((d1-d0)/86400000));
  }
  const addedAt = i => i.c || i.u || now();   // items from before day-tracking count from their last change
  function ageBadge(i){
    const d = daysBetween(addedAt(i), now());
    const color = d>=30 ? 'var(--warn)' : d>=14 ? 'var(--yel)' : 'var(--dim)';
    return `<span class="sub" style="color:${color};flex:0 0 auto">${d>=30?'🕸 ':''}${d===0?'today':d+'d'}</span>`;
  }

  function renderPriority(sec, priStr){
    const showDone = priStr==='done';
    const arr = data[sec.id];
    const p = PRIS.includes(+priStr) ? +priStr : (PRIS.find(n=>live(arr).some(i=>!i.done && priOf(i)===n)) || 1);
    const items = showDone
      ? live(arr).filter(i=>i.done).sort((a,b)=>(b.doneAt||b.u||0)-(a.doneAt||a.u||0))
      : live(arr).filter(i=>priOf(i)===p && !i.done);
    const rows = items.map(it=> showDone ? `
      <div class="row done">
        <button class="main" data-toggle="${it.id}" aria-label="Put back on the list">
          <span class="t">${esc(it.text)}</span>
          <span class="sub" style="flex:0 0 auto">took ${Math.max(1, daysBetween(addedAt(it), it.doneAt||it.u||now()) )}d <span style="color:${PRI_COLOR[priOf(it)]}">P${priOf(it)}</span></span>
        </button>
        <button class="x ${armed===it.id?'danger':''}" data-del="${it.id}" aria-label="Delete">${armed===it.id?'Sure?':'✕'}</button>
      </div>` : editItem===it.id ? editRow(it.text, 'Job name') : (LIGHT || sec.id==='honeydo') ? `
      <div class="row hdrow">
        <button class="main block${openRow===it.id?' opened':''}" data-rowopen="${it.id}" aria-expanded="${openRow===it.id}"><span class="t">${esc(it.text)}</span><div class="sub" style="display:flex;gap:.6em;align-items:center">${ageBadge(it)}${jobInfo(it)}<span style="margin-left:auto;color:${PRI_COLOR[p]}">P${p}</span></div></button>
      </div>${openRow===it.id?`<div class="row rowacts">
        <button class="main" data-job="${it.id}" style="justify-content:center">📂 Open</button>
        <button class="main" data-toggle="${it.id}" style="justify-content:center;color:var(--good)">✔ Done</button>
        <button class="main" data-edit="${it.id}" style="justify-content:center">✏️</button>
        <button class="main" data-pri="${it.id}" style="justify-content:center;color:${PRI_COLOR[p]}">P${p}</button>
        <button class="main ${armed===it.id?'danger':''}" data-del="${it.id}" style="justify-content:center">${armed===it.id?'Sure?':'🗑'}</button></div>`:''}${pickerRow(it)}` : `
      <div class="row hdrow">
        <button class="main block" data-job="${it.id}" aria-label="Open ${esc(it.text)}"><span class="t">${esc(it.text)}</span><div class="sub" style="display:flex;gap:.6em">${ageBadge(it)}${jobInfo(it)}</div></button>
        <button class="x" data-toggle="${it.id}" aria-label="Mark done" style="color:var(--good)">○</button>
        <button class="x" data-edit="${it.id}" aria-label="Change">✏️</button>
        <button class="x" data-pri="${it.id}" aria-label="Change priority" style="color:${PRI_COLOR[p]}">P${p}</button>
        <button class="x ${armed===it.id?'danger':''}" data-del="${it.id}" aria-label="Delete">${armed===it.id?'Sure?':'✕'}</button>
      </div>${pickerRow(it)}`).join('');
    const doneCount = live(arr).filter(i=>i.done).length;
    app.innerHTML = header(`${sec.icon} ${sec.label}`, '#/', `${countOpen(arr)} left`) + `
      ${priTabs(n=>live(arr).filter(i=>priOf(i)===n && !i.done).length, showDone?'done':p, {id:'done', label:'✔', aria:'Completed', color:'var(--good)', count:doneCount})}
      <div class="scroll">
        ${showDone && rows ? '<div class="sub" style="margin:0 0 2vw .3em">Pinch a job to put it back on the list.</div>' : ''}
        ${rows || (showDone
          ? '<div class="empty">Nothing finished yet.<br>The couch is calling, isn\'t it.</div>'
          : `<div class="empty">Nothing at priority ${p}.<br>${p===1?'No fires today.':'Enjoy it while it lasts.'}</div>`)}
        ${showDone && doneCount ? `<div class="row"><button class="main small ${armed==='clear'?'danger':''}" id="clear" style="justify-content:center">${armed==='clear'?'Press again to clear all':'🗑 Clear all completed'}</button></div>` : ''}
      </div>` + (showDone ? '' : addBox(`Add a priority ${p} job`, sec.id));
    const doneItems = showDone ? items : [];
    wireBack('#/');
    wireChecklist(()=>data[sec.id]);
    app.querySelectorAll('[data-ptab]').forEach(b=>b.onclick=()=>{ priOpen=null; go(`#/${sec.id}/${b.dataset.ptab}`, true); focusSel(`[data-ptab="${b.dataset.ptab}"]`); });
    wirePriPicker(arr);
    app.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{ priOpen=null; go(`#/job/${b.dataset.job}/tasks`); });
    wireOverview();
    const clr=document.getElementById('clear');
    if(clr) clr.onclick=()=>{
      if(armed==='clear'){ doneItems.forEach(remove); armed=null; save(); render(); focusFirst(); }
      else { armed='clear'; render(); focusSel('#clear'); }
    };
    if (!showDone) wireAdd(t=>{
      const r = parsePri(t, p);
      const it = newItem(r.text); it.pri = r.pri; arr.push(it); save();
      if (r.pri!==p) go(`#/${sec.id}/${r.pri}`, true); else render();
      focusSel('#newi');
    });
    if(!app.contains(document.activeElement)) focusSel('[aria-selected="true"]');
  }

  // ----- One Honey-Do job: its tasks and the materials it needs -----
  const JOB_TABS = [
    {id:'tasks', label:'Tasks', ph:'Add a task'},
    {id:'materials', label:'Materials', ph:'Add a material'}
  ];
  function jobInfo(it){
    const t=live(it.tasks), m=live(it.materials);
    const parts=[];
    if (it.from==='melissa') parts.push('💬 from Melissa');
    if (!t.length && !m.length && !parts.length) return '';
    if (t.length) parts.push(`${t.filter(x=>x.done).length}/${t.length} tasks`);
    if (m.length) parts.push(`${m.length} mat.`);
    return `<span>${parts.join(' · ')}</span>`;
  }
  function renderJob(id, tabId){
    const j=live(data.honeydo).find(x=>x.id===id); if(!j) return go('#/honeydo', true);
    const tab=JOB_TABS.find(t=>t.id===tabId)||JOB_TABS[0];
    JOB_TABS.forEach(t=>{ if(!Array.isArray(j[t.id])) j[t.id]=[]; });
    const ts=live(j.tasks), td=ts.filter(x=>x.done).length, pct=ts.length?Math.round(td/ts.length*100):0;
    const pr=priOf(j);
    const matLeft=live(j.materials).filter(x=>!x.done).length;
    app.innerHTML = header(esc(j.text), '#/honeydo', `<span style="color:${PRI_COLOR[pr]}">P${pr}</span>${ts.length?' · '+pct+'%':''}`) + `
      ${ts.length?`<div class="bar" style="margin:0 0 2vw"><i style="width:${pct}%"></i></div>`:''}
      ${j.from==='melissa' ? `<div class="mnote"><div class="mnote-h">💬 From Melissa${j.note?'':' · no details added'}</div>${j.note?`<div class="mnote-t">${esc(j.note)}</div>`:''}</div>` : ''}
      <div class="tabs" role="tablist">${JOB_TABS.map(t=>{ const c=live(j[t.id]).length; return `<button role="tab" data-jtab="${t.id}" aria-selected="${t.id===tab.id}">${t.label}${c?' ('+c+')':''}</button>`; }).join('')}</div>
      <div class="scroll">
        ${tab.id==='materials' && live(j.materials).length ? `<div class="sub" style="margin:0 0 2vw .3em">${matLeft?`Check off what you've got. ${matLeft} still to get.`:'Got everything. No excuses now.'}</div>`:''}
        ${checklistRows(j[tab.id], true, tab.id==='materials', true) || `<div class="empty">${tab.id==='tasks'?'No tasks yet.<br>Break it into steps below.':'No materials yet.<br>Add what you need to buy or grab.'}</div>`}
        ${LIGHT && !showMgmt && editItem!=='jname' ? '' : `${editItem==='jname' ? editRow(j.text, 'Job name') : `<div class="row"><button class="main small" id="renj" style="justify-content:center">✏️ Rename job</button></div>`}
        <div class="row"><button class="main small" id="jobdone" style="justify-content:center;color:var(--good)">${j.done?'↩ Put job back on the list':'✔ Mark whole job done'}</button></div>`}
      </div>` + addBox(tab.ph);
    wireBack('#/honeydo');
    app.querySelectorAll('[data-jtab]').forEach(b=>b.onclick=()=>{ go(`#/job/${j.id}/${b.dataset.jtab}`, true); focusSel(`[data-jtab="${b.dataset.jtab}"]`); });
    wireChecklist(()=>j[tab.id]);
    const rj=document.getElementById('renj'); if(rj) rj.onclick=()=>{ editItem='jname'; armed=null; render(); };
    if (editItem==='jname') wireEdit(v=>{ j.text=v; touch(j); }, '#renj');
    wireMgmt();
    const jd=document.getElementById('jobdone'); if(jd) jd.onclick=()=>{
      j.done=!j.done; if (j.done) j.doneAt=now(); else delete j.doneAt;
      touch(j); save(); goBack('#/honeydo');
    };
    wireAdd(t=>{ j[tab.id].push(newItem(t)); save(); render(); focusSel('#newi'); });
    if(!app.contains(document.activeElement)) focusSel('[aria-selected="true"]');
  }

  // Materials from open Honey-Do jobs and projects show up on Shopping automatically,
  // in their job's / project's priority color. Checking one off marks it on hand everywhere.
  function linkedMaterials(){
    const out=[];
    live(data.honeydo).filter(j=>!j.done).forEach(j=>live(j.materials).forEach(m=>out.push({m, from:j.text, pri:priOf(j), key:'h|'+j.id+'|'+m.id})));
    live(data.projects).forEach(p=>live(p.materials).forEach(m=>out.push({m, from:p.name, pri:priOf(p), key:'p|'+p.id+'|'+m.id})));
    return out.sort((a,b)=>(a.m.done-b.m.done)||(a.pri-b.pri)||a.m.text.localeCompare(b.m.text));
  }
  // Shopping opens to three tabs: Projects, Honey-Do (materials pulled in automatically) and Other (your own list).
  // Shopping: All / Projects / Honey-Do / Other. Each list is flat, sorted by priority then A–Z.
  // Tap an item to see where it's from and what you can do with it.
  let showOnHand = false, shopOpen = null, hcat = 'groc';
  try { const v = localStorage.getItem('mrbd-home-hub-hcat'); if (['groc','need','desire'].includes(v)) hcat = v; } catch(e){}
  function renderShopping(sec){
    const arr = data[sec.id], linked = linkedMaterials().filter(x=>!x.m.noshop);
    const own = live(arr);
    const abc = (a,b)=>a.text.localeCompare(b.text, undefined, {sensitivity:'base'});
    const mats = linked.map(x=>({kind:'mat', rk:'m:'+x.key, key:x.key, text:x.m.text, pri:x.pri, from:x.from, src:x.key[0], done:!!x.m.done}));
    const HC = [{id:'groc', label:'Groceries'}, {id:'need', label:'Needs'}, {id:'desire', label:'Desires'}];
    const catOfItem = i => HC.some(c=>c.id===i.cat) ? i.cat : 'need';   // older items count as Needs
    const mineAll = own.map(i=>({kind:'own', rk:'o:'+i.id, id:i.id, text:i.text, pri:9, done:!!i.done, cat:catOfItem(i)}));
    const mine = mineAll;
    const need = l => l.filter(x=>!x.done).length;
    const fromP = mats.filter(x=>x.src==='p'), fromH = mats.filter(x=>x.src==='h');
    const counts = { all: need(mats)+need(mine), projects: need(fromP), honeydo: need(fromH), other: need(mine) };
    const TABS = [{id:'all', label:'All'}, {id:'projects', label:'Projects'}, {id:'honeydo', label:'Honey-Do'}, {id:'other', label:'Household'}];
    let tab = route().b; if (!TABS.some(t=>t.id===tab)) tab = 'all';
    let list = tab==='all' ? mats.concat(mine) : tab==='projects' ? fromP : tab==='honeydo' ? fromH : mine.filter(x=>x.cat===hcat);
    const hiddenDone = tab==='projects' && !showOnHand ? list.filter(x=>x.done).length : 0;
    if (tab==='all' || tab==='honeydo' || (tab==='projects' && !showOnHand)) list = list.filter(x=>!x.done);
    // identical names (ignoring case and extra spaces) are combined into one line with ×2, ×3…
    const norm = t => t.toLowerCase().replace(/\s+/g,' ').trim();
    const groups = new Map();
    list.forEach(x=>{ const k=norm(x.text); if(!groups.has(k)) groups.set(k, []); groups.get(k).push(x); });
    list = [...groups.entries()].map(([k,ms])=>{
      const top = ms.slice().sort((a,b)=>a.pri-b.pri)[0];
      const nice = (ms.find(m=>/^[A-Z0-9]/.test(m.text)) || top).text;   // prefer the capitalized spelling
      return {rk:'g:'+k, text:nice, pri:top.pri, done:ms.every(m=>m.done), members:ms, kind: ms.every(m=>m.kind==='own') ? 'own' : 'mat'};
    }).sort((a,b)=>a.done-b.done || a.pri-b.pri || abc(a,b));
    const G = {}; list.forEach(g=>G[g.rk]=g);
    const row = g => {
      const open = shopOpen===g.rk, n = g.members.length;
      const col = g.kind==='mat' && !g.done ? 'color:'+PRI_COLOR[g.pri] : '';
      let acts = '';
      if (open) {
        acts = `<div class="row rowacts" style="flex-direction:column;gap:1vw">` + g.members.map(m=> m.kind==='mat'
            ? `<button class="main" data-sgo="${m.key}" style="justify-content:flex-start;color:${PRI_COLOR[m.pri]}">P${m.pri} · ${esc(m.from)} ›${m.done?' <span class="sub">(on hand)</span>':''}</button>`
            : `<div class="main sub" style="justify-content:flex-start">🛒 Household · ${HC.find(c=>c.id===m.cat).label}${m.cat==='groc'?' (on Kitchen Groceries)':' (on Kitchen Desires &amp; Needs)'}${m.done?' · got it':''}</div>`).join('') + `</div>`
          + (g.kind==='own' && n===1 ? `<div class="row rowacts">${HC.map(c=>`<button class="main small" data-scat="${g.members[0].id}|${c.id}" ${c.id===g.members[0].cat?'disabled':''} style="justify-content:center">${c.id===g.members[0].cat?'• ':'→ '}${c.label}</button>`).join('')}</div>` : '') + `
          <div class="row rowacts">
            <button class="main" data-gtog="${g.rk}" style="justify-content:center;color:var(--good)">${g.done?'↩ Undo':'✔ Got it'}${n>1?' (all '+n+')':''}</button>
            <button class="main ${armed==='g'+g.rk?'danger':''}" data-grm="${g.rk}" style="justify-content:center">${armed==='g'+g.rk?'Sure?':(g.kind==='own'?'🗑 Delete':'✕ Off list')}${n>1&&armed!=='g'+g.rk?' (all)':''}</button></div>`;
      }
      return `<div class="row ${g.done?'done':''}"><button class="main${open?' opened':''}" data-sopen="${g.rk}" aria-expanded="${open}">
          <span class="t" style="${col}">${esc(g.text)}${n>1?` <span class="qty">×${n}</span>`:''}</span><span class="check">${g.done?'✔':'○'}</span></button></div>` + acts;
    };
    let body = list.map(row).join('');
    if (!body) body = `<div class="empty">${tab==='other'||tab==='all' ? 'Nothing on the list.<br>Add something below.' : 'Nothing to get here. 👍'}</div>`;
    const catTabs = tab==='other' ? `<div class="tabs stabs ctabs" role="tablist">${HC.map(c=>{ const n=need(mine.filter(x=>x.cat===c.id));
      return `<button role="tab" data-hcat="${c.id}" aria-selected="${c.id===hcat}">${c.label}<span class="cnt${n?'':' zero'}">${n}</span></button>`; }).join('')}</div>
      <div class="sub" style="margin:0 1vw 1vw">${hcat==='groc' ? 'These go on Melissa’s Kitchen Groceries list.' : 'These go on Melissa’s Kitchen Desires &amp; Needs list.'}</div>` : '';
    if (tab==='projects' && (hiddenDone || showOnHand) && fromP.some(x=>x.done)) body += `<div class="row"><button class="main small" id="onhand" style="justify-content:center;color:var(--good)">${showOnHand?'Hide':'Show'} ${fromP.filter(x=>x.done).length} on hand</button></div>`;
    const doneOwn = own.filter(i=>i.done && (tab!=='other' || catOfItem(i)===hcat));
    if (tab==='other' && doneOwn.length) body += `<div class="row"><button class="main small ${armed==='clear'?'danger':''}" id="clear" style="justify-content:center">${armed==='clear'?'Press again to clear':'Clear '+doneOwn.length+' done'}</button></div>`;
    const HH = tab==='other';   // Household is its own page: just Groceries, Needs, Desires
    app.innerHTML = (HH ? header('🏠 Household', '#/shopping/all', `${counts.other} to get`) : header(`${sec.icon} ${sec.label}`, '#/', `${counts.all} to get`)) +
      (HH ? '' : `<div class="tabs stabs" role="tablist">${TABS.map(t=>`<button role="tab" data-stab="${t.id}" aria-selected="${t.id===tab}">${t.label}<span class="cnt${counts[t.id]?'':' zero'}">${counts[t.id]}</span></button>`).join('')}</div>`) + `
      ${catTabs}<div class="scroll">${body}</div>` + (tab==='other' || tab==='all' ? addBox(tab==='other' ? 'Add to ' + HC.find(c=>c.id===hcat).label : sec.ph) : '');
    wireBack(HH ? '#/shopping/all' : '#/');
    const findMat = key => { const [src,pid,mid]=key.split('|'); const parent=(src==='h'?data.honeydo:data.projects).find(x=>x.id===pid); return parent && (parent.materials||[]).find(x=>x.id===mid); };
    app.querySelectorAll('[data-stab]').forEach(b=>b.onclick=()=>{ shopOpen=null; go(`#/shopping/${b.dataset.stab}`, true); focusSel(`[data-stab="${b.dataset.stab}"]`); });
    app.querySelectorAll('[data-sopen]').forEach(b=>b.onclick=()=>{ const k=b.dataset.sopen; shopOpen = shopOpen===k ? null : k; armed=null; render(); focusSel(`[data-sopen="${k}"]`); });
    app.querySelectorAll('[data-sgo]').forEach(b=>b.onclick=()=>{ const [src,pid]=b.dataset.sgo.split('|'); shopOpen=null; go(src==='p' ? `#/p/${pid}/materials` : `#/job/${pid}/materials`); });
    app.querySelectorAll('[data-hcat]').forEach(b=>b.onclick=()=>{ hcat=b.dataset.hcat; try{ localStorage.setItem('mrbd-home-hub-hcat', hcat); }catch(e){} shopOpen=null; armed=null; render(); focusSel(`[data-hcat="${hcat}"]`); });
    app.querySelectorAll('[data-scat]').forEach(b=>b.onclick=()=>{
      const [id,c]=b.dataset.scat.split('|'); const t=live(arr).find(i=>i.id===id); if(!t) return;
      t.cat=c; touch(t); shopOpen=null; save(); render(); focusFirst(); toast('Moved to ' + HC.find(x=>x.id===c).label);
    });
    const oh=document.getElementById('onhand'); if(oh) oh.onclick=()=>{ showOnHand=!showOnHand; render(); focusSel('#onhand'); };
    const setDone = (m, v) => {
      const t = m.kind==='mat' ? findMat(m.key) : live(arr).find(i=>i.id===m.id); if(!t) return;
      t.done = v; if(v) t.doneAt=now(); else delete t.doneAt; touch(t);
    };
    app.querySelectorAll('[data-gtog]').forEach(b=>b.onclick=()=>{
      const g=G[b.dataset.gtog]; if(!g) return; const v=!g.done;
      g.members.forEach(m=>setDone(m, v)); shopOpen=null; armed=null; save(); render(); focusFirst();
    });
    app.querySelectorAll('[data-grm]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.grm, g=G[k]; if(!g) return;
      if (armed!=='g'+k){ armed='g'+k; render(); focusSel(`[data-grm="${k}"]`); return; }
      g.members.forEach(m=>{
        if (m.kind==='mat'){ const t=findMat(m.key); if(t){ t.noshop='gone'; touch(t); } }
        else { const t=live(arr).find(i=>i.id===m.id); if(t) remove(t); }
      });
      armed=null; shopOpen=null; save(); render(); focusFirst();
      if (g.kind==='mat') toast('Off the shopping list.<br><span class="sub">Tap 🛒 in its Materials tab to put it back.</span>');
    });
    const clr=document.getElementById('clear');
    if(clr) clr.onclick=()=>{
      if(armed==='clear'){ doneOwn.forEach(remove); armed=null; save(); render(); focusFirst(); }
      else { armed='clear'; render(); focusSel('#clear'); }
    };
    if (tab==='other' || tab==='all') wireAdd(t=>{ const it=newItem(t); it.cat = tab==='other' ? hcat : 'need'; data[sec.id].push(it); save(); render(); focusSel('#newi'); });
    if(!app.contains(document.activeElement)) focusSel('[aria-selected="true"]');
  }
  function renderList(sec){
    if (sec.id==='shopping') return renderShopping(sec);
    const arr = data[sec.id];
    const doneItems = live(arr).filter(i=>i.done);
    app.innerHTML = header(`${sec.icon} ${sec.label}`, '#/', `${countOpen(arr)} left`) + `
      <div class="scroll">
        ${checklistRows(arr) || `<div class="empty">All clear. Enjoy it while it lasts.</div>`}
        ${doneItems.length?`<div class="row"><button class="main small ${armed==='clear'?'danger':''}" id="clear" style="justify-content:center">${armed==='clear'?'Press again to clear':'Clear '+doneItems.length+' done'}</button></div>`:''}
      </div>` + addBox(sec.ph);
    wireBack('#/');
    wireChecklist(()=>data[sec.id]);
    const clr=document.getElementById('clear');
    if(clr) clr.onclick=()=>{
      if(armed==='clear'){ doneItems.forEach(remove); armed=null; save(); render(); focusFirst(); }
      else { armed='clear'; render(); focusSel('#clear'); }
    };
    wireAdd(t=>{ data[sec.id].push(newItem(t)); save(); render(); focusSel('#newi'); });
    if(!app.contains(document.activeElement)) focusFirst();
  }

  function progress(p){ const s=live(p.steps), d=s.filter(x=>x.done).length; return {n:s.length,d,pct:s.length?Math.round(d/s.length*100):0}; }

  function renderProjects(priStr){
    const all = live(data.projects);
    const pri = PRIS.includes(+priStr) ? +priStr : (PRIS.find(n=>all.some(p=>priOf(p)===n)) || 1);
    const rows = all.filter(p=>priOf(p)===pri).map(p=>{
      const g=progress(p);
      if (LIGHT) return `<div class="row"><button class="main block${openRow===p.id?' opened':''}" data-rowopen="${p.id}" aria-expanded="${openRow===p.id}">
        <span class="t">${esc(p.name)}</span>
        <div class="sub" style="display:flex"><span>${g.n?`${g.d}/${g.n} steps done`:'No steps yet'}</span><span style="margin-left:auto;color:${PRI_COLOR[pri]}">P${pri}</span></div>
        <div class="bar"><i style="width:${g.pct}%"></i></div></button></div>${openRow===p.id?`<div class="row rowacts">
        <button class="main" data-open="${p.id}" style="justify-content:center">📂 Open</button>
        <button class="main" data-pri="${p.id}" style="justify-content:center;color:${PRI_COLOR[pri]}">P${pri} priority</button></div>`:''}${pickerRow(p)}`;
      return `<div class="row"><button class="main block" data-open="${p.id}">
        <span class="t">${esc(p.name)}</span>
        <div class="sub">${g.n?`${g.d}/${g.n} steps done`:'No steps yet'}</div>
        <div class="bar"><i style="width:${g.pct}%"></i></div></button>
        <button class="x" data-pri="${p.id}" aria-label="Change priority" style="color:${PRI_COLOR[pri]}">P${pri}</button></div>${pickerRow(p)}`;
    }).join('');
    app.innerHTML = header('🛠 Projects', '#/', `${all.length} total`) +
      priTabs(n=>all.filter(p=>priOf(p)===n).length, pri) +
      `<div class="scroll">${rows || `<div class="empty">No priority ${pri} projects.<br>${pri===1?'Nothing on fire. Nice.':'Add one below.'}</div>`}</div>` + addBox(`New priority ${pri} project`, 'projects');
    wireBack('#/'); wireOverview();
    app.querySelectorAll('[data-ptab]').forEach(b=>b.onclick=()=>{ priOpen=null; go(`#/projects/${b.dataset.ptab}`, true); focusSel(`[data-ptab="${b.dataset.ptab}"]`); });
    app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ priOpen=null; go(`#/p/${b.dataset.open}/goals`); });
    wirePriPicker(data.projects);
    app.querySelectorAll('[data-rowopen]').forEach(b=>b.onclick=()=>{ const id=b.dataset.rowopen; openRow = openRow===id ? null : id; priOpen=null; render(); focusSel(`[data-rowopen="${id}"]`); });
    wireAdd(t=>{
      const r = parsePri(t, pri);
      const p={id:uid(),name:r.text,pri:r.pri,goals:[],materials:[],steps:[],c:now(),u:now()};
      data.projects.push(p); save();
      if (r.pri!==pri) go(`#/projects/${r.pri}`, true);   // so Back lands on the right tab
      go(`#/p/${p.id}/goals`);
    });
    if(!app.contains(document.activeElement)) focusSel('[aria-selected="true"]');
  }

  function renderProject(id, tabId){
    const p=live(data.projects).find(x=>x.id===id); if(!p) return go('#/projects', true);

      <div class="tabs" role="tablist">${PROJECT_TABS.map(t=>{ const c=live(p[t.id]).length; return `<button role="tab" data-tab="${t.id}" aria-selected="${t.id===tab.id}">${t.label}${c?' ('+c+')':''}</button>`; }).join('')}</div>
      <div class="scroll">
        ${checklistRows(p[tab.id], true, tab.id==='materials') || '<div class="empty">Nothing here yet.</div>'}
        ${LIGHT && !showMgmt && editItem!=='pname' ? '' : `${editItem==='pname' ? editRow(p.name, 'Project name') : `<div class="row"><button class="main small" id="renp" style="justify-content:center">✏️ Rename project</button></div>`}
        <div class="row"><button class="main small ${armed===p.id?'danger':''}" id="delp" style="justify-content:center">${armed===p.id?'Press again to delete project':'🗑 Delete project'}</button></div>`}

    wireChecklist(()=>p[tab.id]);

  function fmtDate(ts){ try { return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'}); } catch(e){ return ''; } }
  const noteCat = n => n.cat || 'personal'; // older notes land in Personal

  // Notes saved from Lumber Walk start "Lumber walk 11/15 · Aisle 17: J-hooks are full."
  // Show the date in orange and the area + standard in blue; everything else stays white.
  const LW_LINE = /^((?:Lumber walk|Observation|Monday meeting) \d+\/\d+)( · )([^:\n]+?)(: )?(.*)$/;
  function noteLineHtml(line){
    const m = String(line).match(LW_LINE);
    if (!m) return esc(line);
    return `<span class="nd">${esc(m[1])}</span><span class="nsep">${esc(m[2])}</span><span class="ns">${esc(m[3])}${esc(m[4]||'')}${esc(m[5]||'')}</span>`;
  }
  const noteHtml = text => String(text).split('\n').map(noteLineHtml).join('\n');
  let showDoneNotes = false;
  function renderNotes(catId){
    const tab = NOTE_TABS.find(t=>t.id===catId) || NOTE_TABS[0];
    const all = live(data.notes);
    const inTab=all.filter(n=>noteCat(n)===tab.id).sort((a,b)=>b.created-a.created);
    const notes=inTab.filter(n=>!n.done), doneNotes=inTab.filter(n=>n.done);
    const block = n => `<div class="row"><button class="main block notecard${n.done?' crossed':''}" data-note="${n.id}">
      <span class="sub">${fmtDate(n.created)}${n.done?' · ✔ done':''}</span>
      <span class="preview">${noteHtml(n.text.replace(/^✓ /gm,''))}</span></button></div>`;

  // ----- Contacts: Work / Personal, press to call -----
  const CONTACT_TABS = [
    {id:'work', label:'💼 Work'},
    {id:'personal', label:'🏡 Personal'}
  ];
  // Groups inside each contact tab. Add another by adding a line here (the last one catches everything else).
  const GROUPS = {
    work: [{id:'boss', label:'Bosses'}, {id:'team', label:'My Team'}, {id:'cust', label:'Customers'}, {id:'other', label:'Others'}],
    personal: [{id:'fam', label:'Family'}, {id:'friend', label:'Friends'}, {id:'other', label:'Other'}]
  };
  const catOf = c => c.cat || 'personal';
  const groupsFor = cat => GROUPS[cat] || [{id:'other', label:'Other'}];
  const grpOf = c => groupsFor(catOf(c)).some(g=>g.id===c.grp) ? c.grp : 'other';   // older contacts land in Other(s)
  const grpLabel = (cat, id) => (groupsFor(cat).find(g=>g.id===id) || groupsFor(cat).slice(-1)[0]).label;
  // "Mike Johnson 614 555 1234" -> name + number (works with dictation)
  function parseContact(text){
    const m = text.match(/^(.*?)[\s,:\-]*(\+?\(?\d[\d\s().\-]{5,}\d)\s*$/);
    if (!m || !m[1].trim()) return null;
    const name = m[1].trim().replace(/\b\w/g, c=>c.toUpperCase());
    return {name, phone: m[2].trim()};
  }
  const dialable = ph => ph.replace(/[^\d+]/g,'');
  function prettyPhone(ph){
    const d = dialable(ph);
    const m = d.match(/^(?:\+?1)?(\d{3})(\d{3})(\d{4})$/);
    return m ? `(${m[1]}) ${m[2]}-${m[3]}` : ph;
  }
  let toastTimer=null;
  function toast(html){
    const t=document.getElementById('toast'); t.innerHTML=html; t.style.display='block';
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display='none', 6000);
  }

  // ----- Group text: pick several people, then open one Messages thread to all of them -----
  const picked = new Set();
  const openSecs = new Set();   // which group headers are open (all start closed)
  let groupMsg = '';
  const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);

    const b = body ? encodeURIComponent(body) : '';
    return IS_IOS ? `sms://open?addresses=${nums.join(',')}${b?'&body='+b:''}` : `sms:${nums.join(',')}${b?'?body='+b:''}`;

      <div class="scroll">
        ${body || '<div class="empty">No contacts with phone numbers yet.</div>'}
        ${picked.size?`<div class="row" style="margin-top:3vw"><button class="main small" id="clearpick" style="justify-content:center">Clear picks</button></div>`:''}
      </div>
      ${IS_PHONE?`<div class="add"><input id="gmsg" type="text" placeholder="Message (optional)" value="${esc(groupMsg)}"></div>`:''}
      <div class="add">${nums.length
        ? `<a class="main" id="sendg" href="${groupSmsLink(nums, groupMsg)}" target="_top" style="flex:1;justify-content:center;color:var(--good);display:flex">💬 Text ${nums.length} ${nums.length===1?'person':'people'}</a>`
        : `<button class="main" style="flex:1;text-align:center;color:var(--dim)" disabled>Pick people to text</button>`}</div>`;
    wireBack('#/contacts');
    app.querySelectorAll('[data-ctab]').forEach(b=>b.onclick=()=>{ go(`#/contacts/${b.dataset.ctab}`, true); focusSel(`[data-ctab="${b.dataset.ctab}"]`); });
    app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ const id=b.dataset.pick; picked.has(id)?picked.delete(id):picked.add(id); render(); focusSel(`[data-pick="${id}"]`); });
    app.querySelectorAll('[data-gsec]').forEach(b=>b.onclick=()=>{ const k=b.dataset.gsec; openSecs.has(k)?openSecs.delete(k):openSecs.add(k); render(); focusSel(`[data-gsec="${k}"]`); });
    app.querySelectorAll('[data-gall]').forEach(b=>b.onclick=()=>{
      const x=sections.find(s=>s.t.id+'.'+s.g.id===b.dataset.gall), on=x.people.every(c=>picked.has(c.id));
      x.people.forEach(c=>on?picked.delete(c.id):picked.add(c.id)); render(); focusSel(`[data-gall="${b.dataset.gall}"]`);
    });
    const cl=document.getElementById('clearpick'); if(cl) cl.onclick=()=>{ picked.clear(); render(); focusFirst(); };
    const gm=document.getElementById('gmsg');
    if(gm) gm.addEventListener('input', ()=>{ groupMsg=gm.value; const a=document.getElementById('sendg'); if(a) a.href=groupSmsLink(nums, groupMsg); });

    if(sg) sg.addEventListener('click', ()=>toast(IS_PHONE?'Opening Messages…':'Group texts open on the phone.<br><span class="sub">On the glasses, say "Hey Meta, send a message to…" one person at a time.</span>'));

  }
  function renderContacts(catId, grpId){

    app.querySelectorAll('[data-copen]').forEach(b=>b.onclick=()=>go(`#/contact/${b.dataset.copen}`));
    document.getElementById('newc').onclick=()=>go(`#/contact/new/${tab.id}${grp?'/'+grp:''}`);
    const imp=document.getElementById('impc'); if(imp) imp.onclick=()=>importContacts(tab.id, grp);
    app.querySelectorAll('[data-gtab]').forEach(b=>b.onclick=()=>{ go(`#/contacts/${tab.id}/${b.dataset.gtab}`, true); focusSel(`[data-gtab="${b.dataset.gtab}"]`); });

      const c = parseContact(t);

  // ----- Bring people in from the phone's own Contacts app -----
  // Uses the phone's contact picker when it has one; otherwise takes a shared contact card (.vcf file).
  function addImported(list, cat, grp){
    let added=0, skipped=0;
    list.forEach(p=>{
      const name=(p.name||'').trim(), phone=(p.phone||'').trim(), email=(p.email||'').trim(), pos=(p.pos||'').trim();
      if (!name || (!phone && !email)){ skipped++; return; }
      const dup = live(data.contacts).some(c=>c.name.toLowerCase()===name.toLowerCase() && dialable(c.phone||'')===dialable(phone));
      if (dup){ skipped++; return; }
      data.contacts.push(Object.assign({id:uid(), name, phone, email, pos, cat, c:now(), u:now()}, grp?{grp}:{})); added++;
    });
    if (added) save();
    render();
    toast(added ? `Added ${added} contact${added>1?'s':''}${skipped?` <span class="sub">(${skipped} skipped: already here or no number/email)</span>`:''}.`
                : 'Nothing new to add. They\'re already here or had no number or email.');
  }
  function parseVcf(text){
    const lines = text.replace(/\r\n?/g,'\n').replace(/\n[ \t]/g,'').split('\n');   // unfold wrapped lines
    const out=[]; let cur=null;
    const val = l => l.slice(l.indexOf(':')+1).replace(/\\n/gi,' ').replace(/\\([,;\\])/g,'$1').trim();
    lines.forEach(l=>{
      const key = l.split(':')[0].split(';')[0].replace(/^item\d+\./i,'').toUpperCase();
      if (key==='BEGIN'){ cur={}; return; }
      if (!cur) return;
      if (key==='END'){ out.push(cur); cur=null; return; }
      if (key==='FN') cur.name = val(l);
      else if (key==='N' && !cur.name){ const p=val(l).split(';'); cur.name=[p[1],p[0]].filter(Boolean).join(' '); }
      else if (key==='TEL' && !cur.phone) cur.phone = val(l);
      else if (key==='EMAIL' && !cur.email) cur.email = val(l);
      else if (key==='TITLE') cur.pos = val(l);
      else if (key==='ORG' && !cur.pos) cur.pos = val(l).split(';')[0];
    });
    return out;
  }
  async function importContacts(cat, grp){
    if (navigator.contacts && navigator.contacts.select){
      try {
        const props = await navigator.contacts.getProperties().catch(()=>['name','tel','email']);
        const res = await navigator.contacts.select(['name','tel','email'].filter(p=>props.includes(p)), {multiple:true});
        if (!res || !res.length) return;
        addImported(res.map(r=>({name:(r.name||[])[0], phone:(r.tel||[])[0], email:(r.email||[])[0]})), cat, grp);
        return;
      } catch(e){ /* fall through to the file option */ }
    }
    const inp=document.createElement('input'); inp.type='file'; inp.accept='.vcf,text/vcard,text/x-vcard'; inp.multiple=true;
    inp.onchange=async ()=>{
      let people=[];
      for (const f of inp.files){ try { people = people.concat(parseVcf(await f.text())); } catch(e){} }
      if (!people.length){ toast("That didn't look like a contact card. In Contacts, open a person → Share Contact → Save to Files, then pick that file here."); return; }
      addImported(people, cat, grp);
    };
    toast('Pick a contact card file.<br><span class="sub">Make one in Contacts: open a person → Share Contact → Save to Files.</span>');
    inp.click();
  }

  // One contact: call / text / email, plus edit and delete
  let formOpen = false;   // a contact form is on screen; don't redraw it under the user
  function renderContact(id){
