  // Editing a note: tap a line to change just that line, or (on the phone) edit the whole note at once.
  let editLine = null;   // number = that line is open for editing, 'all' = whole note
  function renderNote(id){
    const n=live(data.notes).find(x=>x.id===id); if(!n) return go('#/notes', true);
    const cur=NOTE_TABS.find(t=>t.id===noteCat(n)) || NOTE_TABS[0];
    const others=NOTE_TABS.filter(t=>t.id!==cur.id);
    const listHash='#/notes/'+cur.id;
    const lines = n.text.split('\n');
    // Each line broken into pieces small enough that swiping on the glasses walks through all of it
    const piecesOf = ln => {
      const txt = ln.replace(/^✓ /,''); if (!txt.trim()) return [];
      if (txt.length <= 140 || LW_LINE.test(txt)) return [txt];
      const bits = (txt.match(/[^.!?]+[.!?]*\s*/g) || [txt]).flatMap(sen => sen.length<=140 ? [sen] : sen.split(/(?<=\s)/));
      return bits.reduce((a,b)=>{ if (a.length && (a[a.length-1]+b).length <= 140) a[a.length-1]+=b; else a.push(b); return a; }, []).map(p=>p.trim());
    };
    const editBox = (val, rows) => `<div class="editbox">
        <textarea id="edt" rows="${rows}" aria-label="Edit">${esc(val)}</textarea>
        <div class="row" style="margin:1.5vw 0 0">
          <button class="main" id="edsave" style="justify-content:center;color:var(--good)">✔ Save</button>
          ${editLine==='all'?'':`<button class="main ${armed==='ln'?'danger':''}" id="eddel" style="justify-content:center">${armed==='ln'?'Sure?':'🗑 Remove'}</button>`}
          <button class="main" id="edcancel" style="justify-content:center">Cancel</button>
        </div></div>`;
    let k=0, body='';
    if (editLine==='all') body = editBox(n.text, Math.min(14, Math.max(5, lines.length+2)));
    else body = lines.map((ln,i)=>{
      if (editLine===i) return editBox(ln.replace(/^✓ /,''), Math.min(6, Math.max(2, Math.ceil(ln.length/34))));
      return piecesOf(ln).map(p=>`<button class="piece${n.done?' crossed':''}" data-lk="${k++}" data-eline="${i}">${noteLineHtml(p)}</button>`).join('');
    }).join('');
    formOpen = editLine!==null;
    app.innerHTML = header(cur.label+' note', listHash, fmtDate(n.created)+(n.done?' · ✔ done':'')) + `
      <div class="scroll">
        ${editLine===null?`<div class="row">
          <button class="main" id="donen" style="justify-content:center;color:var(--good)">${n.done?'↩ Not done':'✔ Done'}</button>
          <button class="main" id="addn" style="justify-content:center;color:var(--accent)">＋ Add to</button>
          <button class="main ${armed===n.id?'danger':''}" id="deln" style="justify-content:center">${armed===n.id?'Sure?':'🗑 Delete'}</button>
        </div>`:''}
        ${body || '<div class="empty">This note is empty.<br>Tap Add to.</div>'}
        ${editLine===null?`<div class="sub" style="margin:1vw 0 2vw .3em">${IS_PHONE?'Tap':'Pinch'} a line to change it.</div>
        ${IS_PHONE?`<div class="row"><button class="main small" id="editall" style="justify-content:center">✏️ Edit whole note</button></div>`:''}
        ${IS_PHONE?(()=>{ const body=n.text.replace(/^✓ /gm,''), subj=body.split('\n')[0].slice(0,60);
          const sms = (IS_IOS ? 'sms:&body=' : 'sms:?body=') + encodeURIComponent(body);
          const mail = 'mailto:?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body);
          return `<div class="row"><a class="main small" href="${sms}" target="_top" style="justify-content:center;color:var(--accent)">💬 Text it</a>
            <a class="main small" href="${mail}" target="_top" style="justify-content:center;color:var(--accent)">✉️ Email it</a></div>`; })():''}
        ${others.map(t=>`<div class="row" style="margin-top:2vw"><button class="main small" data-move="${t.id}" style="justify-content:center">Move to ${t.label}</button></div>`).join('')}`:''}
      </div>` + (editLine===null ? addBox('Add to this note') : '');
    wireBack(listHash);
    const done = (focus)=>{ editLine=null; armed=null; formOpen=false; render(); if(!focus || !focusSel(focus)) focusFirst(); };
    if (editLine!==null){
      const ta=document.getElementById('edt'), which=editLine;
      const commit=()=>{
        const v=ta.value.replace(/\s+$/,'');
        if (which==='all') n.text=v;
        else { const ls=n.text.split('\n'); ls[which]=(ls[which].startsWith('✓ ')?'✓ ':'')+v.replace(/\n+/g,' '); n.text=ls.join('\n'); }
        touch(n); save(); toast('Note saved'); done(which==='all'?'#editall':`[data-eline="${which}"]`);
      };
      document.getElementById('edsave').onclick=commit;
      document.getElementById('edcancel').onclick=()=>done(which==='all'?'#editall':`[data-eline="${which}"]`);
      const dl=document.getElementById('eddel');
      if(dl) dl.onclick=()=>{
        if(armed!=='ln'){ armed='ln'; render(); focusSel('#eddel'); return; }
        const ls=n.text.split('\n'); ls.splice(which,1); n.text=ls.join('\n'); touch(n); save(); toast('Line removed'); done();
      };
      // The glasses' dictation finishes with a "change" event; save right away there
      if (!IS_PHONE) ta.addEventListener('change', ()=>{ if (ta.value.trim()) commit(); });
      ta.focus(); try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch(e){}
      return;
    }
    app.querySelectorAll('[data-eline]').forEach(b=>b.onclick=()=>{ editLine=+b.dataset.eline; armed=null; render(); });
    const ea=document.getElementById('editall'); if(ea) ea.onclick=()=>{ editLine='all'; armed=null; render(); };
    app.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{ n.cat=b.dataset.move; touch(n); save(); render(); focusSel('[data-move]'); });
    document.getElementById('donen').onclick=()=>{
      n.done=!n.done; touch(n); save();
      if (n.done){ toast('Note marked done. It\'s tucked under <b>Show done</b> on the list.'); goBack(listHash); }
      else { render(); focusSel('#donen'); }
    };
    document.getElementById('addn').onclick=()=>{ const i=document.getElementById('newi'); i.focus(); i.click(); };
    document.getElementById('deln').onclick=()=>{
      if(armed===n.id){ remove(n); armed=null; save(); goBack(listHash); }
      else { armed=n.id; render(); focusSel('#deln'); }
    };
    wireAdd(t=>{ n.text += '\n' + t; touch(n); save(); render(); focusSel('#newi'); });
    if(!app.contains(document.activeElement)) focusFirst();
  }

  // ---------- background pictures (phone and computer, not the glasses; synced through the Google script) ----------
  const IS_PHONE = (()=>{ try { return innerHeight > innerWidth*1.2 && matchMedia('(pointer: coarse)').matches; } catch(e){ return false; } })();
  const IS_DESK = (()=>{ try { return matchMedia('(pointer: fine)').matches && innerWidth >= 700; } catch(e){ return false; } })();
  const BG_ON = IS_PHONE || IS_DESK;
  const BG_KEY = 'mrbd-home-hub-bg-';
  let bgMenu = false;
  function pageKey(){ const a = route().a; return a==='' ? 'home' : a==='p' ? 'projects' : a==='note' ? 'notes' : a==='job' ? 'honeydo' : a==='overview' ? (route().b==='projects'?'projects':'honeydo') : a==='contact' ? 'contacts' : a; }
  function getBg(k){ try { return localStorage.getItem(BG_KEY+k) || ''; } catch(e){ return ''; } }
  // Each page's picture is also kept in Drive (as hhbg-<page>), so the phone and computer show the same ones
  const BG_PAGES = ['home','projects','honeydo','notes','shopping','contacts'];
  const bgUp = k => { try { return localStorage.getItem(BG_KEY + k + '-up') === '1'; } catch(e){ return false; } };
  function setBgUp(k, v){ try { if (v) localStorage.setItem(BG_KEY + k + '-up', '1'); else localStorage.removeItem(BG_KEY + k + '-up'); } catch(e){} }
  function bgSend(k, url){
    if (!SYNC_URL) return;
    fetch(SYNC_URL + '?action=photo', {method:'POST', body: JSON.stringify({id: 'hhbg-' + k, data: url ? url.split(',')[1] : ''})})
      .then(r => r.json()).then(j => { if (j && j.ok) setBgUp(k, !!url); }).catch(() => {});
  }
  function bgSyncAll(){
    if (!BG_ON || !SYNC_URL) return;
    BG_PAGES.forEach(k => {
      const L = getBg(k);
      if (L && !bgUp(k)) return bgSend(k, L);   // picked on this device and not in Drive yet: send it up
      fetch(SYNC_URL + '?action=photo&id=hhbg-' + k + '&t=' + Date.now(), {cache:'no-store'}).then(r => r.json()).then(j => {
        if (j && j.ok && j.data) {
          const d = 'data:image/jpeg;base64,' + j.data;
          if (d !== L) { try { localStorage.setItem(BG_KEY + k, d); } catch(e){ return; } if (pageKey() === k) applyBg(); }
          setBgUp(k, true);
        } else if (j && j.ok === false && !j.error && L) {   // removed on the other device
          try { localStorage.removeItem(BG_KEY + k); } catch(e){} setBgUp(k, false); if (pageKey() === k) applyBg();
        }
      }).catch(() => {});
    });
  }
  setTimeout(bgSyncAll, 1500);
  function applyBg(){
    const url = BG_ON ? getBg(pageKey()) : '';
    document.body.classList.toggle('has-bg', !!url);
    document.getElementById('bg').style.backgroundImage = url ? `url("${url}")` : '';
  }
  function addBgButton(){
    if (!BG_ON) return;
    const h = app.querySelector('header'); if (!h) return;
    const has = !!getBg(pageKey());
    h.insertAdjacentHTML('beforeend', `<button class="bgbtn" id="bgbtn" aria-label="Background picture for this page">🖼</button>`);
    document.getElementById('bgbtn').onclick = () => { if (has){ bgMenu = !bgMenu; render(); } else document.getElementById('bgfile').click(); };
    if (bgMenu && has){
      h.insertAdjacentHTML('afterend', `<div class="bgmenu"><button id="bgchange">Change picture</button><button id="bgremove">Remove picture</button></div>`);
      document.getElementById('bgchange').onclick = () => { bgMenu=false; document.getElementById('bgfile').click(); };
      document.getElementById('bgremove').onclick = () => { const k = pageKey(); try { localStorage.removeItem(BG_KEY+k); } catch(e){} bgSend(k, ''); bgMenu=false; render(); toast('Picture removed'); };
    }
  }
  // Shrink the photo so it fits in the phone's storage, then save it for this page.
  document.getElementById('bgfile').addEventListener('change', e=>{
    const file = e.target.files && e.target.files[0]; e.target.value = '';
    if (!file) return;
    const key = BG_KEY + pageKey();
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1280, sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let url = c.toDataURL('image/jpeg', 0.72);
        try { localStorage.setItem(key, url); }
        catch(err){
          try { url = c.toDataURL('image/jpeg', 0.5); localStorage.setItem(key, url); }
          catch(err2){ toast('That picture is too big to save. Try another, or remove a picture from another page.'); return; }
        }
        setBgUp(key.slice(BG_KEY.length), false); bgSend(key.slice(BG_KEY.length), url);
        bgMenu = false; render();
      };
      img.onerror = () => toast("Couldn't open that picture. Try a different one.");
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });

  function render(){
    renderPage(); applyBg(); addBgButton();
  }
  function renderPage(){
    formOpen=false;
    const r=route();
    const sec=SECTIONS.find(s=>s.id===r.a);
    if (r.a==='p' && r.b) renderProject(r.b, r.c);
    else if (r.a==='overview') renderOverview(r.b);
    else if (r.a==='projects') renderProjects(r.b);
    else if (r.a==='job' && r.b) renderJob(r.b, r.c);
    else if (r.a==='notes') renderNotes(r.b);
    else if (r.a==='note' && r.b) renderNote(r.b);
    else if (r.a==='contacts') renderContacts(r.b, r.c);
    else if (r.a==='contact' && r.b==='new') renderContactForm(null, r.c, r.d);
    else if (r.a==='contact' && r.b && r.c==='edit') renderContactForm(r.b);
    else if (r.a==='contact' && r.b) renderContact(r.b);
    else if (sec && sec.kind==='priority') renderPriority(sec, r.b);
    else if (sec && sec.kind==='list') renderList(sec);
    else renderHome();
  }

  app.addEventListener('focusin', e=>{ if(e.target.scrollIntoView) e.target.scrollIntoView({block:'nearest'}); });
  // Swipe up/down on the glasses: step to the row above/below in page order, so every note,
  // line and list item gets a turn (the glasses' own guessing skipped things inside the scroll area).
  const FOCUSABLE = 'button, a[href], input, [tabindex="0"]';
  const lineOf = el => el.closest('.row, .tabs, .add, header, .bgmenu') || el;
  document.addEventListener('keydown', e=>{
    if (e.key!=='ArrowDown' && e.key!=='ArrowUp') return;
    if (e.target && e.target.tagName==='TEXTAREA' && IS_PHONE) return;   // let the phone's cursor move inside a note being edited
    const all = [...app.querySelectorAll(FOCUSABLE)].filter(el=>!el.disabled && el.offsetParent!==null);
    if (!all.length) return;
    const cur = document.activeElement;
    let i = all.indexOf(cur);
    if (i<0){ e.preventDefault(); all[0].focus(); return; }
    const myLine = lineOf(cur), dir = e.key==='ArrowDown' ? 1 : -1;
    let j = i;
    while (j>=0 && j<all.length && lineOf(all[j])===myLine) j+=dir;
    if (j<0 || j>=all.length) return;          // already at the top or bottom
    const line = lineOf(all[j]);
    const members = all.filter(el=>lineOf(el)===line);
    const pick = members.find(el=>el.getAttribute('aria-selected')==='true') || (dir>0 ? members[0] : members[0]);
    e.preventDefault(); pick.focus();
  }, true);
  window.addEventListener('popstate', ()=>{
    armed=null;
    if (stack.length > 1) stack.pop();
    else { try { stack=[location.hash||'#/']; } catch(e){ stack=['#/']; } }
    render();
  });
  // Check for changes from the other device on open, when the app comes back into view, and every 20 seconds.
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') sync(); });
  setInterval(()=>{ if(document.visibilityState!=='hidden') sync(); }, 20000);

  try { render(); } catch(e){ app.innerHTML = '<div class="empty">Something went sideways. Reload to try again.</div>'; }
  sync();
})();
</script>
</body>
</html>
