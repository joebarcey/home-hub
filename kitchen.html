<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<meta name="theme-color" content="#f5f6f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151a17" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-kitchen.png">
<link rel="icon" type="image/png" href="icon-kitchen.png">
<title>Kitchen Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
  /* Layout: one column, header + content + fixed bottom tab bar. Herb green on a faintly green-white. */
  :root{
    --bg:#f5f6f1; --card:#ffffff; --ink:#1d2420; --muted:#68736c; --line:#dfe3dc;
    --accent:#2f6b4f; --accent-ink:#ffffff; --accent-soft:#e3eee7; --warn:#b8452f; --done:#9aa49d;
    --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#151a17; --card:#1e2521; --ink:#e9eee9; --muted:#9aa69e; --line:#2e3832;
      --accent:#7cc39c; --accent-ink:#0f1a14; --accent-soft:#233a2d; --warn:#ef8a72; --done:#5f6a63;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
  button,input,textarea{font:inherit;color:inherit}
  #app{min-height:100%;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 88px) max(16px, env(safe-area-inset-left,0px))}
  header{display:flex;align-items:baseline;gap:12px;margin:6px 0 14px;min-height:2.2rem}
  h1{font:700 1.75rem/1.1 var(--display);margin:0;flex:1;letter-spacing:-.01em;text-wrap:balance}
  .sync{font-size:.8rem;color:var(--muted);white-space:nowrap}
  .sync{border:0;background:none;padding:0;font:inherit;font-size:.8rem;cursor:default;min-width:6.2em;text-align:right}
  .news{display:flex;gap:10px;align-items:center;background:#fff4c2;color:#3a2f00;border:1.5px solid #e0a400;border-radius:14px;padding:10px 12px;margin:-4px 0 12px}
  .news > div{flex:1} .news .btn{flex:0 0 auto}
  .hdform textarea{width:100%;margin-top:8px;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--card);resize:vertical}
  body.has-bg .hdform textarea{background-color:var(--glass)}
  .hdnote{display:block;margin-top:4px;padding:4px 8px;border-left:3px solid var(--accent);background:rgba(0,0,0,.04);border-radius:6px;font-size:.95rem;color:var(--ink);white-space:pre-wrap}
  @media (prefers-color-scheme: dark){ .hdnote{background:rgba(255,255,255,.07)} }
  .kform{display:grid;gap:8px;margin-bottom:6px}
  .kform input, .kform textarea, .kform select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--card);font:inherit;color:inherit}
  .kform textarea{resize:vertical;min-height:0;height:3.4em}
  .chips{display:flex;gap:6px} .chips .chip{flex:1}
  .krow{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
  .krow label,.kreprow{display:grid;gap:3px;font-size:.8rem;color:var(--muted);font-weight:600}
  .kcard{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
  .kcard.knew{border-color:#e0a400;box-shadow:0 0 0 2px rgba(255,213,74,.35)}
  .kcard.kdone .ktext{color:var(--done);text-decoration:line-through}
  .ktop{display:flex;align-items:flex-start;gap:8px} .ktext{flex:1;font-size:1.02rem} .ktop .x{padding:0 4px}
  .kmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px;font-size:.85rem}
  .kdue{color:var(--muted);font-weight:600} .kdue.klate{color:var(--warn)}
  .kst{border-radius:20px;padding:2px 9px;font-weight:700;font-size:.8rem;background:var(--accent-soft);color:var(--accent)}
  .kst-new{background:#eef0f3;color:#5b6573} .kst-help{background:#fde3dc;color:#b8452f} .kst-done{background:#dff1e6;color:#2e7d4f} .kst-onit{background:#e2ecfb;color:#2f5fb3}
  .kreply{margin-top:6px;font-style:italic;color:var(--ink)}
  .kdone-list summary{cursor:pointer;color:var(--muted);font-weight:600;margin:4px 0 8px}
  body.has-bg .kcard, body.has-bg .kform input, body.has-bg .kform textarea, body.has-bg .kform select{background-color:var(--glass)}
  /* Joe's items from Home Hub */
  .row.joe .text{color:#e0a400}
  @media (prefers-color-scheme: dark){ .row.joe .text{color:#ffd54a} }
  .row.joe.done .text{opacity:.75}
  .tag.joetag{background:#ffd54a;color:#3a2f00}
  .sync.none{color:var(--accent);text-decoration:underline;cursor:pointer}
  .connect{background:var(--card);border:1.5px solid var(--accent);border-radius:16px;padding:14px;margin-bottom:14px}
  .sync.ok{color:var(--accent)} .sync.off{color:var(--warn)}

  /* Background pictures: a veil in the page color keeps text readable in light and dark. */
  :root{ --veil: rgba(245,246,241,.62); --glass: rgba(255,255,255,.78) }
  @media (prefers-color-scheme: dark){ :root{ --veil: rgba(21,26,23,.62); --glass: rgba(30,37,33,.8) } }
  #bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;display:none}
  #bg::after{content:"";position:absolute;inset:0;background:var(--veil)}
  body.has-bg{background:transparent}
  body.has-bg #bg{display:block}
  body.has-bg .list, body.has-bg .addrow input, body.has-bg .field, body.has-bg textarea, body.has-bg .chip:not([aria-selected="true"]):not([aria-checked="true"]),
  body.has-bg .btn.ghost, body.has-bg .btn.danger, body.has-bg .connect{background-color:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  body.has-bg .empty, body.has-bg .section, body.has-bg header, body.has-bg .hint, body.has-bg p.sub{text-shadow:0 0 6px var(--bg),0 0 2px var(--bg)}
  .bgbtn{flex:0 0 auto;align-self:center;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:5px 8px;font-size:1rem;line-height:1;cursor:pointer}
  .bgmenu{display:flex;gap:8px;margin:-4px 0 12px}
  .bgmenu .btn{flex:1}
  .sub{color:var(--muted);font-size:.85rem}

  .addrow{display:flex;gap:8px;margin-bottom:14px}
  .addrow input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:1rem}
  .addrow input:focus,textarea:focus,.field:focus{outline:none;border-color:var(--accent)}
  .btn{border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
  .btn.danger{background:transparent;color:var(--warn);border:1.5px solid var(--line)}
  .btn:focus-visible,.tab:focus-visible,.item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .list{display:flex;flex-direction:column;background:var(--card);border-radius:16px;border:1px solid var(--line);overflow:hidden}
  .item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;background:none;width:100%;text-align:left;cursor:pointer}
  .item + .item, .row + .row{border-top:1px solid var(--line)}
  .check{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:transparent}
  .done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .done .text{color:var(--done);text-decoration:line-through}
  .text{flex:1;min-width:0;overflow-wrap:anywhere}
  .tag{display:inline-block;margin-left:6px;font-size:.72rem;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);vertical-align:1px;white-space:nowrap}
  .times{display:inline-block;margin-left:6px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .x{flex:0 0 auto;border:0;background:none;color:var(--muted);font-size:1.05rem;padding:6px 8px;border-radius:8px;cursor:pointer}
  .x.armed{color:var(--warn);font-size:.8rem;font-weight:600}
  .row{display:flex;align-items:center}
  .row .item{flex:1}
  .checkbtn{flex:0 0 auto;border:0;background:none;padding:13px 4px 13px 14px;cursor:pointer;display:grid;place-items:center}
  .checkbtn:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;border-radius:10px}
  .row .item.pickable{padding-left:8px}
  .item:disabled{cursor:default;color:inherit}
  .row.picked{background:var(--accent-soft)}
  .mover{display:flex;gap:6px;padding:8px 10px 10px;background:var(--accent-soft)}
  .mv{flex:1;border:1.5px solid var(--accent);background:var(--card);color:var(--accent);border-radius:10px;padding:9px 2px;font-weight:600;font-size:.85rem;cursor:pointer}
  .mv:disabled{opacity:.35;cursor:default}
  .mv:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .empty{color:var(--muted);text-align:center;padding:34px 16px;line-height:1.5}
  .foot{display:flex;justify-content:flex-end;margin-top:10px}
  .section{font:600 .78rem/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 4px 8px}

  /* Meals */
  .meal{display:flex;align-items:center;gap:12px;padding:12px 14px}
  .meal + .meal{border-top:1px solid var(--line)}
  .meal .info{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;cursor:pointer}
  .meal .name{font-weight:600;display:block;overflow-wrap:anywhere}
  .switch{position:relative;flex:0 0 auto;width:52px;height:32px;border-radius:99px;border:0;background:var(--line);cursor:pointer;transition:background .15s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
  .switch[aria-checked="true"]{background:var(--accent)}
  .switch[aria-checked="true"]::after{transform:translateX(20px)}

  /* Recipe editor */
  label{display:block;font-weight:600;margin:14px 2px 6px}
  .field,textarea{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:1rem}
  textarea{min-height:150px;resize:vertical;line-height:1.5}
  .hint{font-size:.8rem;color:var(--muted);margin:6px 2px 0}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chips.wrap{flex-wrap:wrap;overflow:visible;margin-bottom:0}
  .chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 13px;font-size:.88rem;font-weight:500;cursor:pointer;white-space:nowrap}
  .chip[aria-selected="true"],.chip[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .chipn{opacity:.75;font-variant-numeric:tabular-nums}
  .backlink{align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;cursor:pointer;margin-bottom:4px}

  nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);
    padding:6px max(6px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(6px, env(safe-area-inset-left,0px))}
  .tab{flex:1;border:0;background:none;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);cursor:pointer;position:relative}
  .tab .lbl{text-align:center;line-height:1.15}
  .tab .ic{font-size:1.25rem;line-height:1.2}
  .tab[aria-current="page"]{color:var(--accent);font-weight:600}
  .badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:.68rem;line-height:18px;font-weight:600}
  #toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:.9rem;display:none}
  @media (prefers-reduced-motion: reduce){ .switch,.switch::after{transition:none} }
  .ph{display:block;width:100%;height:190px;border:0;border-radius:12px;background:#0002 center/cover no-repeat;margin-top:8px;position:relative;padding:0;cursor:zoom-in}
  .ph.phsm{height:120px}
  .ph span{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.62);color:#fff;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:99px}
  .ph.phwait{background:repeating-linear-gradient(45deg,rgba(128,128,128,.12) 0 10px,rgba(128,128,128,.22) 10px 20px)}
  .ph.phwait span::after{content:' · loading…'}
  .phpick{display:block;text-align:center;cursor:pointer;margin-top:8px}
  #phview{position:fixed;inset:0;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;color:#ccc;font-size:.85rem;gap:10px}
  #phview img{max-width:100%;max-height:88vh;object-fit:contain}
  .rep{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:99px;background:rgba(128,128,128,.15);margin-left:6px;vertical-align:middle;white-space:nowrap}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="app"></div>
<input type="file" id="bgfile" accept="image/*" hidden>
<div id="toast" role="status"></div>
<nav id="nav" aria-label="Sections"></nav>
<script>
(function(){
  // ---------- sync link: arrives once as #sync=..., remembered on this phone ----------
  const SPACE = 'kitchen';
  const LS = 'kitchen-board-v1', LS_DIRTY = LS + '-dirty', LS_SYNC = LS + '-sync', LS_TAB = LS + '-tab';
  function findSyncUrl(){
    const ok = u => /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u);
    let u = '';
    // The link can arrive as ?sync=... (kept in the address) or #sync=... (older links)
    try { const q = new URLSearchParams(location.search).get('sync'); if (q && ok(q)) u = q; } catch(e){}
    if (!u){ try { const m = location.hash.match(/[#&]sync=([^&]+)/); if (m){ const v = decodeURIComponent(m[1]); if (ok(v)) u = v; } } catch(e){} }
    if (u){
      try { localStorage.setItem(LS_SYNC, u); } catch(e){}
      // Keep it in the address as ?sync=..., so a home-screen icon or bookmark saved from here still syncs
      try {
        if (/sync=/.test(location.hash) || new URLSearchParams(location.search).get('sync') !== u)
          history.replaceState(null, '', location.pathname + '?sync=' + u);
      } catch(e){}
    }
    if (!u){ try { const v = localStorage.getItem(LS_SYNC) || ''; if (ok(v)) u = v; } catch(e){} }
    return u;
  }
  const SYNC_URL = findSyncUrl();

  const LISTS = ['todo','groceries','shopping','recipes','honeydo','chores','repeats'];
  const TABS = [
    {id:'todo',      ic:'✓',  label:'To-Do'},
    {id:'groceries', ic:'🥕', label:'Weekly Shopping'},
    {id:'shopping',  ic:'🛍', label:'Desires & Needs'},
    {id:'meals',     ic:'🍽', label:'Meals'},
    {id:'recipes',   ic:'📖', label:'Recipes'},
    {id:'honeydo',   ic:'🔨', label:'Honey-Do'},
    {id:'kids',      ic:'👟', label:'Kids'}
  ];
  // The kids' apps (kids.html?kid=k1 / k2). Change the names here and in kids.html.
  const KIDS = [{id:'k1', name:'Eric'}, {id:'k2', name:'Lestina'}];
  const kidName = id => (KIDS.find(k=>k.id===id)||{name:'?'}).name;

  const app = document.getElementById('app'), nav = document.getElementById('nav');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const now = () => Date.now();
  const esc = s => { const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; };
  const live = a => (a||[]).filter(x=>!x.del);
  const touch = x => { x.u = now(); };
  const remove = x => { x.del = true; x.u = now(); };
  const norm = s => String(s||'').trim().toLowerCase().replace(/\s+/g,' ');

  // ---------- storage ----------
  let mem = null;
  function load(){
    let d = null;
    try { const s = localStorage.getItem(LS); if (s) d = JSON.parse(s); } catch(e){}
    d = d || mem || {};
    LISTS.forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
    return d;
  }
  let data = load();
  let dirty = true;
  try { dirty = localStorage.getItem(LS_DIRTY) !== '0'; } catch(e){}
  function setDirty(v){ dirty=v; try { localStorage.setItem(LS_DIRTY, v?'1':'0'); } catch(e){} }
  function store(){ mem = data; try { localStorage.setItem(LS, JSON.stringify(data)); } catch(e){} }
  function save(){ store(); setDirty(true); scheduleSync(); }

  // ---------- meals -> groceries ----------
  // A grocery item remembers which meals asked for it (from) and whether someone typed it in (manual).
  // "ground beef, taco shells. Cheese" -> three items. Dictation inserts commas when you say "comma".
  function splitList(text){
    return String(text||'').split(/\n|,|;|\.(?=\s|$)/)
      .map(t=>t.trim().replace(/^(and|also)\s+/i,''))
      .filter(Boolean)
      .map(t=>t.charAt(0).toUpperCase()+t.slice(1));
  }
  // ---------- amounts: "1 3/4 cups milk" -> {qty:1.75, unit:'cup', name:'milk'} ----------
  const UNICODE_FRAC = {'½':.5,'⅓':1/3,'⅔':2/3,'¼':.25,'¾':.75,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};
  const WORD_NUM = {a:1, an:1, one:1, two:2, three:3, four:4, five:5, six:6, half:.5, dozen:12};
  // unit -> [canonical, group, size in the group's base unit]
  const UNITS = {};
  function defUnit(canon, group, size, words){ words.forEach(w=>UNITS[w]=[canon, group, size]); }
  defUnit('tsp','vol',1,['tsp','tsps','teaspoon','teaspoons']);
  defUnit('tbsp','vol',3,['tbsp','tbsps','tbs','tbl','tablespoon','tablespoons']);
  defUnit('cup','vol',48,['cup','cups','c']);
  defUnit('pint','vol',96,['pint','pints','pt']);
  defUnit('quart','vol',192,['quart','quarts','qt']);
  defUnit('gallon','vol',768,['gallon','gallons','gal']);
  defUnit('oz','wt',1,['oz','ounce','ounces']);
  defUnit('lb','wt',16,['lb','lbs','pound','pounds']);
  defUnit('g','mwt',1,['g','gram','grams']);
  defUnit('kg','mwt',1000,['kg','kilogram','kilograms']);
  defUnit('ml','mvol',1,['ml','milliliter','milliliters']);
  defUnit('l','mvol',1000,['l','liter','liters','litre','litres']);
  ['can','jar','package','bag','box','bunch','clove','stick','slice','piece','pinch','dash','head','sprig','bottle','container','loaf','packet','envelope','handful']
    .forEach(u=>defUnit(u, u, 1, [u, u+'s', u+'es']));
  defUnit('loaf','loaf',1,['loaves']);
  defUnit('pack','pack',1,['pack','packs','package','packages','pkg','pkgs']);   // pack and package add together

  function parseNumber(s){
    s = s.trim();
    let m;
    if ((m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2]/m[3];
    if ((m = s.match(/^(\d+)\/(\d+)$/))) return m[1]/m[2];
    if ((m = s.match(/^(\d*)\s*([½⅓⅔¼¾⅛⅜⅝⅞])$/))) return (m[1]?+m[1]:0) + UNICODE_FRAC[m[2]];
    if (/^\d*\.?\d+$/.test(s)) return parseFloat(s);
    return null;
  }
  function parseAmount(line){
    let s = String(line||'').trim();
    let qty = null, unit = null;
    const m = s.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d*\s*[½⅓⅔¼¾⅛⅜⅝⅞]|\d*\.?\d+)(?=\s|[a-zA-Z]|$)\s*/);
    if (m){ qty = parseNumber(m[1]); s = s.slice(m[0].length); }
    else {
      const w = s.match(/^(a|an|one|two|three|four|five|six|half)\s+/i);
      if (w){ qty = WORD_NUM[w[1].toLowerCase()]; s = s.slice(w[0].length); }
    }
    if (qty != null){
      // "half a cup", "1 dozen eggs"
      const h = s.match(/^(a|an)\s+/i); if (h && qty===.5) s = s.slice(h[0].length);
      const d = s.match(/^dozen\s+/i); if (d){ qty *= 12; s = s.slice(d[0].length); }
      const u = s.match(/^([A-Za-z]+)\.?(?=\s|$)\s*/);
      if (u){
        const raw = u[1];
        const hit = (raw==='T') ? UNITS.tbsp : (raw==='t') ? UNITS.tsp : UNITS[raw.toLowerCase()];
        if (hit && s.slice(u[0].length).trim()){ unit = hit; s = s.slice(u[0].length); }
      }
      s = s.replace(/^of\s+/i, '');
    }
    const name = s.trim().replace(/^[,.\-–]\s*/, '') || String(line||'').trim();
    return {qty, unit, name};
  }
  // "Onions", "onion", "1 lb Ground beef" all share the key "onion" / "ground beef"
  function nameKey(text){
    return parseAmount(text).name.toLowerCase().replace(/\s+/g,' ').replace(/^(fresh|large|small|medium)\s+/, '').trim()
      .split(' ').map(w => /ies$/.test(w) ? w.slice(0,-3)+'y' : /oes$/.test(w) ? w.slice(0,-2) : (/[^s]s$/.test(w) ? w.slice(0,-1) : w)).join(' ');
  }

  function fmtNum(x){
    const whole = Math.floor(x + 1e-9), rest = x - whole;
    if (rest < 0.01) return String(whole);
    if (rest > 0.99) return String(whole + 1);
    for (const d of [2, 3, 4, 8]){          // halves, thirds, quarters, eighths
      const n = Math.round(rest * d);
      if (Math.abs(rest*d - n) < 0.03 && n > 0 && n < d){
        let a = n, b = d; const g = (x,y)=> y ? g(y, x%y) : x; const k = g(a,b); a/=k; b/=k;
        return whole ? whole + ' ' + a + '/' + b : a + '/' + b;
      }
    }
    return String(Math.round(x*100)/100);    // not a kitchen fraction
  }
  function unitLabel(canon, amount){
    if (['tsp','tbsp','oz','g','kg','ml','l'].includes(canon)) return canon;
    if (canon==='lb') return amount > 1 ? 'lbs' : 'lb';
    if (amount <= 1) return canon;
    return /(sh|ch|x|s)$/.test(canon) ? canon+'es' : canon==='loaf' ? 'loaves' : canon+'s';
  }
  // Mixed US volumes: 1 cup + 2 tbsp stays readable instead of "1 1/8 cups"
  function fmtVolume(tsp){
    const parts = [];
    let cups = Math.floor((tsp + 1e-9) / 12) / 4;     // whole quarter-cups
    let rest = tsp - cups*48;
    if (cups){ parts.push(fmtNum(cups) + ' ' + unitLabel('cup', cups)); }
    const tb = Math.floor((rest + 1e-9) / 1.5) / 2;    // half tablespoons
    rest -= tb*3;
    if (tb){ parts.push(fmtNum(tb) + ' tbsp'); }
    if (rest > 0.01){ parts.push(fmtNum(rest) + ' tsp'); }
    return parts.join(' + ') || '0 tsp';
  }
  function fmtWeight(oz){
    const lb = Math.floor((oz + 1e-9) / 16), rest = oz - lb*16;
    if (!lb) return fmtNum(rest) + ' oz';
    if (rest < 0.01) return fmtNum(lb) + ' ' + unitLabel('lb', lb);
    return fmtNum(lb) + ' ' + unitLabel('lb', lb) + ' ' + fmtNum(rest) + ' oz';
  }

  // Add up several ingredient lines that share a name. Returns the display text.
  function combineAmounts(lines){
    const parsed = lines.map(parseAmount);
    const groups = new Map();   // group -> {total, units:Set, firstUnit}
    let counted = 0, plain = 0, countName = null;
    parsed.forEach(p=>{
      if (p.qty == null){ plain++; return; }
      if (!p.unit){ counted += p.qty; if (!countName || (/s$/i.test(p.name) && !/s$/i.test(countName))) countName = p.name; return; }
      const [canon, group, size] = p.unit;
      const g = groups.get(group) || {total:0, units:new Set(), first:canon};
      g.total += p.qty * size; g.units.add(canon); groups.set(group, g);
    });
    const name = (counted > 1 && countName) ? countName : parsed[0].name;
    const bits = [];
    groups.forEach((g, group)=>{
      if (g.units.size === 1){
        const [canon, , size] = UNITS[g.first] || [g.first, group, 1];
        const n = g.total / size;
        bits.push(fmtNum(n) + ' ' + unitLabel(canon, n));
      } else if (group==='vol') bits.push(fmtVolume(g.total));
      else if (group==='wt') bits.push(fmtWeight(g.total));
      else if (group==='mvol') bits.push(g.total >= 1000 ? fmtNum(g.total/1000)+' l' : fmtNum(g.total)+' ml');
      else if (group==='mwt') bits.push(g.total >= 1000 ? fmtNum(g.total/1000)+' kg' : fmtNum(g.total)+' g');
      else bits.push(fmtNum(g.total) + ' ' + unitLabel(g.first, g.total));
    });
    if (counted) bits.unshift(fmtNum(counted));
    if (!bits.length) return {text: name, times: lines.length};   // nothing measurable: fall back to ×N
    return {text: bits.join(' + ') + ' ' + name + (plain ? ' (+ more)' : ''), times: 1};
  }

  function ingredientsOf(r){ return (r.ingredients||[]).map(s=>String(s).trim()).filter(Boolean); }
  function reconcileMeal(r){
    const want = r.on && !r.del ? ingredientsOf(r) : [];
    const wantSet = new Set(want.map(nameKey));
    // Take this meal off items it no longer needs
    live(data.groceries).forEach(g=>{
      const from = g.from || [];
      if (!from.includes(r.id) || wantSet.has(nameKey(g.text))) return;
      g.from = from.filter(id=>id!==r.id); touch(g);
      if (!g.from.length && !g.manual && !g.done) remove(g);
    });
    // Put it on the items it needs
    want.forEach(text=>{
      const k = nameKey(text);
      let g = live(data.groceries).find(x=>!x.done && nameKey(x.text)===k);
      if (!g){ const n = parseAmount(text).name; g = {id:uid(), text:n.charAt(0).toUpperCase()+n.slice(1), done:false, from:[], c:now(), u:now()}; data.groceries.push(g); }
      if (!(g.from||[]).includes(r.id)){ g.from = (g.from||[]).concat(r.id); touch(g); }
    });
  }
  // Adding a meal or recipe whose name already exists opens that one instead of making a duplicate.
  // Recipe categories, in the order they show on the Recipes page.
  const CATS = [
    {id:'breakfast', label:'Breakfast',        ic:'🍳', one:'breakfast'},
    {id:'dinner',    label:'Dinners',          ic:'🍲', one:'dinner'},
    {id:'soup',      label:'Soups',            ic:'🥣', one:'soup'},
    {id:'dressing',  label:'Dressings & Dips', ic:'🥗', one:'dressing or dip'},
    {id:'dessert',   label:'Desserts',         ic:'🍰', one:'dessert'}
  ];
  const catOf = r => CATS.some(c=>c.id===r.cat) ? r.cat : 'other';
  let recipeFilter = 'all';
  try { const v = localStorage.getItem(LS + '-rfilter'); if (v==='all' || v==='other' || CATS.some(c=>c.id===v)) recipeFilter = v; } catch(e){}
  function setFilter(v){ recipeFilter = v; try { localStorage.setItem(LS + '-rfilter', v); } catch(e){} }

  function findOrMakeRecipe(name, turnOn, cat){
    let r = live(data.recipes).find(x=>norm(x.name)===norm(name));
    if (!r){ r = {id:uid(), name, ingredients:[], steps:'', on:false, c:now(), u:now()}; if (cat && cat!=='all' && cat!=='other') r.cat = cat; data.recipes.push(r); }
    if (turnOn && !r.on){ r.on = true; touch(r); reconcileMeal(r); }
    save(); return r;
  }
  const recipeName = id => { const r = data.recipes.find(x=>x.id===id); return r && !r.del ? r.name : null; };

  // ---------- sync (merges into the data on screen, last change wins per item) ----------
  function replaceObj(t, s){
    Object.keys(t).forEach(k=>{ if(!(k in s)) delete t[k]; });
    Object.keys(s).forEach(k=>{ t[k]=s[k]; });
  }
  function mergeInto(d, remote){
    LISTS.forEach(k=>{
      if(!Array.isArray(d[k])) d[k]=[];
      const byId = new Map(d[k].map(x=>[x.id,x]));
      ((remote||{})[k]||[]).forEach(y=>{
        const x = byId.get(y.id);
        if (!x){ d[k].push(y); byId.set(y.id,y); }
        else if ((y.u||0) > (x.u||0)) replaceObj(x, y);
      });
    });
  }
  function fingerprint(d){ return JSON.stringify(LISTS.map(k=>(d[k]||[]).map(x=>x.id+':'+(x.u||0)).sort())); }

  let syncing=false, again=false, timer=null, status=SYNC_URL?'':'none', last=0;
  function scheduleSync(){ if(!SYNC_URL) return; clearTimeout(timer); timer=setTimeout(sync, 700); }
  function statusText(){
    // While syncing, keep showing the last time so the header never changes size
    return (status==='ok' || (status==='busy' && last)) ? 'Synced ' + new Date(last).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})
      : status==='off' ? 'Offline · saved' : status==='busy' ? 'Syncing…' : status==='none' ? 'This phone only · Connect' : '';
  }
  function showStatus(){ const el=document.getElementById('sync'); if(el){ el.className='sync '+status; el.textContent=statusText(); } }
  function setStatus(s){ status=s; showStatus(); }
  // Joe's Home Hub "Household" list: Groceries come here to Weekly Shopping, Needs and Desires to
  // Desires & Needs, shown in yellow. Checking one off or deleting it here goes back to his list; when he checks one off, it comes off here.
  // This app only reads Home Hub; Home Hub reads the check-offs from here.
  function pullHome(){
    return fetch(SYNC_URL + '?action=get&t=' + now(), {cache:'no-store'}).then(r=>r.ok ? r.json() : null).then(hh=>{
      if (!hh) return;
      // Her Honey-Do requests: when Joe finishes one, tell her and take it off; if he deletes it, it goes too
      const jobs = new Map((hh.honeydo||[]).map(j=>[j.id, j]));
      data.honeydo.forEach(m=>{
        if (m.del) return;
        const j = jobs.get('kb-' + m.id); if (!j || (j.u||0) <= (m.u||0)) return;
        if (j.del){ m.del = true; m.u = j.u; return; }
        if (!!j.done !== !!m.done){ m.done = !!j.done; if (m.done) m.news = true; else delete m.news; m.u = j.u; }
      });
      if (!Array.isArray(hh.shopping)) return;
      hh.shopping.forEach(y=>{
        if (!y || !y.id) return;
        const cat = ['groc','need','desire'].includes(y.cat) ? y.cat : 'need';
        const want = cat==='groc' ? 'groceries' : 'shopping', id = 'hh-' + y.id;
        ['groceries','shopping'].forEach(k=>{
          const x = data[k].find(i=>i.id===id);
          const gone = !!y.del || k!==want || !!y.done;   // checked off in Home Hub: off her list (her own check-offs come back with the same time, so they stay)
          if (!x){
            if (!gone) data[k].push({id, text:y.text, done:!!y.done, by:'joe', kind:cat, manual:true, manualText:y.text, from:[], c:y.c||now(), u:y.u||now()});
            return;
          }
          if ((y.u||0) > (x.u||0)){
            Object.assign(x, {text:y.text, manualText:y.text, manual:true, done:!!y.done, by:'joe', kind:cat, u:y.u||now()});
            if (gone) x.del = true; else delete x.del;
          }
        });
      });
    }).catch(()=>{});
  }
  // Each kid's app keeps its replies in its own space (kidk1, kidk2). Bring them onto Melissa's task list.
  function pullKids(){
    return Promise.all(KIDS.map(k=>fetch(SYNC_URL + '?action=get&space=kid' + k.id + '&t=' + now(), {cache:'no-store'})
      .then(r=>r.ok ? r.json() : null).then(d=>{
        const r = (d && d.r) || {};
        data.chores.forEach(c=>{
          if (c.del || c.to!==k.id) return;
          const x = r[c.id]; if (!x || (x.u||0) <= (c.ru||0)) return;
          c.status = x.s; c.reply = x.t || ''; c.ru = x.u; c.kph = x.ph || 0; c.u = now();
          if (x.s && x.s!=='seen') c.news = true;
        });
      }).catch(()=>{})));
  }
  async function sync(){
    if (!SYNC_URL) return;
    if (syncing){ again=true; return; }
    syncing=true; setStatus('busy');
    try {
      const r = await fetch(SYNC_URL + '?action=get&space=' + SPACE + '&t=' + now(), {cache:'no-store'});
      if (!r.ok) throw new Error('get '+r.status);
      const remote = await r.json();
      const before = fingerprint(data);
      mergeInto(data, remote);
      await pullHome();
      await pullKids();
      if (rollRepeats()) setDirty(true);
      store();
      if (dirty || fingerprint(data) !== fingerprint(remote||{})){
        setDirty(false);
        try {
          const p = await fetch(SYNC_URL + '?space=' + SPACE, {method:'POST', body: JSON.stringify(data)});
          if (!p.ok) throw new Error('post '+p.status);
        } catch(e){ setDirty(true); throw e; }
      }
      last = now(); setStatus('ok');
      if (fingerprint(data) !== before) refresh();
    } catch(e){ setStatus('off'); }
    syncing=false;
    if (again){ again=false; sync(); }
  }
  // New data from the other phone: wait until hands are off the screen, then redraw in place (same scroll spot)
  let lastTouch = 0, refreshWait = null;
  ['pointerdown','touchstart','scroll','keydown'].forEach(ev=>window.addEventListener(ev, ()=>{ lastTouch = now(); }, {passive:true, capture:true}));
  function refresh(){
    clearTimeout(refreshWait);
    const a = document.activeElement;
    if (a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA')) { refreshWait = setTimeout(refresh, 1500); return; }   // don't interrupt typing
    if (now() - lastTouch < 2500 || armed || picked) { refreshWait = setTimeout(refresh, 1000); return; }   // someone is using it
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }

  // ---------- view state ----------
  let tab = 'groceries';
  try { const t = localStorage.getItem(LS_TAB); if (TABS.some(x=>x.id===t)) tab = t; } catch(e){}
  let editing = null;   // recipe id being edited
  let armed = null;     // id waiting for a second tap to delete
  let typingTimer = null;    // short pause after typing, then the recipe saves itself
  let pendingCommit = null;   // saves the recipe being edited, whichever way you leave it
  function go(t){ if (pendingCommit) pendingCommit(); pendingCommit=null; picked=null; bgMenu=false; tab=t; editing=null; armed=null; try { localStorage.setItem(LS_TAB, t); } catch(e){} render(); window.scrollTo(0,0); }

  let toastTimer=null;
  function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display='none', 3500); }

  function header(title){ return `<header><h1>${esc(title)}</h1><button type="button" id="sync" class="sync"></button></header>`; }

  // ---------- Connect: link a phone-only copy to the shared lists, keeping what's already on it ----------
  let connectOpen = false;
  function connectPanel(){
    return `<div class="connect" id="connect">
      <b>Connect to the shared lists</b>
      <p class="sub" style="margin:4px 0 10px">Paste the Kitchen Board link from your texts. Everything already on this phone is kept and added to the shared lists.</p>
      <div class="addrow" style="margin:0"><input id="connlink" type="url" placeholder="Paste the link here" autocomplete="off" aria-label="Kitchen Board link"><button class="btn" id="connbtn" type="button">Connect</button></div>
      <button type="button" class="backlink" id="conncancel" style="margin-top:8px">Not now</button>
    </div>`;
  }
  function wireConnect(){
    const inp=document.getElementById('connlink');
    document.getElementById('conncancel').onclick=()=>{ connectOpen=false; render(); };
    document.getElementById('connbtn').onclick=()=>{
      const raw=inp.value.trim();
      const m=raw.match(/https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/);
      if (!m){ toast("That doesn't look like the Kitchen Board link. Copy the whole link from the text and try again."); inp.focus(); return; }
      try { localStorage.setItem(LS_SYNC, m[0]); } catch(e){}
      setDirty(true); store();
      location.replace(location.pathname + '?sync=' + m[0]);   // reopen connected; this phone's items get sent up
    };
    inp.focus();
  }
  document.addEventListener('click', e=>{
    if (e.target.closest('#sync') && status==='none'){ connectOpen=true; render(); }
  });
  function addRow(ph, id='newi'){ return `<form class="addrow" data-add><input id="${id}" type="text" placeholder="${esc(ph)}" aria-label="${esc(ph)}" autocomplete="off" enterkeyhint="done"><button class="btn" type="submit">Add</button></form>`; }
  function wireAdd(fn){
    const f = app.querySelector('[data-add]'); if(!f) return;
    f.addEventListener('submit', e=>{ e.preventDefault(); const i=f.querySelector('input'); const t=i.value.trim(); if(!t){ i.focus(); return; } i.value=''; fn(t); const n=app.querySelector('[data-add] input'); if(n) n.focus(); });
  }

  // ---------- checklist screens (To-Do, Groceries, Shopping) ----------
  // Position on the list: o if it's been moved, otherwise when it was added.
  const pos = x => x.o != null ? x.o : (x.c||0);
  let picked = null;   // item showing its move buttons
  function moveItem(key, id, how){
    const open = live(data[key]).filter(x=>!x.done).sort((a,b)=>pos(a)-pos(b));
    const i = open.findIndex(x=>x.id===id); if (i<0) return;
    let j = how==='up' ? i-1 : how==='down' ? i+1 : how==='top' ? 0 : open.length-1;
    if (j<0 || j>=open.length || j===i) return;
    const [it] = open.splice(i,1); open.splice(j,0,it);
    // Number the list 1, 2, 3... so items added at the same moment can't tie
    open.forEach((x,n)=>{ if (x.o !== n){ x.o = n; touch(x); } });
    save();
  }

  // Items Joe adds from Home Hub show in yellow.
  function renderChecklist(key, title, ph, emptyMsg){
    const movable = key==='groceries';
    const items = live(data[key]).sort((a,b)=> (a.done-b.done) || (pos(a)-pos(b)));
    const openCount = items.filter(i=>!i.done).length;
    const doneCount = items.filter(i=>i.done).length;
    const rows = items.map(it=>{
      let tags = '', label = it.text;
      if (key==='groceries'){
        const meals = (it.from||[]).map(id=>live(data.recipes).find(r=>r.id===id)).filter(Boolean);
        const k = nameKey(it.text), lines = [];
        meals.forEach(r=> ingredientsOf(r).forEach(t=>{ if (nameKey(t)===k) lines.push(t); }));
        if (it.manual) lines.push(it.manualText || it.text);
        if (!lines.length) lines.push(it.text);
        const sum = combineAmounts(lines);   // "1 cup" + "3/4 cup" -> "1 3/4 cups"
        label = sum.text.charAt(0).toUpperCase() + sum.text.slice(1);
        tags = (sum.times>1 ? `<span class="times" aria-label="needed ${sum.times} times">×${sum.times}</span>` : '') +
          meals.map(r=>`<span class="tag">${esc(r.name)}</span>`).join('');
      }
      if (key==='shopping' && it.by==='joe' && it.kind) tags += `<span class="tag joetag">${it.kind==='desire'?'Desire':'Need'}</span>`;
      const joe = it.by==='joe' ? ' joe' : '';
      if (movable){
        const idx = items.indexOf(it), isPicked = picked===it.id && !it.done;
        return `<div class="row ${it.done?'done':''} ${isPicked?'picked':''}${joe}">
          <button class="checkbtn" data-toggle="${it.id}" aria-pressed="${!!it.done}" aria-label="${it.done?'Uncheck':'Check off'} ${esc(it.text)}"><span class="check" aria-hidden="true">✓</span></button>
          <button class="item pickable" data-pick="${it.id}" ${it.done?'disabled':''} aria-expanded="${isPicked}" aria-label="${esc(label)}, tap to move"><span class="text">${esc(label)}${tags}</span></button>
          <button class="x ${armed===it.id?'armed':''}" data-del="${it.id}" aria-label="Delete ${esc(label)}">${armed===it.id?'Delete?':'✕'}</button>
        </div>` + (isPicked ? `<div class="mover" role="group" aria-label="Move ${esc(it.text)}">
            <button class="mv" data-move="top" ${idx===0?'disabled':''}>⤒ Top</button>
            <button class="mv" data-move="up" ${idx===0?'disabled':''}>▲ Up</button>
            <button class="mv" data-move="down" ${idx>=openCount-1?'disabled':''}>▼ Down</button>
            <button class="mv" data-move="bottom" ${idx>=openCount-1?'disabled':''}>⤓ Bottom</button>
          </div>` : '');
      }
      return `<div class="row ${it.done?'done':''}${joe}">
        <button class="item" data-toggle="${it.id}" aria-pressed="${!!it.done}"><span class="check" aria-hidden="true">✓</span><span class="text">${esc(it.text)}${tags}</span></button>
        <button class="x ${armed===it.id?'armed':''}" data-del="${it.id}" aria-label="Delete ${esc(it.text)}">${armed===it.id?'Delete?':'✕'}</button>
      </div>`;
    }).join('');
    app.innerHTML = header(title) + addRow(ph) +
      (movable && openCount>1 && !picked ? `<p class="sub" style="margin:-4px 4px 8px">Tap an item to move it up or down. Tap the circle to check it off.</p>` : '') +
      (rows ? `<div class="list">${rows}</div>` : `<div class="empty">${emptyMsg}</div>`) +
      (doneCount ? `<div class="foot"><button class="btn ghost" id="clear">${armed==='clear'?'Tap again to clear':'Clear '+doneCount+' checked'}</button></div>` : '');
    wireAdd(raw=>{
      const many = key==='todo' ? [raw] : splitList(raw);   // to-dos can contain commas; lists split on them
      let dupes = 0;
      many.forEach((t,n)=>{
        if (key==='groceries'){
          const ex = live(data.groceries).find(x=>!x.done && nameKey(x.text)===nameKey(t));
          if (ex){ ex.manual=true; ex.manualText=t; touch(ex); dupes++; return; }
          data.groceries.push({id:uid(), text:t, done:false, manual:true, manualText:t, from:[], c:now()+n, u:now()});
        } else data[key].push({id:uid(), text:t, done:false, c:now()+n, u:now()});
      });
      save(); render();
      if (dupes && many.length===1) toast('Already on the list');
      else if (many.length>1) toast(`Added ${many.length - dupes} item${many.length-dupes===1?'':'s'}`);
    });
    app.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{
      const it=data[key].find(x=>x.id===b.dataset.toggle); it.done=!it.done; touch(it); armed=null; if(picked===it.id) picked=null; save(); render();
    });
    app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
      picked = picked===b.dataset.pick ? null : b.dataset.pick; armed=null; render();
      const again = app.querySelector(`[data-pick="${b.dataset.pick}"]`); if (again) again.focus();
    });
    app.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{
      const id=picked; moveItem(key, id, b.dataset.move); render();
      const row = app.querySelector(`[data-pick="${id}"]`); if (row) row.scrollIntoView({block:'nearest'});
      const same = app.querySelector(`[data-move="${b.dataset.move}"]:not([disabled])`); if (same) same.focus();
    });
    app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.del;
      if (armed===id){ remove(data[key].find(x=>x.id===id)); armed=null; save(); }
      else armed=id;
      render();
    });
    const c=document.getElementById('clear');
    if (c) c.onclick=()=>{
      if (armed==='clear'){ items.filter(i=>i.done).forEach(remove); armed=null; save(); }
      else armed='clear';
      render();
    };
  }

  // ---------- Meals: every recipe is a meal you can put on the menu ----------
  function renderMeals(){
    const rs = live(data.recipes).sort((a,b)=> (!!b.on - !!a.on) || a.name.localeCompare(b.name));
    const onCount = rs.filter(r=>r.on).length;
    const row = r => {
      const n = ingredientsOf(r).length;
      return `<div class="meal">
        <button class="info" data-open="${r.id}"><span class="name">${esc(r.name)}</span><span class="sub">${n ? n+' ingredient'+(n>1?'s':'') : 'No ingredients yet, tap to add'}</span></button>
        <button class="switch" role="switch" aria-checked="${!!r.on}" aria-label="${esc(r.name)} on the menu" data-meal="${r.id}"></button>
      </div>`;
    };
    const on = rs.filter(r=>r.on), off = rs.filter(r=>!r.on);
    app.innerHTML = header('Meals') + addRow('New meal, like Taco Tuesday') +
      (rs.length ? `<p class="sub" style="margin:0 4px 8px">Turn a meal on and its ingredients go on Weekly Shopping. Turn it off and they come back off.</p>` : '') +
      (on.length ? `<div class="section">On the menu · ${onCount}</div><div class="list">${on.map(row).join('')}</div>` : '') +
      (off.length ? `<div class="section">${on.length?'Not this time':'All meals'}</div><div class="list">${off.map(row).join('')}</div>` : '') +
      (!rs.length ? `<div class="empty">No meals yet.<br>Add one above, then list its ingredients.</div>` : '');
    wireAdd(t=>{ const r=findOrMakeRecipe(t, true); tab='recipes'; editing=r.id; render(); window.scrollTo(0,0);
      toast(ingredientsOf(r).length ? `${r.name} is on the menu` : `${r.name} is on the menu. Add its ingredients below.`); });
    app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ tab='recipes'; editing=b.dataset.open; render(); window.scrollTo(0,0); });
    app.querySelectorAll('[data-meal]').forEach(b=>b.onclick=()=>{
      const r=data.recipes.find(x=>x.id===b.dataset.meal);
      r.on=!r.on; touch(r); reconcileMeal(r); save(); render();
      const n=ingredientsOf(r).length;
      if (r.on) toast(n ? `Added ${n} ingredient${n>1?'s':''} to Weekly Shopping` : `${r.name} has no ingredients yet`);
      else toast(`Took ${r.name} off Weekly Shopping`);
    });
  }

  // ---------- Recipes ----------
  function renderRecipes(){
    if (editing) return renderRecipe(editing);
    const all = live(data.recipes).sort((a,b)=>a.name.localeCompare(b.name));
    const row = r=>`<button class="item" data-open="${r.id}"><span class="text"><b>${esc(r.name)}</b>${r.on?'<span class="tag">on the menu</span>':''}<br><span class="sub">${esc(ingredientsOf(r).slice(0,4).join(', ') || 'No ingredients yet')}${ingredientsOf(r).length>4?'…':''}</span></span><span class="sub" aria-hidden="true">›</span></button>`;
    const count = id => all.filter(r=>catOf(r)===id).length;
    const groups = CATS.concat([{id:'other', label:'No category', ic:'📄'}]);
    const chips = [{id:'all', label:'All', n:all.length}].concat(CATS.map(c=>({id:c.id, label:c.ic+' '+c.label, n:count(c.id)})))
      .concat(count('other') ? [{id:'other', label:'No category', n:count('other')}] : []);
    if (recipeFilter==='other' && !count('other')) setFilter('all');
    const cur = groups.find(g=>g.id===recipeFilter);
    let body;
    if (recipeFilter==='all'){
      body = groups.map(g=>{ const list = all.filter(r=>catOf(r)===g.id); return list.length ? `<div class="section">${g.ic} ${esc(g.label)} · ${list.length}</div><div class="list">${list.map(row).join('')}</div>` : ''; }).join('');
      if (!body) body = `<div class="empty">No recipes yet.<br>Add one above to save its ingredients and steps.</div>`;
    } else {
      const list = all.filter(r=>catOf(r)===recipeFilter);
      body = list.length ? `<div class="list">${list.map(row).join('')}</div>` : `<div class="empty">No ${esc(cur.label.toLowerCase())} yet.<br>Add one above and it goes here.</div>`;
    }
    app.innerHTML = header('Recipes') +
      `<div class="chips" role="tablist" aria-label="Recipe categories">${chips.map(c=>`<button class="chip" role="tab" data-filter="${c.id}" aria-selected="${c.id===recipeFilter}">${esc(c.label)}${c.n?` <span class="chipn">${c.n}</span>`:''}</button>`).join('')}</div>` +
      addRow(recipeFilter==='all' || recipeFilter==='other' ? 'New recipe name' : 'New ' + cur.one + ' recipe') + body;
    app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{ setFilter(b.dataset.filter); render(); const n=app.querySelector(`[data-filter="${b.dataset.filter}"]`); if(n){ n.focus(); n.scrollIntoView({block:'nearest', inline:'nearest'}); } });
    wireAdd(t=>{ const r=findOrMakeRecipe(t, false, recipeFilter); editing=r.id; render(); window.scrollTo(0,0); });
    app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ editing=b.dataset.open; render(); window.scrollTo(0,0); });
  }

  function renderRecipe(id){
    const r = live(data.recipes).find(x=>x.id===id);
    if (!r){ editing=null; return renderRecipes(); }
    const ings = ingredientsOf(r);
    const ingRows = ings.map((t,i)=>`<div class="row"><span class="item" style="cursor:default"><span class="text">${esc(t)}</span></span>
        <button class="x ${armed==='ing'+i?'armed':''}" data-ingdel="${i}" aria-label="Remove ${esc(t)}">${armed==='ing'+i?'Remove?':'✕'}</button></div>`).join('');
    app.innerHTML = `<button class="backlink" id="back">‹ All recipes</button>` + header(r.name) + `
      <div class="list" style="margin-bottom:6px"><div class="meal"><div class="info" style="cursor:default"><span class="name">On the menu</span><span class="sub">${r.on ? 'On: these ingredients are on Weekly Shopping' : 'Off: turn on to add these ingredients to Weekly Shopping'}</span></div>
        <button class="switch" role="switch" aria-checked="${!!r.on}" aria-label="On the menu" id="onmenu"></button></div></div>
      <label for="rname">Name</label>
      <input class="field" id="rname" type="text" value="${esc(r.name)}" autocomplete="off">
      <label id="catlbl">Category</label>
      <div class="chips wrap" role="radiogroup" aria-labelledby="catlbl">${CATS.map(c=>`<button class="chip" role="radio" data-cat="${c.id}" aria-checked="${catOf(r)===c.id}">${c.ic} ${esc(c.label)}</button>`).join('')}</div>
      <label for="ingnew">Ingredients${ings.length?` · ${ings.length}`:''}</label>
      <form class="addrow" id="ingform" style="margin-bottom:10px"><input id="ingnew" type="text" placeholder="Add an ingredient" autocomplete="off" enterkeyhint="done"><button class="btn" type="submit">Add</button></form>
      ${ingRows ? `<div class="list">${ingRows}</div>` : ''}
      <p class="hint">Say or type one at a time, or a whole list with commas: "ground beef, taco shells, cheese". Each one becomes its own Weekly Shopping item.</p>
      <label for="rsteps">Steps</label>
      <textarea id="rsteps" placeholder="How to make it">${esc(r.steps||'')}</textarea>
      <div class="actions">
        <button class="btn" id="done">Done</button>
        <button class="btn danger" id="delr">${armed===r.id?'Tap again to delete':'Delete recipe'}</button>
      </div>`;
    // Hold on to THIS screen's fields, so a late save can never write into a different recipe.
    const fName=document.getElementById('rname'), fSteps=document.getElementById('rsteps'), fNew=document.getElementById('ingnew');
    const setIngredients = list => {
      r.ingredients = list; touch(r);
      if (r.on) reconcileMeal(r);
      save();
    };
    const commit = () => {
      if (!fName.isConnected || r.del) return false;   // this editor is gone
      let changed = false;
      const name = fName.value.trim() || r.name, steps = fSteps.value;
      if (name!==r.name || steps!==(r.steps||'')){ r.name=name; r.steps=steps; touch(r); changed=true; }
      // An ingredient typed in the box but not added yet still counts
      const pending = splitList(fNew.value);
      if (pending.length){ fNew.value=''; r.ingredients = ingredientsOf(r).concat(pending); touch(r); changed=true; }
      if (!changed) return false;
      if (r.on) reconcileMeal(r);
      save(); return true;
    };
    clearTimeout(typingTimer);
    [fSteps, fName].forEach(el=>el.addEventListener('input', ()=>{ clearTimeout(typingTimer); typingTimer=setTimeout(commit, 1200); }));
    [fName, fSteps].forEach(el=>el.addEventListener('change', ()=>{ if(commit()) { const h=app.querySelector('h1'); if(h) h.textContent=r.name; } }));
    document.getElementById('ingform').addEventListener('submit', e=>{
      e.preventDefault();
      const have = new Set(ingredientsOf(r).map(norm));
      const add = splitList(fNew.value).filter(t=>{ const k=norm(t); if(have.has(k)) return false; have.add(k); return true; });
      if (!add.length){ if (fNew.value.trim()){ fNew.value=''; toast('Already in this recipe'); } fNew.focus(); return; }
      fNew.value='';
      commit();   // keep any name/steps edits
      setIngredients(ingredientsOf(r).concat(add));
      armed=null; render();
      const again=document.getElementById('ingnew'); if(again) again.focus();
      if (add.length>1) toast(`Added ${add.length} ingredients`);
    });
    app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{
      commit();
      r.cat = r.cat===b.dataset.cat ? undefined : b.dataset.cat;   // tap again to clear
      if (!r.cat) delete r.cat;
      touch(r); save(); render();
      const n=app.querySelector(`[data-cat="${b.dataset.cat}"]`); if(n) n.focus();
    });
    app.querySelectorAll('[data-ingdel]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.ingdel, key='ing'+i;
      if (armed===key){ commit(); const list=ingredientsOf(r); list.splice(i,1); setIngredients(list); armed=null; }
      else { commit(); armed=key; }
      render();
    });
    pendingCommit = commit;
    const leave = () => { commit(); pendingCommit=null; editing=null; armed=null; render(); window.scrollTo(0,0); };
    document.getElementById('back').onclick = leave;
    document.getElementById('done').onclick = () => { const changed=commit(); if(changed && r.on) toast('Saved. Weekly Shopping updated.'); else if(changed) toast('Saved'); leave(); };
    document.getElementById('onmenu').onclick = () => {
      commit(); r.on=!r.on; touch(r); reconcileMeal(r); save(); render();
      const n=ingredientsOf(r).length;
      toast(r.on ? (n?`Added ${n} ingredient${n>1?'s':''} to Weekly Shopping`:'Add ingredients so they reach the list') : 'Taken off Weekly Shopping');
    };
    document.getElementById('delr').onclick = () => {
      if (armed===r.id){ r.on=false; reconcileMeal(r); remove(r); armed=null; editing=null; save(); render(); toast('Recipe deleted'); }
      else { armed=r.id; commit(); render(); }
    };
  }

  // ---------- frame ----------
  function renderNav(){
    const openG = live(data.groceries).filter(g=>!g.done).length;
    const openT = live(data.todo).filter(g=>!g.done).length;
    const openS = live(data.shopping).filter(g=>!g.done).length;
    const onM = live(data.recipes).filter(r=>r.on).length;
    const counts = {todo:openT, groceries:openG, shopping:openS, meals:onM, honeydo:live(data.honeydo).filter(m=>!m.done).length,

    nav.innerHTML = TABS.map(t=>`<button class="tab" data-tab="${t.id}" ${t.id===tab?'aria-current="page"':''}><span class="ic" aria-hidden="true">${t.ic}</span><span class="lbl">${t.label}</span>${counts[t.id]?`<span class="badge">${counts[t.id]}</span>`:''}</button>`).join('');
    nav.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
  }
  // ---------- background pictures, one per tab, saved on this phone ----------
  const BG_KEY = LS + '-bg-';
  let bgMenu = false;
  function getBg(k){ try { return localStorage.getItem(BG_KEY+k) || ''; } catch(e){ return ''; } }
  function applyBg(){
    const url = getBg(tab);
    document.body.classList.toggle('has-bg', !!url);
    document.getElementById('bg').style.backgroundImage = url ? `url("${url}")` : '';
  }
  function addBgButton(){
    const h = app.querySelector('header'); if (!h) return;
    const has = !!getBg(tab);
    h.insertAdjacentHTML('beforeend', `<button type="button" class="bgbtn" id="bgbtn" aria-label="Background picture for this page">🖼</button>`);
    document.getElementById('bgbtn').onclick = () => { if (has){ bgMenu = !bgMenu; render(); } else document.getElementById('bgfile').click(); };
    if (bgMenu && has){
      h.insertAdjacentHTML('afterend', `<div class="bgmenu"><button class="btn ghost" id="bgchange">Change picture</button><button class="btn danger" id="bgremove">Remove picture</button></div>`);
      document.getElementById('bgchange').onclick = () => { bgMenu=false; render(); document.getElementById('bgfile').click(); };
      document.getElementById('bgremove').onclick = () => { try { localStorage.removeItem(BG_KEY+tab); } catch(e){} bgMenu=false; render(); toast('Picture removed'); };
    }
  }
  // Shrink the photo so it fits in the phone's storage, then save it for this tab.
  document.getElementById('bgfile').addEventListener('change', e=>{
    const file = e.target.files && e.target.files[0]; e.target.value = '';
    if (!file) return;
    const key = BG_KEY + tab;
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1280, sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        try { localStorage.setItem(key, c.toDataURL('image/jpeg', 0.72)); }
        catch(err){
          try { localStorage.setItem(key, c.toDataURL('image/jpeg', 0.5)); }
          catch(err2){ toast('That picture is too big to save. Try another, or remove a picture from another tab.'); return; }
        }
        bgMenu = false; render();
      };
      img.onerror = () => toast("Couldn't open that picture. Try a different one.");
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });

  function render(){
    pendingCommit = null;   // the recipe screen sets it again if it's the one showing
    if (tab==='todo') renderChecklist('todo','To-Do','Add a to-do','Nothing to do. Suspicious, but enjoy it.');
    else if (tab==='groceries') renderChecklist('groceries','Weekly Shopping','Add an item','The list is empty.<br>Add items here, or turn on a meal in Meals.');
    else if (tab==='shopping') renderChecklist('shopping','Desires & Needs','Add a desire or need','Nothing here yet.<br>Add things you want or need to buy.');
    else if (tab==='meals') renderMeals();
    else if (tab==='honeydo') renderHoneyDo();
    else if (tab==='kids') renderKids();
    else renderRecipes();
    if (connectOpen && status==='none'){ const h=app.querySelector('header'); if (h){ h.insertAdjacentHTML('afterend', connectPanel()); wireConnect(); } }
    applyBg(); addBgButton();
    showNews();
    renderNav(); showStatus();
  }
  const CH_ST = {seen:'👀 Seen', onit:'👍 On it', done:'✔ Done', help:'✋ Needs help', missed:'✖ Missed'};
  function showNews(){
    const kn = live(data.chores).filter(c=>c.news);
    if (kn.length && tab!=='kids'){
      const h0 = app.querySelector('header');
      if (h0) h0.insertAdjacentHTML('afterend', `<button type="button" class="news" id="kidsnews" style="width:100%;text-align:left;font:inherit;cursor:pointer"><div><b>👟 ${kn.length} new repl${kn.length>1?'ies':'y'} from the kids</b>
        ${kn.slice(0,3).map(c=>`<div class="sub" style="color:inherit">${esc(kidName(c.to))}: ${CH_ST[c.status]||''} · ${esc(c.text)}</div>`).join('')}</div><span class="btn">See</span></button>`);
      const kb = document.getElementById('kidsnews'); if (kb) kb.onclick = () => go('kids');
    }
    const news = live(data.honeydo).filter(m=>m.done && m.news);
    if (!news.length) return;
    const h = app.querySelector('header'); if (!h) return;
    h.insertAdjacentHTML('afterend', `<div class="news" role="status"><div><b>✔ Joe finished ${news.length>1?news.length+' Honey-Do jobs':'a Honey-Do job'}</b>
      ${news.map(m=>`<div class="sub" style="color:inherit">${esc(m.text)}</div>`).join('')}</div><button class="btn" id="newsok" type="button">OK</button></div>`);
    document.getElementById('newsok').onclick = () => { news.forEach(m=>{ delete m.news; }); store(); render(); };
  }

  // ---------- Kids: Melissa sends tasks to the kids' phones and sees their replies ----------
  let kidFor = 'k1';
  try { const v = localStorage.getItem(LS + '-kidfor'); if (v==='both' || KIDS.some(k=>k.id===v)) kidFor = v; } catch(e){}
  const LEADS = [[15,'15 min before'],[30,'30 min before'],[60,'1 hour before'],[120,'2 hours before'],[240,'4 hours before'],[1440,'1 day before']];
  function fmtDue(ms){
    if (!ms) return 'No due time';
    const d = new Date(ms), t0 = new Date(); t0.setHours(0,0,0,0);
    const days = Math.round((new Date(d).setHours(0,0,0,0) - t0) / 864e5);
    const day = days===0 ? 'Today' : days===1 ? 'Tomorrow' : days===-1 ? 'Yesterday' : d.toLocaleDateString([], {weekday:'short', month:'numeric', day:'numeric'});
    return day + ' ' + d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  }
  function localInput(ms){ const d=new Date(ms - new Date(ms).getTimezoneOffset()*60000); return d.toISOString().slice(0,16); }
  // Lock-screen reminders for the kids: the Google script schedules them through OneSignal
  function pushChore(op, c){
    if (!SYNC_URL || !c) return;
    fetch(SYNC_URL + '?action=push', {method:'POST', body: JSON.stringify({op, id:c.id, kid:c.to, text:c.text, due:c.due, lead:c.lead})}).catch(()=>{});
  }

  // ---------- task photos: small JPEGs kept on this phone and in a private Drive folder (through the Google script) ----------
  const phMem = {}, phAsked = {};
  function phGet(pid, v){
    if (!v) return '';
    if (phMem[pid] && phMem[pid].v === v) return phMem[pid].d;
    try { const c = JSON.parse(localStorage.getItem('ph-' + pid) || 'null'); if (c && c.v === v) { phMem[pid] = c; return c.d; } } catch(e){}
    return '';
  }
  function phKeep(pid, v, d){
    phMem[pid] = {v, d};
    try { localStorage.setItem('ph-' + pid, JSON.stringify({v, d})); }
    catch(e){ // phone storage full: drop the saved photos (they download again when needed)
      try { Object.keys(localStorage).filter(k => k.indexOf('ph-') === 0).forEach(k => localStorage.removeItem(k)); localStorage.setItem('ph-' + pid, JSON.stringify({v, d})); } catch(e2){} }
  }
  // Fill in any photo boxes on screen that haven't been downloaded yet
  function phLoad(){
    document.querySelectorAll('[data-ph]').forEach(el => {
      const [pid, vs] = el.dataset.ph.split('|'), v = +vs, d = phGet(pid, v);
      if (d) { el.style.backgroundImage = 'url(' + d + ')'; el.classList.remove('phwait'); return; }
      if (!SYNC_URL || now() - (phAsked[pid + v] || 0) < 15000) return;
      phAsked[pid + v] = now();
      fetch(SYNC_URL + '?action=photo&id=' + encodeURIComponent(pid) + '&t=' + now(), {cache:'no-store'}).then(r => r.json()).then(j => {
        if (!j || !j.ok || !j.data) return;
        phAsked[pid + v] = 9e15; phKeep(pid, v, 'data:image/jpeg;base64,' + j.data); phLoad();
      }).catch(() => {});
    });
  }
  function phHtml(pid, v, label, small){
    if (!v) return '';
    const d = phGet(pid, v);
    return `<button type="button" class="ph${small ? ' phsm' : ''}${d ? '' : ' phwait'}" data-ph="${pid}|${v}" style="${d ? 'background-image:url(' + d + ')' : ''}" aria-label="${label}, tap to enlarge"><span>${label}</span></button>`;
  }
  // Shrink a camera picture to about 100 KB, keeping its shape
  function phShrink(file){
    return new Promise((res, rej) => {
      const rd = new FileReader();
      rd.onload = () => { const img = new Image(); img.onload = () => {
        const sc = Math.min(1, 1000 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
        cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', 0.7)); }; img.onerror = rej; img.src = rd.result; };
      rd.onerror = rej; rd.readAsDataURL(file);
    });
  }
  function phSend(pid, d, v){
    v = v || now(); phKeep(pid, v, d);
    if (!SYNC_URL) return Promise.resolve(v);
    return fetch(SYNC_URL + '?action=photo', {method:'POST', body: JSON.stringify({id: pid, data: d.split(',')[1]})})
      .then(r => r.json()).then(j => { if (!j || !j.ok) throw new Error('photo'); return v; });
  }
  function phDel(pid){ if (SYNC_URL) fetch(SYNC_URL + '?action=photo', {method:'POST', body: JSON.stringify({id: pid, data: ''})}).catch(() => {}); }
  // Tap a photo to see it full screen; tap again to close
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('[data-ph]'); if (!b) return;
    const [pid, vs] = b.dataset.ph.split('|'), d = phGet(pid, +vs); if (!d) return;
    const o = document.createElement('div'); o.id = 'phview'; o.innerHTML = '<img alt=""><div>Tap to close</div>'; o.querySelector('img').src = d;
    o.onclick = () => o.remove(); document.body.appendChild(o);
  });

  // ---------- repeating tasks: a rule (days of the week + time) makes one task each time it comes due ----------
  // Both apps work out the same tasks with the same ids (rule id + date), so they always match.
  const ymd = d => d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  function repWindow(r){
    const t = now(), d0 = new Date(t); d0.setHours(0,0,0,0);
    const [hh, mm] = String(r.time || '20:00').split(':').map(Number);
    let prev = 0, next = 0;
    for (let i = -8; i <= 8; i++){
      const day = new Date(d0); day.setDate(d0.getDate() + i);
      if (!(r.days || []).includes(day.getDay())) continue;
      day.setHours(hh, mm, 0, 0); const due = day.getTime();
      if (due <= t) { if (due >= (r.c || 0)) prev = due; } else if (!next) next = due;
    }
    // the last one that came due (since the rule was made) and the next one coming
    return [prev, next].filter(Boolean).map(due => ({id: r.id + '-' + ymd(new Date(due)), rep: r.id, to: r.to, text: r.text, note: r.note || '', due, lead: r.lead || 60}));
  }
  const DAYN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function repText(r){
    const [hh, mm] = String(r.time || '20:00').split(':').map(Number), d = new Date(); d.setHours(hh, mm, 0, 0);
    const tm = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}), ds = r.days || [];
    return (ds.length === 7 ? 'Every day' : ds.length === 1 ? 'Every ' + DAYN[ds[0]] : ds.map(x => DAYN[x].slice(0,3)).join(', ')) + ' · ' + tm;
  }
  // Make this week's tasks from each repeating rule; older ones nobody finished are marked missed
  const ensured = {};
  function rollRepeats(){
    let ch = false; const t = now();
    live(data.repeats).forEach(r => {
      const win = repWindow(r), keep = new Set(win.map(x => x.id));
      win.forEach(x => { if (!data.chores.some(c => c.id === x.id)) { data.chores.push(Object.assign(x, {status:'new', c:t, u:t})); ch = true; } });
      live(data.chores).forEach(c => {
        if (c.rep !== r.id) return;
        if (!keep.has(c.id) && c.status !== 'done' && c.status !== 'missed' && c.due < t) { c.status = 'missed'; c.u = t; ch = true; pushChore('cancel', c); }
        if (keep.has(c.id) && c.due > t && c.status !== 'done' && !ensured[c.id]) { ensured[c.id] = 1; pushChore('ensure', c); }
      });
    });
    // tidy up: finished or missed repeats over a week old, and old deleted ones
    const before = data.chores.length;
    data.chores.forEach(c => { if (c.rep && !c.del && (c.status === 'done' || c.status === 'missed') && c.due < t - 7*864e5) { c.del = true; c.u = t; ch = true; } });
    data.chores = data.chores.filter(c => !(c.rep && c.del && (c.due||0) < t - 30*864e5));
    return ch || data.chores.length !== before;
  }
  // Melissa's chore board, ready to add with one tap
  const BOARD = [
    {to:'k1', text:'Trash & recycling', days:[0,1,2,3,4,5,6], time:'20:00', lead:60},
    {to:'k1', text:'Trash to the curb', days:[1], time:'20:00', lead:60},
    {to:'k1', text:'Cans back to the house', days:[2], time:'18:00', lead:60},
    {to:'k1', text:'Vacuum all carpet', days:[4], time:'20:00', lead:1440},
    {to:'k2', text:'Bathroom', days:[4], time:'20:00', lead:1440},
    {to:'k2', text:'Kitchen wipe down', days:[4], time:'20:00', lead:1440}];
  let boardOff = false; try { boardOff = !!localStorage.getItem(LS + '-board'); } catch(e){}
  let kNewPhoto = '';   // picture waiting to go with the next task
  const goneChore = c => { if (!c) return; remove(c); pushChore('cancel', c); if (c.ph) phDel('task-' + c.id + '-m'); if (c.kph) phDel('task-' + c.id + '-k'); };
  function renderKids(){
    const def = (()=>{ const d=new Date(now()+2*3600e3); d.setMinutes(d.getMinutes()<30?30:60,0,0); return d.getTime(); })();
    const card = c => {
      const st = c.status || 'new', late = c.due && c.due < now() && st!=='done';
      return `<div class="kcard ${st==='done'?'kdone':''} ${c.news?'knew':''}">
        <div class="ktop"><b class="ktext">${esc(c.text)}${c.rep ? '<span class="rep">🔁</span>' : ''}</b><button class="x ${armed===c.id?'armed':''}" data-kdel="${c.id}" aria-label="Delete ${esc(c.text)}">${armed===c.id?'Delete?':'✕'}</button></div>
        ${c.note?`<div class="hdnote">${esc(c.note)}</div>`:''}
        <div class="kmeta"><span class="kdue ${late?'klate':''}">⏰ ${fmtDue(c.due)}${late?' · late':''}</span><span class="kst kst-${st}">${CH_ST[st]||'📨 Sent'}</span></div>
        ${c.reply?`<div class="kreply">“${esc(c.reply)}”</div>`:''}
        ${phHtml('task-' + c.id + '-k', c.kph, '📷 ' + esc(kidName(c.to)) + '’s photo')}
        ${phHtml('task-' + c.id + '-m', c.ph, '📷 Your photo', true)}
      </div>`;
    };
    const lists = KIDS.map(k=>{
      const all = live(data.chores).filter(c=>c.to===k.id);
      const open = all.filter(c=>c.status!=='done' && c.status!=='missed').sort((a,b)=>(a.due||9e15)-(b.due||9e15));
      const done = all.filter(c=>c.status==='done' || c.status==='missed').sort((a,b)=>(b.ru||b.due||0)-(a.ru||a.due||0));
      const reps = live(data.repeats).filter(r=>r.to===k.id);
      return `<div class="section">${esc(k.name)} · ${open.length} open</div>` +
        (open.length ? open.map(card).join('') : `<div class="empty" style="padding:10px">Nothing waiting on ${esc(k.name)}.</div>`) +
        (done.length ? `<details class="kdone-list"><summary>✔ ${done.length} done</summary>${done.map(card).join('')}
          <button class="btn ghost" data-kclear="${k.id}" style="margin-top:6px">${armed==='kc'+k.id?'Tap again to clear':'Clear done'}</button></details>` : '') +
        (reps.length ? `<details class="kdone-list"><summary>🔁 ${reps.length} repeating</summary>${reps.map(r=>`<div class="kcard"><div class="ktop"><b class="ktext">${esc(r.text)}</b>
          <button class="x ${armed==='r'+r.id?'armed':''}" data-rdel="${r.id}" aria-label="Stop repeating ${esc(r.text)}">${armed==='r'+r.id?'Stop it?':'✕'}</button></div>
          <div class="kmeta"><span class="kdue">🔁 ${repText(r)}</span></div></div>`).join('')}</details>` : '');
    }).join('');
    const offer = !boardOff && !live(data.repeats).length ? `<div class="kcard" style="border-color:var(--accent)"><b>🔁 Add the chore board?</b>
        ${BOARD.map(b=>`<div class="kmeta" style="margin-top:4px"><span><b>${esc(kidName(b.to))}:</b> ${esc(b.text)}</span><span class="kdue">${repText(b)}</span></div>`).join('')}
        <div class="krow" style="margin-top:8px"><button class="btn ghost" type="button" id="boardno">No thanks</button><button class="btn" type="button" id="boardyes">Add these</button></div></div>` : '';
    app.innerHTML = header('Kids') + offer + `<form class="kform" data-kadd>
        <div class="chips" role="radiogroup" aria-label="Send to">${KIDS.concat([{id:'both', name:'Both'}]).map(k=>`<button type="button" class="chip" role="radio" aria-checked="${kidFor===k.id}" data-kfor="${k.id}">${esc(k.name)}</button>`).join('')}</div>
        <input id="newi" type="text" placeholder="Task, like Take out the trash" aria-label="Task" autocomplete="off" enterkeyhint="next">
        <textarea id="knote" rows="2" placeholder="Details (optional)" aria-label="Details"></textarea>
        <div class="krow"><label>Due<input id="kdue" type="datetime-local" value="${localInput(def)}"></label>
          <label>Remind<select id="klead">${LEADS.map(([m,l])=>`<option value="${m}" ${m===60?'selected':''}>${l}</option>`).join('')}</select></label></div>
        <label class="kreprow">Repeats<select id="krep"><option value="">Doesn’t repeat</option><option value="day">Every day</option><option value="week">Every week (same day)</option></select></label>
        <div id="kphprev">${kNewPhoto ? `<div class="ph phsm" style="background-image:url(${kNewPhoto})"><span>📷 Goes with this task</span></div>` : ''}</div>
        <div class="krow"><label class="btn ghost phpick" style="margin:0">📷 ${kNewPhoto ? 'Change photo' : 'Add photo'}<input type="file" id="kphin" accept="image/*" hidden></label>
          ${kNewPhoto ? '<button type="button" class="btn ghost" id="kphx">Remove photo</button>' : ''}</div>
        <button class="btn" type="submit" style="width:100%">Send task</button>
      </form>` + lists;
    app.querySelectorAll('[data-kfor]').forEach(b=>b.onclick=()=>{ kidFor=b.dataset.kfor; try{ localStorage.setItem(LS+'-kidfor', kidFor); }catch(e){}
      app.querySelectorAll('[data-kfor]').forEach(x=>x.setAttribute('aria-checked', x.dataset.kfor===kidFor)); });
    app.querySelector('[data-kadd]').addEventListener('submit', e=>{
      e.preventDefault();
      const i=document.getElementById('newi'), t=i.value.trim(); if(!t){ i.focus(); return; }
      const v=document.getElementById('kdue').value, due = v ? new Date(v).getTime() : null;
      const lead = +document.getElementById('klead').value || 60, note = document.getElementById('knote').value.trim();
      const to = kidFor==='both' ? KIDS.map(k=>k.id) : [kidFor];
      const rp = document.getElementById('krep').value;
      if (rp){
        if (!due){ toast('Pick a due time so it knows when to repeat.'); return; }
        const dd = new Date(due), time = String(dd.getHours()).padStart(2,'0') + ':' + String(dd.getMinutes()).padStart(2,'0');
        const days = rp==='day' ? [0,1,2,3,4,5,6] : [dd.getDay()];
        to.forEach(k=>data.repeats.push({id:uid(), to:k, text:t, note, days, time, lead, c:now() - 60000, u:now()}));
        rollRepeats(); kNewPhoto = ''; save(); render(); toast('🔁 ' + repText({days, time})); return;
      }
      const pic = kNewPhoto; kNewPhoto = '';
      to.forEach(k=>{ const c={id:uid(), to:k, text:t, note, due, lead, status:'new', c:now(), u:now()};
        if (pic) { c.ph = now(); phSend('task-' + c.id + '-m', pic, c.ph).catch(()=>toast('The photo didn’t send. Check your signal.')); }
        data.chores.push(c); pushChore('schedule', c); });
      save(); render(); toast(`Sent to ${kidFor==='both' ? 'both' : kidName(kidFor)}`);
    });
    app.querySelectorAll('[data-kdel]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.kdel;
      if (armed===id){ goneChore(data.chores.find(x=>x.id===id)); armed=null; save(); }
      else armed=id;
      render();
    });
    app.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.rdel, r=data.repeats.find(x=>x.id===id);
      if (armed==='r'+id){ remove(r); live(data.chores).filter(c=>c.rep===id && c.status!=='done' && c.status!=='missed').forEach(goneChore); armed=null; save(); toast('Stopped repeating'); }
      else armed='r'+id;
      render(); const d=app.querySelector(`[data-rdel="${id}"]`); if (d) d.closest('details').open=true;
    });
    const by=document.getElementById('boardyes'); if (by) by.onclick=()=>{
      BOARD.forEach(b=>data.repeats.push(Object.assign({id:uid(), note:'', c:now() - 60000, u:now()}, b)));
      rollRepeats(); save(); render(); toast('🔁 Chore board added');
    };
    const bn=document.getElementById('boardno'); if (bn) bn.onclick=()=>{ boardOff=true; try{ localStorage.setItem(LS+'-board','1'); }catch(e){} render(); };
    app.querySelectorAll('[data-kclear]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.kclear;
      if (armed==='kc'+k){ live(data.chores).filter(c=>c.to===k && (c.status==='done' || c.status==='missed')).forEach(goneChore); armed=null; save(); }
      else armed='kc'+k;
      render(); const d=app.querySelector(`[data-kclear="${k}"]`); if (d) d.closest('details').open=true;
    });
    const kin = document.getElementById('kphin');
    if (kin) kin.onchange = async ()=>{ const fl = kin.files && kin.files[0]; if (!fl) return;
      const keep = ['newi','knote','kdue','klead'].map(i=>document.getElementById(i).value);
      try { kNewPhoto = await phShrink(fl); } catch(e){ toast('Couldn’t open that picture.'); return; }
      render(); ['newi','knote','kdue','klead'].forEach((i,n)=>{ document.getElementById(i).value = keep[n]; }); };
    const kx = document.getElementById('kphx'); if (kx) kx.onclick = ()=>{ kNewPhoto = ''; const keep = ['newi','knote','kdue','klead'].map(i=>document.getElementById(i).value); render(); ['newi','knote','kdue','klead'].forEach((i,n)=>{ document.getElementById(i).value = keep[n]; }); };
    phLoad();
    // seeing the replies clears the yellow "new" marks
    if (live(data.chores).some(c=>c.news)){ setTimeout(()=>{ live(data.chores).forEach(c=>{ delete c.news; }); store(); renderNav(); }, 1500); }
  }

  // ---------- Honey-Do: her requests go to Joe's Home Hub at priority 5 ----------
  let hdNote = false;
  function renderHoneyDo(){
    const open = live(data.honeydo).filter(m=>!m.done).sort((a,b)=>(b.c||0)-(a.c||0));
    const rows = open.map(m=>`<div class="row">
        <button class="checkbtn" data-hdone="${m.id}" aria-label="Mark ${esc(m.text)} done"><span class="check" aria-hidden="true">✓</span></button>
        <div class="item" style="cursor:default"><span class="text">${esc(m.text)}${m.note?`<span class="hdnote">${esc(m.note)}</span>`:''}</span></div>
        <button class="x ${armed===m.id?'armed':''}" data-hdel="${m.id}" aria-label="Take back ${esc(m.text)}">${armed===m.id?'Remove?':'✕'}</button>
      </div>`).join('');
    app.innerHTML = header('Honey-Do') + `<form class="hdform" data-hdadd>
        <div class="addrow" style="margin:0"><input id="newi" type="text" placeholder="What needs doing?" aria-label="What needs doing" autocomplete="off" enterkeyhint="${hdNote?'next':'done'}"><button class="btn" type="submit">Add</button></div>
        ${hdNote ? `<textarea id="hdnote" rows="2" placeholder="Details for Joe (optional)" aria-label="Details for Joe"></textarea>` : `<button type="button" class="backlink" id="hdnotebtn">+ Add details</button>`}
      </form>
      <p class="sub" style="margin:2px 4px 10px">These go on Joe's Honey-Do list. When he finishes one, you'll get a heads-up here and it comes off.</p>` +
      (rows ? `<div class="section">Waiting on Joe · ${open.length}</div><div class="list">${rows}</div>` : `<div class="empty">Nothing waiting on Joe.<br>Enjoy it while it lasts.</div>`);
    const f = app.querySelector('[data-hdadd]');
    f.addEventListener('submit', e=>{
      e.preventDefault();
      const i = document.getElementById('newi'), t = i.value.trim(); if (!t){ i.focus(); return; }
      const n = document.getElementById('hdnote'), note = n ? n.value.trim() : '';
      data.honeydo.push({id:uid(), text:t, note, done:false, c:now(), u:now()});
      hdNote = false; save(); render(); toast("Sent to Joe's Honey-Do list");
    });
    const nb = document.getElementById('hdnotebtn'); if (nb) nb.onclick = () => { const v=document.getElementById('newi').value; hdNote = true; render(); const i=document.getElementById('newi'); i.value=v; document.getElementById('hdnote').focus(); };
    app.querySelectorAll('[data-hdone]').forEach(b=>b.onclick=()=>{
      const m = data.honeydo.find(x=>x.id===b.dataset.hdone); m.done = true; touch(m); armed=null; save(); render(); toast('Marked done. Off Joe\'s list too.');
    });
    app.querySelectorAll('[data-hdel]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.hdel;
      if (armed===id){ remove(data.honeydo.find(x=>x.id===id)); armed=null; save(); toast("Taken off Joe's list"); }
      else armed=id;
      render();
    });
  }

  // Tapping anywhere outside the item and its move buttons closes them.
  document.addEventListener('click', e=>{
    if (!picked) return;
    if (e.target.closest('[data-pick], .mover')) return;
    picked = null; render();
  });
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') sync(); });
  setInterval(()=>{ if(document.visibilityState!=='hidden') sync(); }, 20000);
  store();
  try { render(); } catch(e){ app.innerHTML = '<div class="empty">Something went wrong. Reload to try again.</div>'; }
  sync();
})();
</script>
</body>
</html>
