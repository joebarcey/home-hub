<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<meta name="theme-color" content="#f5f6f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151a17" media="(prefers-color-scheme: dark)">
<title>Kitchen Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
  /* Layout: one column, header + content + fixed bottom tab bar. Herb green on a faintly green-white. */
  :root{
    --bg:#f5f6f1; --card:#ffffff; --ink:#1d2420; --muted:#68736c; --line:#dfe3dc;
    --accent:#2f6b4f; --accent-ink:#ffffff; --accent-soft:#e3eee7; --warn:#b8452f; --done:#9aa49d;
    --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#151a17; --card:#1e2521; --ink:#e9eee9; --muted:#9aa69e; --line:#2e3832;
      --accent:#7cc39c; --accent-ink:#0f1a14; --accent-soft:#233a2d; --warn:#ef8a72; --done:#5f6a63;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
  button,input,textarea{font:inherit;color:inherit}
  #app{min-height:100%;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 88px) max(16px, env(safe-area-inset-left,0px))}
  header{display:flex;align-items:baseline;gap:12px;margin:6px 0 14px}
  h1{font:700 1.75rem/1.1 var(--display);margin:0;flex:1;letter-spacing:-.01em;text-wrap:balance}
  .sync{font-size:.8rem;color:var(--muted);white-space:nowrap}
  .sync.ok{color:var(--accent)} .sync.off{color:var(--warn)}
  .sub{color:var(--muted);font-size:.85rem}

  .addrow{display:flex;gap:8px;margin-bottom:14px}
  .addrow input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:1rem}
  .addrow input:focus,textarea:focus,.field:focus{outline:none;border-color:var(--accent)}
  .btn{border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
  .btn.danger{background:transparent;color:var(--warn);border:1.5px solid var(--line)}
  .btn:focus-visible,.tab:focus-visible,.item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .list{display:flex;flex-direction:column;background:var(--card);border-radius:16px;border:1px solid var(--line);overflow:hidden}
  .item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;background:none;width:100%;text-align:left;cursor:pointer}
  .item + .item, .row + .row{border-top:1px solid var(--line)}
  .check{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:transparent}
  .done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .done .text{color:var(--done);text-decoration:line-through}
  .text{flex:1;min-width:0;overflow-wrap:anywhere}
  .tag{display:inline-block;margin-left:6px;font-size:.72rem;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);vertical-align:1px;white-space:nowrap}
  .times{display:inline-block;margin-left:6px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .x{flex:0 0 auto;border:0;background:none;color:var(--muted);font-size:1.05rem;padding:6px 8px;border-radius:8px;cursor:pointer}
  .x.armed{color:var(--warn);font-size:.8rem;font-weight:600}
  .row{display:flex;align-items:center}
  .row .item{flex:1}
  .checkbtn{flex:0 0 auto;border:0;background:none;padding:13px 4px 13px 14px;cursor:pointer;display:grid;place-items:center}
  .checkbtn:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;border-radius:10px}
  .row .item.pickable{padding-left:8px}
  .item:disabled{cursor:default;color:inherit}
  .row.picked{background:var(--accent-soft)}
  .mover{display:flex;gap:6px;padding:8px 10px 10px;background:var(--accent-soft)}
  .mv{flex:1;border:1.5px solid var(--accent);background:var(--card);color:var(--accent);border-radius:10px;padding:9px 2px;font-weight:600;font-size:.85rem;cursor:pointer}
  .mv:disabled{opacity:.35;cursor:default}
  .mv:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .empty{color:var(--muted);text-align:center;padding:34px 16px;line-height:1.5}
  .foot{display:flex;justify-content:flex-end;margin-top:10px}
  .section{font:600 .78rem/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 4px 8px}

  /* Meals */
  .meal{display:flex;align-items:center;gap:12px;padding:12px 14px}
  .meal + .meal{border-top:1px solid var(--line)}
  .meal .info{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;cursor:pointer}
  .meal .name{font-weight:600;display:block;overflow-wrap:anywhere}
  .switch{position:relative;flex:0 0 auto;width:52px;height:32px;border-radius:99px;border:0;background:var(--line);cursor:pointer;transition:background .15s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
  .switch[aria-checked="true"]{background:var(--accent)}
  .switch[aria-checked="true"]::after{transform:translateX(20px)}

  /* Recipe editor */
  label{display:block;font-weight:600;margin:14px 2px 6px}
  .field,textarea{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:1rem}
  textarea{min-height:150px;resize:vertical;line-height:1.5}
  .hint{font-size:.8rem;color:var(--muted);margin:6px 2px 0}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .backlink{align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;cursor:pointer;margin-bottom:4px}

  nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);
    padding:6px max(6px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(6px, env(safe-area-inset-left,0px))}
  .tab{flex:1;border:0;background:none;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);cursor:pointer;position:relative}
  .tab .lbl{text-align:center;line-height:1.15}
  .tab .ic{font-size:1.25rem;line-height:1.2}
  .tab[aria-current="page"]{color:var(--accent);font-weight:600}
  .badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:.68rem;line-height:18px;font-weight:600}
  #toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:.9rem;display:none}
  @media (prefers-reduced-motion: reduce){ .switch,.switch::after{transition:none} }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<nav id="nav" aria-label="Sections"></nav>
<script>
(function(){
  // ---------- sync link: arrives once as #sync=..., remembered on this phone ----------
  const SPACE = 'kitchen';
  const LS = 'kitchen-board-v1', LS_DIRTY = LS + '-dirty', LS_SYNC = LS + '-sync', LS_TAB = LS + '-tab';
  function findSyncUrl(){
    const ok = u => /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u);
    let u = '';
    try {
      const m = location.hash.match(/[#&]sync=([^&]+)/);
      if (m){
        const v = decodeURIComponent(m[1]);
        if (ok(v)){ u = v; try { localStorage.setItem(LS_SYNC, u); } catch(e){} }
        try { history.replaceState(null, '', location.pathname); } catch(e){}
      }
    } catch(e){}
    if (!u){ try { const v = localStorage.getItem(LS_SYNC) || ''; if (ok(v)) u = v; } catch(e){} }
    return u;
  }
  const SYNC_URL = findSyncUrl();

  const LISTS = ['todo','groceries','shopping','recipes'];
  const TABS = [
    {id:'todo',      ic:'✓',  label:'To-Do'},
    {id:'groceries', ic:'🥕', label:'Weekly Shopping'},
    {id:'shopping',  ic:'🛍', label:'Desires & Needs'},
    {id:'meals',     ic:'🍽', label:'Meals'},
    {id:'recipes',   ic:'📖', label:'Recipes'}
  ];

  const app = document.getElementById('app'), nav = document.getElementById('nav');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const now = () => Date.now();
  const esc = s => { const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; };
  const live = a => (a||[]).filter(x=>!x.del);
  const touch = x => { x.u = now(); };
  const remove = x => { x.del = true; x.u = now(); };
  const norm = s => String(s||'').trim().toLowerCase().replace(/\s+/g,' ');

  // ---------- storage ----------
  let mem = null;
  function load(){
    let d = null;
    try { const s = localStorage.getItem(LS); if (s) d = JSON.parse(s); } catch(e){}
    d = d || mem || {};
    LISTS.forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
    return d;
  }
  let data = load();
  let dirty = true;
  try { dirty = localStorage.getItem(LS_DIRTY) !== '0'; } catch(e){}
  function setDirty(v){ dirty=v; try { localStorage.setItem(LS_DIRTY, v?'1':'0'); } catch(e){} }
  function store(){ mem = data; try { localStorage.setItem(LS, JSON.stringify(data)); } catch(e){} }
  function save(){ store(); setDirty(true); scheduleSync(); }

  // ---------- meals -> groceries ----------
  // A grocery item remembers which meals asked for it (from) and whether someone typed it in (manual).
  // "ground beef, taco shells. Cheese" -> three items. Dictation inserts commas when you say "comma".
  function splitList(text){
    return String(text||'').split(/\n|,|;|\.(?=\s|$)/)
      .map(t=>t.trim().replace(/^(and|also)\s+/i,''))
      .filter(Boolean)
      .map(t=>t.charAt(0).toUpperCase()+t.slice(1));
  }
  function ingredientsOf(r){ return (r.ingredients||[]).map(s=>String(s).trim()).filter(Boolean); }
  function reconcileMeal(r){
    const want = r.on && !r.del ? ingredientsOf(r) : [];
    const wantSet = new Set(want.map(norm));
    // Take this meal off items it no longer needs
    live(data.groceries).forEach(g=>{
      const from = g.from || [];
      if (!from.includes(r.id) || wantSet.has(norm(g.text))) return;
      g.from = from.filter(id=>id!==r.id); touch(g);
      if (!g.from.length && !g.manual && !g.done) remove(g);
    });
    // Put it on the items it needs
    want.forEach(text=>{
      const k = norm(text);
      let g = live(data.groceries).find(x=>!x.done && norm(x.text)===k);
      if (!g){ g = {id:uid(), text, done:false, from:[], c:now(), u:now()}; data.groceries.push(g); }
      if (!(g.from||[]).includes(r.id)){ g.from = (g.from||[]).concat(r.id); touch(g); }
    });
  }
  // Adding a meal or recipe whose name already exists opens that one instead of making a duplicate.
  function findOrMakeRecipe(name, turnOn){
    let r = live(data.recipes).find(x=>norm(x.name)===norm(name));
    if (!r){ r = {id:uid(), name, ingredients:[], steps:'', on:false, c:now(), u:now()}; data.recipes.push(r); }
    if (turnOn && !r.on){ r.on = true; touch(r); reconcileMeal(r); }
    save(); return r;
  }
  const recipeName = id => { const r = data.recipes.find(x=>x.id===id); return r && !r.del ? r.name : null; };

  // ---------- sync (merges into the data on screen, last change wins per item) ----------
  function replaceObj(t, s){
    Object.keys(t).forEach(k=>{ if(!(k in s)) delete t[k]; });
    Object.keys(s).forEach(k=>{ t[k]=s[k]; });
  }
  function mergeInto(d, remote){
    LISTS.forEach(k=>{
      if(!Array.isArray(d[k])) d[k]=[];
      const byId = new Map(d[k].map(x=>[x.id,x]));
      ((remote||{})[k]||[]).forEach(y=>{
        const x = byId.get(y.id);
        if (!x){ d[k].push(y); byId.set(y.id,y); }
        else if ((y.u||0) > (x.u||0)) replaceObj(x, y);
      });
    });
  }
  function fingerprint(d){ return JSON.stringify(LISTS.map(k=>(d[k]||[]).map(x=>x.id+':'+(x.u||0)).sort())); }

  let syncing=false, again=false, timer=null, status=SYNC_URL?'':'none', last=0;
  function scheduleSync(){ if(!SYNC_URL) return; clearTimeout(timer); timer=setTimeout(sync, 700); }
  function statusText(){
    return status==='ok' ? 'Synced ' + new Date(last).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})
      : status==='off' ? 'Offline, saved on phone' : status==='busy' ? 'Syncing…' : status==='none' ? 'This phone only' : '';
  }
  function showStatus(){ const el=document.getElementById('sync'); if(el){ el.className='sync '+status; el.textContent=statusText(); } }
  function setStatus(s){ status=s; showStatus(); }
  async function sync(){
    if (!SYNC_URL) return;
    if (syncing){ again=true; return; }
    syncing=true; setStatus('busy');
    try {
      const r = await fetch(SYNC_URL + '?action=get&space=' + SPACE + '&t=' + now(), {cache:'no-store'});
      if (!r.ok) throw new Error('get '+r.status);
      const remote = await r.json();
      const before = fingerprint(data);
      mergeInto(data, remote);
      store();
      if (dirty || fingerprint(data) !== fingerprint(remote||{})){
        setDirty(false);
        try {
          const p = await fetch(SYNC_URL + '?space=' + SPACE, {method:'POST', body: JSON.stringify(data)});
          if (!p.ok) throw new Error('post '+p.status);
        } catch(e){ setDirty(true); throw e; }
      }
      last = now(); setStatus('ok');
      if (fingerprint(data) !== before) refresh();
    } catch(e){ setStatus('off'); }
    syncing=false;
    if (again){ again=false; sync(); }
  }
  function refresh(){
    const a = document.activeElement;
    if (a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA')) return;   // don't interrupt typing
    render();
  }

  // ---------- view state ----------
  let tab = 'groceries';
  try { const t = localStorage.getItem(LS_TAB); if (TABS.some(x=>x.id===t)) tab = t; } catch(e){}
  let editing = null;   // recipe id being edited
  let armed = null;     // id waiting for a second tap to delete
  let typingTimer = null;    // short pause after typing, then the recipe saves itself
  let pendingCommit = null;   // saves the recipe being edited, whichever way you leave it
  function go(t){ if (pendingCommit) pendingCommit(); pendingCommit=null; picked=null; tab=t; editing=null; armed=null; try { localStorage.setItem(LS_TAB, t); } catch(e){} render(); window.scrollTo(0,0); }

  let toastTimer=null;
  function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display='none', 3500); }

  function header(title){ return `<header><h1>${esc(title)}</h1><span id="sync" class="sync"></span></header>`; }
  function addRow(ph, id='newi'){ return `<form class="addrow" data-add><input id="${id}" type="text" placeholder="${esc(ph)}" aria-label="${esc(ph)}" autocomplete="off" enterkeyhint="done"><button class="btn" type="submit">Add</button></form>`; }
  function wireAdd(fn){
    const f = app.querySelector('[data-add]'); if(!f) return;
    f.addEventListener('submit', e=>{ e.preventDefault(); const i=f.querySelector('input'); const t=i.value.trim(); if(!t){ i.focus(); return; } i.value=''; fn(t); const n=app.querySelector('[data-add] input'); if(n) n.focus(); });
  }

  // ---------- checklist screens (To-Do, Groceries, Shopping) ----------
  // Position on the list: o if it's been moved, otherwise when it was added.
  const pos = x => x.o != null ? x.o : (x.c||0);
  let picked = null;   // item showing its move buttons
  function moveItem(key, id, how){
    const open = live(data[key]).filter(x=>!x.done).sort((a,b)=>pos(a)-pos(b));
    const i = open.findIndex(x=>x.id===id); if (i<0) return;
    const it = open[i];
    if (how==='up' && i>0){ const n=open[i-1], a=pos(it), b=pos(n); it.o = a===b ? b-1 : b; n.o = a===b ? a : a; touch(it); touch(n); }
    else if (how==='down' && i<open.length-1){ const n=open[i+1], a=pos(it), b=pos(n); it.o = a===b ? b+1 : b; n.o = a; touch(it); touch(n); }
    else if (how==='top' && i>0){ it.o = pos(open[0]) - 1; touch(it); }
    else if (how==='bottom' && i<open.length-1){ it.o = pos(open[open.length-1]) + 1; touch(it); }
    else return;
    save();
  }

  function renderChecklist(key, title, ph, emptyMsg){
    const movable = key==='groceries';
    const items = live(data[key]).sort((a,b)=> (a.done-b.done) || (pos(a)-pos(b)));
    const openCount = items.filter(i=>!i.done).length;
    const doneCount = items.filter(i=>i.done).length;
    const rows = items.map(it=>{
      let tags = '';
      if (key==='groceries'){
        const meals = (it.from||[]).map(recipeName).filter(Boolean);
        const times = meals.length + (it.manual ? 1 : 0);   // how many meals (plus a hand-typed add) asked for it
        tags = (times>1 ? `<span class="times" aria-label="needed ${times} times">×${times}</span>` : '') +
          meals.map(n=>`<span class="tag">${esc(n)}</span>`).join('');
      }
      if (movable){
        const idx = items.indexOf(it), isPicked = picked===it.id && !it.done;
        return `<div class="row ${it.done?'done':''} ${isPicked?'picked':''}">
          <button class="checkbtn" data-toggle="${it.id}" aria-pressed="${!!it.done}" aria-label="${it.done?'Uncheck':'Check off'} ${esc(it.text)}"><span class="check" aria-hidden="true">✓</span></button>
          <button class="item pickable" data-pick="${it.id}" ${it.done?'disabled':''} aria-expanded="${isPicked}" aria-label="${esc(it.text)}, tap to move"><span class="text">${esc(it.text)}${tags}</span></button>
          <button class="x ${armed===it.id?'armed':''}" data-del="${it.id}" aria-label="Delete ${esc(it.text)}">${armed===it.id?'Delete?':'✕'}</button>
        </div>` + (isPicked ? `<div class="mover" role="group" aria-label="Move ${esc(it.text)}">
            <button class="mv" data-move="top" ${idx===0?'disabled':''}>⤒ Top</button>
            <button class="mv" data-move="up" ${idx===0?'disabled':''}>▲ Up</button>
            <button class="mv" data-move="down" ${idx>=openCount-1?'disabled':''}>▼ Down</button>
            <button class="mv" data-move="bottom" ${idx>=openCount-1?'disabled':''}>⤓ Bottom</button>
          </div>` : '');
      }
      return `<div class="row ${it.done?'done':''}">
        <button class="item" data-toggle="${it.id}" aria-pressed="${!!it.done}"><span class="check" aria-hidden="true">✓</span><span class="text">${esc(it.text)}${tags}</span></button>
        <button class="x ${armed===it.id?'armed':''}" data-del="${it.id}" aria-label="Delete ${esc(it.text)}">${armed===it.id?'Delete?':'✕'}</button>
      </div>`;
    }).join('');
    app.innerHTML = header(title) + addRow(ph) +
      (movable && openCount>1 && !picked ? `<p class="sub" style="margin:-4px 4px 8px">Tap an item to move it up or down. Tap the circle to check it off.</p>` : '') +
      (rows ? `<div class="list">${rows}</div>` : `<div class="empty">${emptyMsg}</div>`) +
      (doneCount ? `<div class="foot"><button class="btn ghost" id="clear">${armed==='clear'?'Tap again to clear':'Clear '+doneCount+' checked'}</button></div>` : '');
    wireAdd(raw=>{
      const many = key==='todo' ? [raw] : splitList(raw);   // to-dos can contain commas; lists split on them
      let dupes = 0;
      many.forEach(t=>{
        if (key==='groceries'){
          const ex = live(data.groceries).find(x=>!x.done && norm(x.text)===norm(t));
          if (ex){ if(!ex.manual){ ex.manual=true; touch(ex); } dupes++; return; }
          data.groceries.push({id:uid(), text:t, done:false, manual:true, from:[], c:now(), u:now()});
        } else data[key].push({id:uid(), text:t, done:false, c:now(), u:now()});
      });
      save(); render();
      if (dupes && many.length===1) toast('Already on the list');
      else if (many.length>1) toast(`Added ${many.length - dupes} item${many.length-dupes===1?'':'s'}`);
    });
    app.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{
      const it=data[key].find(x=>x.id===b.dataset.toggle); it.done=!it.done; touch(it); armed=null; if(picked===it.id) picked=null; save(); render();
    });
    app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
      picked = picked===b.dataset.pick ? null : b.dataset.pick; armed=null; render();
      const again = app.querySelector(`[data-pick="${b.dataset.pick}"]`); if (again) again.focus();
    });
    app.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{
      const id=picked; moveItem(key, id, b.dataset.move); render();
      const row = app.querySelector(`[data-pick="${id}"]`); if (row) row.scrollIntoView({block:'nearest'});
      const same = app.querySelector(`[data-move="${b.dataset.move}"]:not([disabled])`); if (same) same.focus();
    });
    app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.del;
      if (armed===id){ remove(data[key].find(x=>x.id===id)); armed=null; save(); }
      else armed=id;
      render();
    });
    const c=document.getElementById('clear');
    if (c) c.onclick=()=>{
      if (armed==='clear'){ items.filter(i=>i.done).forEach(remove); armed=null; save(); }
      else armed='clear';
      render();
    };
  }

  // ---------- Meals: every recipe is a meal you can put on the menu ----------
  function renderMeals(){
    const rs = live(data.recipes).sort((a,b)=> (!!b.on - !!a.on) || a.name.localeCompare(b.name));
    const onCount = rs.filter(r=>r.on).length;
    const row = r => {
      const n = ingredientsOf(r).length;
      return `<div class="meal">
        <button class="info" data-open="${r.id}"><span class="name">${esc(r.name)}</span><span class="sub">${n ? n+' ingredient'+(n>1?'s':'') : 'No ingredients yet, tap to add'}</span></button>
        <button class="switch" role="switch" aria-checked="${!!r.on}" aria-label="${esc(r.name)} on the menu" data-meal="${r.id}"></button>
      </div>`;
    };
    const on = rs.filter(r=>r.on), off = rs.filter(r=>!r.on);
    app.innerHTML = header('Meals') + addRow('New meal, like Taco Tuesday') +
      (rs.length ? `<p class="sub" style="margin:0 4px 8px">Turn a meal on and its ingredients go on Weekly Shopping. Turn it off and they come back off.</p>` : '') +
      (on.length ? `<div class="section">On the menu · ${onCount}</div><div class="list">${on.map(row).join('')}</div>` : '') +
      (off.length ? `<div class="section">${on.length?'Not this time':'All meals'}</div><div class="list">${off.map(row).join('')}</div>` : '') +
      (!rs.length ? `<div class="empty">No meals yet.<br>Add one above, then list its ingredients.</div>` : '');
    wireAdd(t=>{ const r=findOrMakeRecipe(t, true); tab='recipes'; editing=r.id; render(); window.scrollTo(0,0);
      toast(ingredientsOf(r).length ? `${r.name} is on the menu` : `${r.name} is on the menu. Add its ingredients below.`); });
    app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ tab='recipes'; editing=b.dataset.open; render(); window.scrollTo(0,0); });
    app.querySelectorAll('[data-meal]').forEach(b=>b.onclick=()=>{
      const r=data.recipes.find(x=>x.id===b.dataset.meal);
      r.on=!r.on; touch(r); reconcileMeal(r); save(); render();
      const n=ingredientsOf(r).length;
      if (r.on) toast(n ? `Added ${n} ingredient${n>1?'s':''} to Weekly Shopping` : `${r.name} has no ingredients yet`);
      else toast(`Took ${r.name} off Weekly Shopping`);
    });
  }

  // ---------- Recipes ----------
  function renderRecipes(){
    if (editing) return renderRecipe(editing);
    const rs = live(data.recipes).sort((a,b)=>a.name.localeCompare(b.name));
    const rows = rs.map(r=>`<button class="item" data-open="${r.id}"><span class="text"><b>${esc(r.name)}</b>${r.on?'<span class="tag">on the menu</span>':''}<br><span class="sub">${esc(ingredientsOf(r).slice(0,4).join(', ') || 'No ingredients yet')}${ingredientsOf(r).length>4?'…':''}</span></span><span class="sub" aria-hidden="true">›</span></button>`).join('');
    app.innerHTML = header('Recipes') + addRow('New recipe name') +
      (rows ? `<div class="list">${rows}</div>` : `<div class="empty">No recipes yet.<br>Add one above to save its ingredients and steps.</div>`);
    wireAdd(t=>{ const r=findOrMakeRecipe(t, false); editing=r.id; render(); window.scrollTo(0,0); });
    app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ editing=b.dataset.open; render(); window.scrollTo(0,0); });
  }

  function renderRecipe(id){
    const r = live(data.recipes).find(x=>x.id===id);
    if (!r){ editing=null; return renderRecipes(); }
    const ings = ingredientsOf(r);
    const ingRows = ings.map((t,i)=>`<div class="row"><span class="item" style="cursor:default"><span class="text">${esc(t)}</span></span>
        <button class="x ${armed==='ing'+i?'armed':''}" data-ingdel="${i}" aria-label="Remove ${esc(t)}">${armed==='ing'+i?'Remove?':'✕'}</button></div>`).join('');
    app.innerHTML = `<button class="backlink" id="back">‹ All recipes</button>` + header(r.name) + `
      <div class="list" style="margin-bottom:6px"><div class="meal"><div class="info" style="cursor:default"><span class="name">On the menu</span><span class="sub">${r.on ? 'On: these ingredients are on Weekly Shopping' : 'Off: turn on to add these ingredients to Weekly Shopping'}</span></div>
        <button class="switch" role="switch" aria-checked="${!!r.on}" aria-label="On the menu" id="onmenu"></button></div></div>
      <label for="rname">Name</label>
      <input class="field" id="rname" type="text" value="${esc(r.name)}" autocomplete="off">
      <label for="ingnew">Ingredients${ings.length?` · ${ings.length}`:''}</label>
      <form class="addrow" id="ingform" style="margin-bottom:10px"><input id="ingnew" type="text" placeholder="Add an ingredient" autocomplete="off" enterkeyhint="done"><button class="btn" type="submit">Add</button></form>
      ${ingRows ? `<div class="list">${ingRows}</div>` : ''}
      <p class="hint">Say or type one at a time, or a whole list with commas: "ground beef, taco shells, cheese". Each one becomes its own Weekly Shopping item.</p>
      <label for="rsteps">Steps</label>
      <textarea id="rsteps" placeholder="How to make it">${esc(r.steps||'')}</textarea>
      <div class="actions">
        <button class="btn" id="done">Done</button>
        <button class="btn danger" id="delr">${armed===r.id?'Tap again to delete':'Delete recipe'}</button>
      </div>`;
    // Hold on to THIS screen's fields, so a late save can never write into a different recipe.
    const fName=document.getElementById('rname'), fSteps=document.getElementById('rsteps'), fNew=document.getElementById('ingnew');
    const setIngredients = list => {
      r.ingredients = list; touch(r);
      if (r.on) reconcileMeal(r);
      save();
    };
    const commit = () => {
      if (!fName.isConnected || r.del) return false;   // this editor is gone
      let changed = false;
      const name = fName.value.trim() || r.name, steps = fSteps.value;
      if (name!==r.name || steps!==(r.steps||'')){ r.name=name; r.steps=steps; touch(r); changed=true; }
      // An ingredient typed in the box but not added yet still counts
      const pending = splitList(fNew.value);
      if (pending.length){ fNew.value=''; r.ingredients = ingredientsOf(r).concat(pending); touch(r); changed=true; }
      if (!changed) return false;
      if (r.on) reconcileMeal(r);
      save(); return true;
    };
    clearTimeout(typingTimer);
    [fSteps, fName].forEach(el=>el.addEventListener('input', ()=>{ clearTimeout(typingTimer); typingTimer=setTimeout(commit, 1200); }));
    [fName, fSteps].forEach(el=>el.addEventListener('change', ()=>{ if(commit()) { const h=app.querySelector('h1'); if(h) h.textContent=r.name; } }));
    document.getElementById('ingform').addEventListener('submit', e=>{
      e.preventDefault();
      const have = new Set(ingredientsOf(r).map(norm));
      const add = splitList(fNew.value).filter(t=>{ const k=norm(t); if(have.has(k)) return false; have.add(k); return true; });
      if (!add.length){ if (fNew.value.trim()){ fNew.value=''; toast('Already in this recipe'); } fNew.focus(); return; }
      fNew.value='';
      commit();   // keep any name/steps edits
      setIngredients(ingredientsOf(r).concat(add));
      armed=null; render();
      const again=document.getElementById('ingnew'); if(again) again.focus();
      if (add.length>1) toast(`Added ${add.length} ingredients`);
    });
    app.querySelectorAll('[data-ingdel]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.ingdel, key='ing'+i;
      if (armed===key){ commit(); const list=ingredientsOf(r); list.splice(i,1); setIngredients(list); armed=null; }
      else { commit(); armed=key; }
      render();
    });
    pendingCommit = commit;
    const leave = () => { commit(); pendingCommit=null; editing=null; armed=null; render(); window.scrollTo(0,0); };
    document.getElementById('back').onclick = leave;
    document.getElementById('done').onclick = () => { const changed=commit(); if(changed && r.on) toast('Saved. Weekly Shopping updated.'); else if(changed) toast('Saved'); leave(); };
    document.getElementById('onmenu').onclick = () => {
      commit(); r.on=!r.on; touch(r); reconcileMeal(r); save(); render();
      const n=ingredientsOf(r).length;
      toast(r.on ? (n?`Added ${n} ingredient${n>1?'s':''} to Weekly Shopping`:'Add ingredients so they reach the list') : 'Taken off Weekly Shopping');
    };
    document.getElementById('delr').onclick = () => {
      if (armed===r.id){ r.on=false; reconcileMeal(r); remove(r); armed=null; editing=null; save(); render(); toast('Recipe deleted'); }
      else { armed=r.id; commit(); render(); }
    };
  }

  // ---------- frame ----------
  function renderNav(){
    const openG = live(data.groceries).filter(g=>!g.done).length;
    const openT = live(data.todo).filter(g=>!g.done).length;
    const openS = live(data.shopping).filter(g=>!g.done).length;
    const onM = live(data.recipes).filter(r=>r.on).length;
    const counts = {todo:openT, groceries:openG, shopping:openS, meals:onM};
    nav.innerHTML = TABS.map(t=>`<button class="tab" data-tab="${t.id}" ${t.id===tab?'aria-current="page"':''}><span class="ic" aria-hidden="true">${t.ic}</span><span class="lbl">${t.label}</span>${counts[t.id]?`<span class="badge">${counts[t.id]}</span>`:''}</button>`).join('');
    nav.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
  }
  function render(){
    pendingCommit = null;   // the recipe screen sets it again if it's the one showing
    if (tab==='todo') renderChecklist('todo','To-Do','Add a to-do','Nothing to do. Suspicious, but enjoy it.');
    else if (tab==='groceries') renderChecklist('groceries','Weekly Shopping','Add an item','The list is empty.<br>Add items here, or turn on a meal in Meals.');
    else if (tab==='shopping') renderChecklist('shopping','Desires & Needs','Add a desire or need','Nothing here yet.<br>Add things you want or need to buy.');
    else if (tab==='meals') renderMeals();
    else renderRecipes();
    renderNav(); showStatus();
  }

  // Tapping anywhere outside the item and its move buttons closes them.
  document.addEventListener('click', e=>{
    if (!picked) return;
    if (e.target.closest('[data-pick], .mover')) return;
    picked = null; render();
  });
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') sync(); });
  setInterval(()=>{ if(document.visibilityState!=='hidden') sync(); }, 20000);
  store();
  try { render(); } catch(e){ app.innerHTML = '<div class="empty">Something went wrong. Reload to try again.</div>'; }
  sync();
})();
</script>
</body>
</html>
