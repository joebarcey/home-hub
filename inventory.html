  .item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer}

  @media (min-width:760px){ #app{max-width:1000px} }
  /* Match Home Hub: black background, Merienda script headings */
  :root{ --bg:#000; --card:#121212; --ink:#f2f2f2; --muted:#9a9a9a; --line:#2a2a2a; --accent:#7dff9a; --accent-soft:#14261a;
    --gold:#ffe66b; --hero:#1d6b45; --warn:#ffb35c; color-scheme:dark; }
  h1,.gname,.nm,.pname,.section,.gchip,.gbtn,.btn,.mini .mtop b,.hero .big{font-family:"Merienda",var(--font)}
  h1{font-weight:800} .gname,.nm{font-weight:700}
  .gimg.none,.pimg.none{background:linear-gradient(135deg,#1b2a21,#151515)}

  body.has-bg .gtile,body.has-bg .card,body.has-bg .item,body.has-bg .pcard,body.has-bg .gchip:not([aria-checked="true"]),body.has-bg .gtools input,body.has-bg .gbtn,body.has-bg .back,body.has-bg .seg{background-color:rgba(18,18,18,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}

  .bgmenu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-4px 0 12px}

  form.f input, form.f select, form.f textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--card);color:var(--ink);font-size:1rem}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:6px} .bar i{display:block;height:100%;background:var(--accent)}
  .empty{text-align:center;color:var(--muted);padding:40px 12px;background:var(--card);border:1.5px dashed var(--line);border-radius:18px}
  .catrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)} .catrow:first-child{border-top:0}
  .catrow input{flex:0 0 3.2rem;text-align:center} .catrow .nm{flex:1}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;z-index:9;max-width:90%;text-align:center}
  .gtools2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}

  .ctile .gimg{position:relative}
  .tapdet{position:relative;display:flex;align-items:center;justify-content:center}

  .grid.cats .ctile .pemoji{font-size:1.4rem;margin-bottom:40px}

<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
(function(){
  // ---------- sync link (same Google storage as Home Hub, in its own "inventory" space) ----------
  const ok = u => /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u);
  let SYNC_URL = '';
  try { const q = new URLSearchParams(location.search).get('sync'); if (q && ok(q)) { SYNC_URL = q; localStorage.setItem('cpd-sync', q); } } catch(e){}
  if (!SYNC_URL) { try { const v = localStorage.getItem('cpd-sync') || ''; if (ok(v)) SYNC_URL = v; } catch(e){} }
  const SPACE = 'inventory', LS = 'costperday-v1';

  const app = document.getElementById('app');
  const now = () => Date.now();
  const uid = () => now().toString(36) + Math.random().toString(36).slice(2,6);
  const esc = s => { const d = document.createElement('div'); d.textContent = s==null ? '' : String(s); return d.innerHTML; };
  const live = a => (a||[]).filter(x => !x.del && !x.soldOn);   // no sold items: once something's gone, it's removed
  const touch = x => { x.u = now(); };
  const DEFAULT_CATS = [
    {id:'veh', name:'Vehicles', ic:'🚗'}, {id:'book', name:'Books', ic:'📚'}, {id:'tool', name:'Tools', ic:'🔧'},
    {id:'jew', name:'Jewelry', ic:'💍'}, {id:'elec', name:'Electronics', ic:'📱'}, {id:'home', name:'Home & Furniture', ic:'🛋️'},
    {id:'out', name:'Outdoor & Sports', ic:'⛺'}, {id:'other', name:'Other', ic:'📦'}
  ].map((c,i) => Object.assign(c, {o:i, c:0, u:0}));

  // ---------- data ----------
  let data = null;
  try { data = JSON.parse(localStorage.getItem(LS) || 'null'); } catch(e){}
  if (!data) data = { items: [], cats: DEFAULT_CATS.map(c => Object.assign({}, c)) };
  ['items','cats'].forEach(k => { if (!Array.isArray(data[k])) data[k] = []; });
  if (!data.cats.length) data.cats = DEFAULT_CATS.map(c => Object.assign({}, c));
  let dirty = false;
  try { dirty = localStorage.getItem(LS + '-dirty') === '1'; } catch(e){}
  function store(){ try { localStorage.setItem(LS, JSON.stringify(data)); localStorage.setItem(LS + '-dirty', dirty ? '1' : '0'); } catch(e){} }
  function save(){ dirty = true; store(); scheduleSync(); }

  // ---------- money and days ----------
  const DAY = 864e5;
  const DEPR = 0.20;          // value drops 20% a year
  const UPKEEP_LOSS = 0.50;   // 50% of upkeep counts as acceptable loss
  const parseDate = s => { if (!s) return null; const p = s.split('-'); return new Date(+p[0], p[1]-1, +p[2]).getTime(); };
  const toInput = ms => { const d = new Date(ms); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
  const money = (n, dp) => (n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString(undefined, {minimumFractionDigits: dp==null ? 2 : dp, maximumFractionDigits: dp==null ? 2 : dp});
  const perDayFmt = n => n >= 100 ? money(n, 0) : n >= 1 ? money(n) : '$' + n.toFixed(n < .1 ? 3 : 2);
  const num = v => { const n = parseFloat(String(v||'').replace(/[^0-9.\-]/g,'')); return isFinite(n) ? n : 0; };
  // Everything about one item's cost, from purchase to today (or to the day it was sold)
  function calc(it){
    const start = parseDate(it.bought) || today0();
    const end = today0();
    const days = Math.max(1, Math.round((end - start) / DAY) + 1);
    const ms = live(it.maint);
    const maint = ms.reduce((s,m) => s + spent(m), 0);
    // what keeps coming: monthly + yearly charges still going, and loan interest over the next 12 payments
    const monthly = ms.filter(m => kindOf(m)==='m' && !m.end).reduce((s,m) => s + num(m.cost), 0);
    const yearly = ms.filter(m => kindOf(m)==='y' && !m.end).reduce((s,m) => s + num(m.cost), 0);
    const loanNext = ms.filter(m => kindOf(m)==='loan').reduce((s,m) => s + loan(m).next12, 0);
    const total = num(it.price) + maint;
    const perDay = total / days;
    const nextYear = monthly * 12 + yearly + loanNext;
    // Worth now: loses 20% of its value each year (price × 0.8 ^ years owned).
    // Sell-for target: get your money back, counting as acceptable loss the depreciation plus 50% of the upkeep.
    //   target = total put in − depreciation − 50% of upkeep (depreciation never below zero)
    const years = (days - 1) / 365.25, est = num(it.price) * Math.pow(1 - DEPR, years);
    const mine = num(it.curVal) > 0, value = mine ? num(it.curVal) : est;   // your own value wins over the 20%/yr estimate
    // If it's worth more than you paid, that's a gain, not a loss: depreciation stops at zero, so the target never tops what you put in.
    const depr = Math.max(0, num(it.price) - value), target = Math.max(0, num(it.price) + maint - depr - maint * UPKEEP_LOSS);
    return { days, maint, monthly, yearly, loanNext, ongoing: monthly + yearly / 12, total, perDay, perMonth: perDay * 30.44, perYear: perDay * 365.25,
      in365: (total + nextYear) / (days + 365), years, value, est, mine, depr, target, accepted: depr + maint * UPKEEP_LOSS, above: Math.max(0, target - value), gain: value - target };
  }
  // Monthly charges (insurance, payments, storage): one charge on the start date, then the same day each month,
  // until today or until it was stopped
  const kindOf = m => m.loan ? 'loan' : m.recur ? (m.freq==='y' ? 'y' : 'm') : 'once';
  // How many monthly (or yearly) charges have come due, from the first one up to today or the day it stopped
  function payments(m, yearly){
    const a = new Date(parseDate(m.date) || today0()), b = new Date(m.end ? Math.min(parseDate(m.end), today0()) : today0());
    let mo = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()) + (b.getDate() >= a.getDate() ? 1 : 0);
    if (yearly) return Math.max(0, Math.floor((mo - 1) / 12) + 1);
    return Math.max(0, mo);
  }
  // A loan on the item: the price already counts what you borrowed, so only the interest is added as a cost.
  // Standard monthly payment; interest each month = what's still owed × monthly rate.
  function loan(m){
    const L = m.loan || {}, amt = num(L.amt), r = num(L.apr) / 1200, n = Math.max(1, Math.round(num(L.term)) || 1);
    const pmt = r ? amt * r / (1 - Math.pow(1 + r, -n)) : amt / n;
    const made = Math.min(n, payments(m)), sched = [];
    let bal = amt;
    for (let k = 0; k < n; k++){ const i = bal * r; sched.push(i); bal -= (pmt - i); }
    const paid = sched.slice(0, made).reduce((s,x) => s + x, 0), all = sched.reduce((s,x) => s + x, 0);
    const next12 = m.end ? 0 : sched.slice(made, made + 12).reduce((s,x) => s + x, 0);
    return { pmt, made, n, paid, all, next12, left: Math.max(0, n - made) };
  }
  const spent = m => { const k = kindOf(m); return k==='loan' ? loan(m).paid : k==='m' ? num(m.cost) * payments(m) : k==='y' ? num(m.cost) * payments(m, true) : num(m.cost); };
  const cat = id => data.cats.find(c => c.id === id && !c.del) || {id:'other', name:'Other', ic:'📦'};
  const ownedText = d => d < 60 ? d + ' day' + (d>1?'s':'') : d < 730 ? Math.round(d/30.44) + ' months' : (d/365.25).toFixed(1).replace(/\.0$/,'') + ' years';

  // ---------- sync (merge by item, newest change wins) ----------
  function mergeList(a, b, nested){
    const by = new Map(a.map(x => [x.id, x]));
    (b||[]).forEach(y => {
      const x = by.get(y.id);

        document.getElementById('lprev').textContent = num(document.getElementById('la').value) && num(document.getElementById('lt').value)
          ? 'Payment ' + money(L.pmt) + '/mo · total interest ' + money(L.all) + ' · only the interest is added (the price already counts the loan)' : 'Only the interest gets added, since the price already counts what you borrowed.'; }
    }
    if (document.getElementById('mform')) {
      document.querySelectorAll('[data-mk]').forEach(b => b.onclick = () => { mkind = b.dataset.mk; paintKind(); });
      ['la','lr','lt','ld'].forEach(id => document.getElementById(id).oninput = paintKind);
      paintKind();
    }
    app.querySelectorAll('[data-medit]').forEach(b => b.onclick = () => { editMaint = b.dataset.medit; armed = null; render();
      const fm = document.getElementById('mform'); if (fm) fm.scrollIntoView({block:'center'}); });
    app.querySelectorAll('[data-mstop]').forEach(b => b.onclick = () => {
      const m = it.maint.find(x => x.id === b.dataset.mstop);
      if (armed === 's' + m.id) { m.end = toInput(now()); touch(m); touch(it); armed = null; save(); toast('Stopped. Past payments still count.'); } else armed = 's' + m.id;
      render();
    });
    const mf = document.getElementById('mform'); if (mf) mf.onsubmit = e => {
      e.preventDefault();
      if (!Array.isArray(it.maint)) it.maint = [];
      const endv = document.getElementById('mend').value;
      const em = editMaint===true ? null : it.maint.find(x => x.id===editMaint);
      const m = em || {id: uid(), c: now()};
      m.desc = document.getElementById('md').value.trim();
      delete m.recur; delete m.freq; delete m.loan; delete m.end;
      if (mkind==='loan') {
        const L = {amt: num(document.getElementById('la').value), apr: num(document.getElementById('lr').value), term: Math.round(num(document.getElementById('lt').value))};
        if (!L.amt || !L.term) { toast('Enter the amount borrowed and the length in months'); return; }
        m.loan = L; m.cost = 0; m.date = document.getElementById('ld').value || it.bought;
      } else {
        m.cost = num(document.getElementById('mc').value); m.date = document.getElementById('mdt').value;
        if (mkind==='m' || mkind==='y') { m.recur = true; if (mkind==='y') m.freq = 'y'; }
      }
      if (mkind !== 'once' && endv) m.end = endv;
      touch(m); if (!em) it.maint.push(m);
      touch(it); editMaint = false; save(); render(); toast((em ? 'Saved' : 'Added') + '. Now ' + perDayFmt(calc(it).perDay) + ' per day');
    };
    app.querySelectorAll('[data-mdel]').forEach(b => b.onclick = () => {
      const m = it.maint.find(x => x.id === b.dataset.mdel);
      if (armed === m.id) { m.del = true; touch(m); touch(it); armed = null; save(); } else armed = m.id;
      render();
    });
  }

  function renderEdit(){
    const it = openId ? live(data.items).find(x => x.id === openId) : null;
    const v = it || { name:'', cat: filter!=='all' && filter!=='home' ? filter : 'veh', price:'', bought: toInput(now()), note:'' };
    const cats = live(data.cats).sort((a,b) => (a.o||0) - (b.o||0));
    app.innerHTML = header(it ? 'Edit item' : 'Add item', true) +
      `<form class="f card" id="f">
        <label>Name<input id="n" value="${esc(v.name)}" placeholder="2019 F-150, Grandpa's watch, DeWalt drill…" autocomplete="off" required></label>
        <label>Category<select id="c">${cats.map(c => `<option value="${c.id}" ${v.cat===c.id?'selected':''}>${c.ic} ${esc(c.name)}</option>`).join('')}</select></label>
        <div id="isbnbox" style="display:${isBook(v.cat) ? 'grid' : 'none'};gap:4px"><div style="font-size:.85rem;font-weight:600;color:var(--muted)">ISBN</div>
          <div style="display:flex;gap:8px"><input id="isbn" inputmode="numeric" value="${esc(isbnFmt(v.isbn || ''))}" placeholder="Scan the barcode or type it" autocomplete="off" style="flex:1;min-width:0">
            <label class="btn ghost" style="cursor:pointer;white-space:nowrap;display:flex;align-items:center">📷 Scan<input type="file" id="isbnin" accept="image/*" hidden></label></div>
          <div id="isbnmsg" style="font-size:.84rem;color:var(--muted)"></div></div>
        <div class="two"><label>Price paid<input id="p" inputmode="decimal" value="${v.price===''?'':num(v.price)}" placeholder="0.00" required></label>
          <label>Date bought<input id="b" type="date" value="${esc(v.bought)}" required></label></div>
        <div><div style="font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:4px">Photo (optional)</div>
          <div class="pimg${photoUrl(it) ? '' : ' none'}" id="phprev" style="height:150px;border-radius:14px;${photoUrl(it) ? 'background-image:url(' + photoUrl(it) + ')' : ''}">${photoUrl(it) ? '' : '<span class="pemoji">📷</span>'}</div>
          <div class="two" style="margin-top:8px"><label class="btn ghost" style="text-align:center;cursor:pointer">📷 ${photoUrl(it) ? 'Change' : 'Add'} photo<input type="file" id="phin" accept="image/*" hidden></label>
            <button type="button" class="btn ghost" id="phdel" ${photoUrl(it) ? '' : 'disabled style="opacity:.4"'}>Remove photo</button></div></div>
        <label>Notes (optional)<textarea id="no" rows="2" placeholder="Serial number, where it's from, warranty…">${esc(v.note||'')}</textarea></label>
        <button class="btn wide">${it ? 'Save' : 'Add item'}</button>
      </form>`;
    document.getElementById('back').onclick = () => it ? go('item', it.id) : go(from);
    let newPhoto = null;   // data URL, '' to remove, null for no change
    const pv = document.getElementById('phprev');
    document.getElementById('phin').onchange = async e => {
      const fl = e.target.files && e.target.files[0]; if (!fl) return;
      try { newPhoto = await shrinkPhoto(fl); pv.classList.remove('none'); pv.style.backgroundImage = 'url(' + newPhoto + ')'; pv.innerHTML = ''; }
      catch(er){ toast("Couldn't open that picture. Try another one."); }
    };
    document.getElementById('phdel').onclick = () => { newPhoto = ''; pv.classList.add('none'); pv.style.backgroundImage = ''; pv.innerHTML = '<span class="pemoji">📷</span>'; };
    // ---- ISBN: scan the barcode from a picture, then look the book up ----
    const ib = document.getElementById('isbnbox'), ii = document.getElementById('isbn'), im = document.getElementById('isbnmsg');
    const say = (t, good) => { im.innerHTML = t; im.style.color = good ? 'var(--accent)' : 'var(--muted)'; };
    document.getElementById('c').addEventListener('change', e => { ib.style.display = isBook(e.target.value) ? 'grid' : 'none'; });
    let lookedUp = '';
    async function fillFrom(isbn){
      if (!isbn || lookedUp === isbn) return; lookedUp = isbn;
      say('🔎 Looking up the book…');
      const b = await bookLookup(isbn);
      if (!b) { say('ISBN ' + isbnFmt(isbn) + ' saved. Couldn’t find the title online, so type it in above.'); return; }
      const n = document.getElementById('n'), no = document.getElementById('no');
      if (!n.value.trim()) n.value = b.title;
      if (b.authors && !no.value.trim()) no.value = 'by ' + b.authors;
      say('📚 <b>' + esc(b.title) + '</b>' + (b.authors ? ' by ' + esc(b.authors) : '') +
        (n.value.trim() !== b.title ? ' · <a href="#" id="usetitle" style="color:var(--accent)">Use this title</a>' : ''), true);
      const ut = document.getElementById('usetitle'); if (ut) ut.onclick = e => { e.preventDefault(); n.value = b.title; ut.remove(); };
      if (newPhoto === null && !photoUrl(it) && b.cover) {
        const d = await coverToPhoto(b.cover);
        if (d && newPhoto === null) { newPhoto = d; pv.classList.remove('none'); pv.style.backgroundImage = 'url(' + d + ')'; pv.innerHTML = ''; }
      }
    }
    document.getElementById('isbnin').onchange = async e => {
      const fl = e.target.files && e.target.files[0]; e.target.value = ''; if (!fl) return;
      say('📷 Reading the barcode…');
      const code = await EAN.fromFile(fl);
      if (!code) { say('Couldn’t find a barcode in that picture. Get close, hold it straight, with good light, or type the number.'); return; }
      ii.value = isbnFmt(code);
      if (!/^97[89]/.test(code)) { say('Read ' + code + ', but that’s a store barcode, not an ISBN. Books have a second barcode starting with 978 or 979.'); return; }
      lookedUp = ''; fillFrom(code);
    };
    ii.addEventListener('change', () => { const c = isbnClean(ii.value); if (c) { ii.value = isbnFmt(c); fillFrom(c); } else if (ii.value.trim()) say('That doesn’t look like a full ISBN. Check the digits (10 or 13).'); });
    if (scanNow) { scanNow = false; document.getElementById('isbnin').click(); }
    document.getElementById('f').onsubmit = e => {
      e.preventDefault();
      const x = it || {id: uid(), maint: [], c: now()};
      x.name = document.getElementById('n').value.trim(); x.cat = document.getElementById('c').value;
      x.price = num(document.getElementById('p').value); x.bought = document.getElementById('b').value;
      x.note = document.getElementById('no').value.trim();
      { const raw = document.getElementById('isbn').value.trim(), c = isbnClean(raw);
        if (c) x.isbn = c; else if (!raw) delete x.isbn; else if (/^\d{12,13}$/.test(raw.replace(/\D/g, ''))) x.isbn = raw.replace(/\D/g, ''); }
      if (newPhoto !== null) savePhoto(x, newPhoto);
      touch(x); if (!it) data.items.push(x);
      save(); toast(it ? 'Saved' : 'Added'); go('item', x.id);
    };
  }

  function renderCats(){
    const cats = live(data.cats).sort((a,b) => (a.o||0) - (b.o||0));
    const used = id => live(data.items).some(i => i.cat === id);
    app.innerHTML = header('Categories', true) +
      `<div class="card">${cats.map(c => `<div class="catrow"><input data-ic="${c.id}" value="${esc(c.ic)}" aria-label="Icon for ${esc(c.name)}" style="border:1.5px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);font-size:1.2rem">
          <input class="nm" data-nm="${c.id}" value="${esc(c.name)}" aria-label="Name" style="border:1.5px solid var(--line);border-radius:10px;padding:9px;background:var(--bg)">
          ${used(c.id) ? '<span style="width:2.4rem"></span>' : `<button class="x ${armed===c.id?'armed':''}" data-cdel="${c.id}" aria-label="Remove ${esc(c.name)}">${armed===c.id?'Remove?':'✕'}</button>`}</div>`).join('')}</div>
      <form class="f card" id="cf"><div class="catrow" style="border:0;padding:0"><input id="ci" value="🏷️" aria-label="Icon" style="flex:0 0 3.2rem;text-align:center;border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:1.2rem">
        <input id="cn" placeholder="New category, like Firearms or Collectibles" autocomplete="off" style="flex:1"></div><button class="btn wide">＋ Add category</button></form>
      <div style="font-size:.82rem;color:var(--muted);margin:0 4px">Tap an icon to swap in any emoji. Categories with items in them can’t be removed.</div>
      <div class="section">Backup</div>
      <div class="card" style="display:grid;gap:10px">
        <button class="btn ghost wide" id="bkcopy">📤 Copy a backup of everything</button>
        <textarea id="bkin" rows="2" placeholder="Paste a backup here to bring it in" style="width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink)"></textarea>
        <button class="btn ghost wide" id="bkpaste">📥 Bring in this backup</button>
        <div style="font-size:.8rem;color:var(--muted)">Bringing in a backup adds its items. Nothing already here is lost.</div></div>`;
    document.getElementById('back').onclick = () => go(from);
    app.querySelectorAll('[data-ic]').forEach(i => i.onchange = () => { const c = data.cats.find(x => x.id === i.dataset.ic); c.ic = i.value.trim() || '📦'; touch(c); save(); });
    app.querySelectorAll('[data-nm]').forEach(i => i.onchange = () => { const c = data.cats.find(x => x.id === i.dataset.nm); if (i.value.trim()) { c.name = i.value.trim(); touch(c); save(); } });
    app.querySelectorAll('[data-cdel]').forEach(b => b.onclick = () => { const id = b.dataset.cdel; if (armed===id) { const c = data.cats.find(x => x.id===id); c.del = true; touch(c); armed = null; save(); } else armed = id; render(); });
    document.getElementById('bkcopy').onclick = async () => { const t = packData();
      try { await navigator.clipboard.writeText(t); toast('Backup copied. Paste it somewhere safe, like a note.'); }
      catch(e){ document.getElementById('bkin').value = t; document.getElementById('bkin').select(); toast('Select all and copy the text in the box'); } };
    document.getElementById('bkpaste').onclick = () => { const n = importPacked(document.getElementById('bkin').value);
      if (n < 0) toast("That doesn't look like a backup. Copy the whole thing and try again."); else { toast('Brought in ' + (n > 0 ? n + ' new item' + (n===1?'':'s') : 'the backup')); go(from); } };
    document.getElementById('cf').onsubmit = e => { e.preventDefault(); const n = document.getElementById('cn').value.trim(); if (!n) return;
      data.cats.push({id: uid(), name: n, ic: document.getElementById('ci').value.trim() || '🏷️', o: data.cats.length, c: now(), u: now()}); save(); render(); toast('Added ' + n); };
  }

  // ---------- photos: small JPEGs, kept on this phone and in a private Drive folder (through the Google script) ----------
  const PK = id => 'cpd-ph-' + id;
  function photoUrl(it){
    if (!it || !it.photo) return '';
    try { const c = JSON.parse(localStorage.getItem(PK(it.id)) || 'null'); if (c && c.v === it.photo) return c.d; } catch(e){}
    return '';
  }
  const asked = {};
  function loadPhotos(){
    pushPending();
    live(data.items).forEach(it => {
      if (!it.photo || photoUrl(it) || asked[it.id + ':' + it.photo] || !SYNC_URL) return;
      asked[it.id + ':' + it.photo] = 1;
      fetch(SYNC_URL + '?action=photo&id=' + encodeURIComponent(it.id) + '&t=' + now(), {cache:'no-store'}).then(r => r.json()).then(d => {
        if (!d || !d.ok || !d.data) return;
        const url = 'data:image/jpeg;base64,' + d.data;
        try { localStorage.setItem(PK(it.id), JSON.stringify({v: it.photo, d: url})); } catch(e){}
        markUp(it);
        document.querySelectorAll(`[data-photo="${it.id}"]`).forEach(el => { el.classList.remove('none'); el.style.backgroundImage = 'url(' + url + ')'; const em = el.querySelector('.pemoji'); if (em) em.remove(); });
      }).catch(() => {});
    });
  }
  // Shrink a picture from the camera or library to a 4:3 JPEG about 50 KB
  function shrinkPhoto(file){
    return new Promise((res, rej) => {
      const rd = new FileReader();
      rd.onload = () => { const img = new Image(); img.onload = () => {
        const W = 720, H = 540, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
        const sc = Math.max(W / img.width, H / img.height), w = img.width * sc, h = img.height * sc;
        cv.getContext('2d').drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
        res(cv.toDataURL('image/jpeg', 0.7)); }; img.onerror = rej; img.src = rd.result; };
      rd.onerror = rej; rd.readAsDataURL(file);
    });
  }
  function savePhoto(it, url){
    if (url) { it.photo = now(); try { localStorage.setItem(PK(it.id), JSON.stringify({v: it.photo, d: url})); } catch(e){} }
    else { it.photo = 0; try { localStorage.removeItem(PK(it.id)); } catch(e){} }
    if (SYNC_URL) fetch(SYNC_URL + '?action=photo', {method:'POST', body: JSON.stringify({id: it.id, data: url ? url.split(',')[1] : ''})})
      .then(r => r.json()).then(j => { if (j && j.ok) markUp(it); else if (url) toast('Photo saved on this phone. It will back up when it can.'); }).catch(() => {});
  }
  // Photos saved here but not yet in Drive (no connection, or Google said no) get sent up again
  const PUP = id => 'cpd-phup-' + id, pushed = {};
  function markUp(it){ try { localStorage.setItem(PUP(it.id), String(it.photo)); } catch(e){} }
  function pushPending(){
    if (!SYNC_URL) return;
    live(data.items).forEach(it => {
      const u = photoUrl(it); if (!u || pushed[it.id + ':' + it.photo]) return;
      try { if (localStorage.getItem(PUP(it.id)) === String(it.photo)) return; } catch(e){ return; }
      pushed[it.id + ':' + it.photo] = 1;
      fetch(SYNC_URL + '?action=photo', {method:'POST', body: JSON.stringify({id: it.id, data: u.split(',')[1]})})
        .then(r => r.json()).then(j => { if (j && j.ok) markUp(it); }).catch(() => {});
    });
  }

  // ---------- backup / move: everything packed into one link or code ----------
  const b64e = str => btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const b64d = str => decodeURIComponent(escape(atob(str.replace(/-/g,'+').replace(/_/g,'/'))));
  function packData(){ return b64e(JSON.stringify({items: data.items, cats: data.cats})); }
  function importPacked(code){
    let d = null; try { d = JSON.parse(b64d(String(code).trim().replace(/^.*#import=/, ''))); } catch(e){}
    if (!d || !Array.isArray(d.items)) return -1;
    const before = live(data.items).length;
    mergeList(data.items, d.items, 'maint'); mergeList(data.cats, d.cats || [], null);
    save(); return live(data.items).length - before;
  }
  window.__cpdMoveLink = () => 'https://joebarcey.github.io/home-hub/costperday.html' + (SYNC_URL ? '?sync=' + SYNC_URL : '') + '#import=' + packData();
  if (/^#import=/.test(location.hash)) {
    const n = importPacked(location.hash);
    try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
    setTimeout(() => toast(n < 0 ? "That link didn't work. Try copying it again." : 'Brought in your items' + (n > 0 ? ' (' + n + ' new)' : '')), 300);
  }
  let toastT = null;
  function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 2600); }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { sync(); render(); } });
  setInterval(() => { if (document.visibilityState !== 'hidden') sync(); }, 20000);
  render(); sync();
})();
</script>
</body>
